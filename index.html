<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="湟果视频">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>湟果视频</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:#0e0e10;color:#eee;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:40px;min-height:100vh}
header{position:sticky;top:0;z-index:50;background:rgba(14,14,16,.96);backdrop-filter:blur(12px);border-bottom:1px solid #1d1d22;padding:11px 12px 9px}
.bar{display:flex;align-items:center;gap:9px;max-width:1180px;margin:0 auto}
.logo{font-size:17px;font-weight:800;white-space:nowrap;flex:0 0 auto}
.logo span{color:#ff7a18}
.search{flex:1;display:flex;gap:7px;min-width:0}
input{flex:1;min-width:60px;font-size:16px;padding:10px 13px;border-radius:10px;border:1px solid #2b2b32;background:#17171c;color:#eee;outline:none;font-family:inherit}
input:focus{border-color:#ff7a18;background:#1b1b21}
button{font-size:15px;padding:10px 15px;border-radius:10px;border:0;background:#ff7a18;color:#fff;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
button:active{transform:scale(.96)}
button.gh{background:#212127;color:#bbb}
button.gh:active{background:#2b2b33}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:9px 0 1px;max-width:1180px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 14px;border-radius:20px;background:#191920;color:#8d8d97;font-size:14px;border:1px solid #26262e;cursor:pointer;white-space:nowrap;transition:.15s}
.tab.on{background:#ff7a18;color:#fff;border-color:#ff7a18;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:14px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:11px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}}
.item{background:#17171c;border:1px solid #22222a;border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.item:active{transform:scale(.97);border-color:#ff7a18}
.thumb{position:relative;width:100%;aspect-ratio:3/4;background:#22222a;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#4a4a55;font-size:26px}
.badge{position:absolute;top:6px;left:6px;background:rgba(255,122,24,.92);color:#fff;font-size:10.5px;padding:2px 6px;border-radius:5px;font-weight:600}
.badge.src{background:rgba(10,10,14,.72);color:#cfcfda;font-weight:500}
.item .t{font-size:12.5px;padding:8px 8px 3px;line-height:1.4;max-height:52px;overflow:hidden;color:#dcdce2;font-weight:500}
.item .e{font-size:11px;color:#6e6e7a;padding:0 8px 8px;margin-top:auto}
.load{text-align:center;color:#5a5a66;padding:44px 20px;font-size:14px}
.spin{display:inline-block;width:17px;height:17px;border:2px solid #2b2b33;border-top-color:#ff7a18;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.card{background:#16161b;border:1px solid #26262e;border-radius:14px;padding:15px;margin-top:14px}
.dhead{display:flex;gap:14px;flex-wrap:wrap}
.dcover{width:118px;aspect-ratio:3/4;border-radius:10px;object-fit:cover;background:#22222a;flex:0 0 auto}
.dinfo{flex:1;min-width:190px}
.dtitle{font-size:20px;font-weight:700;margin-bottom:7px;line-height:1.3}
.dmeta{color:#8b8b97;font-size:13px;line-height:1.9}
.dmeta em{color:#ff7a18;font-style:normal;font-weight:600}
.tag{display:inline-block;background:#212128;color:#9a9aa6;font-size:11.5px;padding:3px 9px;border-radius:6px;margin:3px 5px 0 0}
.tag.c{background:#2a1a10;color:#ff9a4d}
.ddesc{color:#8f8f9b;font-size:13.5px;line-height:1.75;margin-top:11px;white-space:pre-wrap}
.vwrap{margin-top:14px;background:#000;border-radius:12px;overflow:hidden;position:relative}
video{width:100%;display:block;background:#000;max-height:74vh}
.playbar{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#131318;border-top:1px solid #22222a;flex-wrap:wrap}
.playbar .curep{color:#ff7a18;font-weight:600;font-size:14px}
.eps{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.ep{padding:9px 14px;border-radius:9px;background:#1e1e25;color:#8fb4ff;font-size:14px;border:1px solid #2a2a33;cursor:pointer;transition:.12s;text-decoration:none;display:inline-block;font-family:inherit}
.ep:active,.ep.on{background:#ff7a18;color:#fff;border-color:#ff7a18}
.ep.on{font-weight:700}
/* EROSHORT: 付费集样式 */
.ep.locked{background:#221a12;color:#a07a3a;border-color:#3a2c18;position:relative}
.ep.locked .lockb{display:inline-block;margin-left:4px;padding:0 4px;border-radius:4px;background:#ffb02e;color:#231a08;font-size:10px;font-style:normal;font-weight:700;vertical-align:1px}
.back{display:inline-flex;align-items:center;gap:5px;color:#ff7a18;font-size:14.5px;margin-bottom:11px;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}
.pager{display:flex;gap:9px;justify-content:center;margin-top:22px}
.sec{font-size:15px;font-weight:700;margin:22px 0 11px;padding-left:10px;border-left:3px solid #ff7a18;color:#e8e8ee}
.err{background:#2a1416;border:1px solid #4a1f24;color:#ff8b8b;padding:14px;border-radius:11px;font-size:13.5px;line-height:1.7}
.hint{background:#1a1e2a;border:1px solid #26314a;color:#8fb0e0;padding:12px 14px;border-radius:11px;font-size:13px;line-height:1.7;margin-top:14px}
footer{text-align:center;color:#494951;font-size:11.5px;padding:28px 16px 12px;line-height:2}
.cfg{background:#16161b;border:1px solid #2a2a33;border-radius:12px;padding:14px;margin-top:14px;font-size:13.5px}
.cfg label{display:block;color:#8b8b97;margin-bottom:6px;font-size:13px}
.cfg .row{display:flex;gap:8px;margin-bottom:11px}
.cfg input{font-size:13px;padding:9px 11px}

/* ===== 收藏按钮 ===== */
.favbtn{background:none;border:1px solid #3a3a46;color:#9a9aa6;font-size:12.5px;padding:5px 11px;border-radius:8px;cursor:pointer;margin-left:10px;font-family:inherit;vertical-align:middle;transition:.15s}
.favbtn:hover{border-color:#ff7a18;color:#ff7a18}
.favbtn.on{background:#3a1a12;border-color:#ff7a18;color:#ff7a18;font-weight:600}

/* ===== 倍速栏 ===== */
.spdwrap{display:inline-flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center;font-size:11.5px;color:#6e6e7a}
.spd{background:#1e1e25;border:1px solid #2a2a33;color:#9a9aa6;font-size:11.5px;padding:4px 8px;border-radius:6px;cursor:pointer;font-family:inherit;transition:.12s}
.spd:hover{color:#ff7a18;border-color:#ff7a18}
.spd.on{background:#ff7a18;color:#fff;border-color:#ff7a18;font-weight:700}

/* ===== 继续播放提示 ===== */
.resume{margin-top:9px;background:#1a2a1e;border:1px solid #2a4a32;color:#8fe0a8;font-size:12.5px;padding:8px 12px;border-radius:9px}

/* ===== 无限滚动哨兵 ===== */
.sentinel{display:flex;align-items:center;justify-content:center;gap:9px;padding:26px 0 34px;color:#6e6e7a;font-size:13px}
.sentinel .spin{width:15px;height:15px;border-width:2px}

/* ===== 回到顶部 ===== */
#totop{position:fixed;right:16px;bottom:78px;z-index:60;width:42px;height:42px;border-radius:50%;background:#1e1e25;border:1px solid #3a3a46;color:#ff7a18;font-size:19px;font-weight:700;cursor:pointer;display:none;box-shadow:0 6px 20px rgba(0,0,0,.5);font-family:inherit}
#totop:hover{border-color:#ff7a18;background:#2a1a10}

/* ===== 我的页面 ===== */
.minehead{display:flex;align-items:center;justify-content:space-between;font-size:19px;font-weight:700;margin:4px 0 6px;color:#e8e8ee}
.mineacts{display:flex;gap:7px}
.mineacts .gh{font-size:12px;padding:5px 11px}
.minebtn{color:#ff7a18 !important}

/* ===== 双站切换 ===== */
.sitebar{display:flex;gap:6px;align-items:center;margin-left:4px}
.sitebtn{padding:8px 15px;border-radius:10px;background:#1b1b21;border:1px solid #2c2c36;color:#9a9aa6;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;line-height:1.2}
.sitebtn:hover{border-color:#4a4a58;color:#d0d0da}
.sitebtn.on{background:#2a1a10;border-color:#ff7a18;color:#ff7a18;font-weight:700}
.sitebtn[data-k="hd"].on{background:#0f2a20;border-color:#5ad1a0;color:#5ad1a0}
.sitebtn .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;background:#55555f}
.sitebtn.on .dot{background:currentColor}
.sitedesc{font-size:11.5px;color:#6e6e7a;margin:6px 0 0;padding:0 2px}

/* ===== 黄豆短剧 详情页 ===== */
.hdplay{margin-top:16px;padding:16px;border-radius:12px;background:#101a16;border:1px solid #1e3a2c}
.hdplaytip{font-size:13px;line-height:1.85;color:#8fb8a4}
.hdplaytip b{color:#5ad1a0;font-size:14px}
.hdplaybtn{display:inline-block;margin-top:12px;padding:12px 26px;border-radius:10px;background:#5ad1a0;color:#06210f;font-weight:700;font-size:15px;text-decoration:none;transition:.15s}
.hdplaybtn:hover{background:#73e0b2;transform:translateY(-1px)}
.hdlines{margin-top:14px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.hdlinetip{font-size:12px;color:#6e7e76}
.hdline{padding:6px 13px;border-radius:8px;background:#18251f;border:1px solid #2a4436;color:#8fb8a4;font-size:12.5px;text-decoration:none;transition:.15s;cursor:pointer}
.hdline:hover{border-color:#5ad1a0;color:#5ad1a0}
.hdline.on{background:#5ad1a0;border-color:#5ad1a0;color:#06210f;font-weight:700}
.hdlock{margin:8px 0;padding:14px;border-radius:10px;background:#1a1510;border:1px solid #4a3a1a;color:#ffcf5c;font-size:13.5px;line-height:1.8;text-align:center}
.tag.c{background:#123024;color:#5ad1a0}
.tabsup{display:inline-block;margin-left:4px;padding:0 5px;border-radius:6px;background:#2c2c36;color:#8d8d97;font-size:10.5px;font-style:normal;vertical-align:middle}
.tab.on .tabsup{background:#5ad1a0;color:#06210f}

/* ===== 轻提示 ===== */
.hgtoast{position:fixed;left:50%;bottom:66px;transform:translateX(-50%) translateY(14px);z-index:9999;
  padding:10px 20px;border-radius:22px;background:rgba(24,24,30,.95);border:1px solid #3a3a46;color:#e8e8ee;
  font-size:13.5px;opacity:0;transition:.22s;pointer-events:none;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
.hgtoast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================
   海角网 (hjw) —— 站点观感复刻
   源站主色 #e35d8a (玫红), 卡片圆角 + 阴影, 图文帖是纵向阅读流。
   这里只做视觉还原, 数据与交互仍走本项目的统一层。
   ============================================================ */

/* 板块主色 (切到海角时整站色调跟着走) */
html[data-site="hjw"] .logo span{color:#e35d8a}
html[data-site="hjw"] input:focus{border-color:#e35d8a;background:#1e1a1e}
html[data-site="hjw"] button{background:#e35d8a}
html[data-site="hjw"] .tab.on{background:#e35d8a;border-color:#e35d8a}
html[data-site="hjw"] .item:active{border-color:#e35d8a}
html[data-site="hjw"] .sec{border-left-color:#e35d8a}
html[data-site="hjw"] .back{color:#e35d8a}
html[data-site="hjw"] .dmeta em{color:#e35d8a}
html[data-site="hjw"] .sitebtn.on{background:#2a1220;border-color:#e35d8a;color:#e35d8a}
html[data-site="hjw"] .ep:active,html[data-site="hjw"] .ep.on{background:#e35d8a;border-color:#e35d8a}
html[data-site="hjw"] .spd.on{background:#e35d8a;border-color:#e35d8a}
html[data-site="hjw"] .spd:hover{color:#e35d8a;border-color:#e35d8a}
html[data-site="hjw"] .favbtn.on{background:#3a1226;border-color:#e35d8a;color:#e35d8a}
html[data-site="hjw"] .favbtn:hover{border-color:#e35d8a;color:#e35d8a}
html[data-site="hjw"] .tag{background:#241a20;color:#c090a4}
html[data-site="hjw"] .hgtoast{border-color:#5a2a3e}

/* --- 首页分区楼层 (源站首页按分类平铺) --- */
.hjwsect{margin:0 0 24px}
.hjwsect-h{display:flex;align-items:center;gap:9px;margin:0 0 11px;padding-bottom:9px;border-bottom:1px solid #26262e}
.hjwsect-h b{font-size:16.5px;font-weight:800;color:#eee;letter-spacing:.3px}
.hjwsect-h b::before{content:'';display:inline-block;width:3px;height:15px;background:#e35d8a;border-radius:2px;margin-right:8px;vertical-align:-2px}
.hjwsect-h .more{margin-left:auto;font-size:12.5px;color:#8d8d97;cursor:pointer;padding:4px 10px;border-radius:7px;border:1px solid #2b2b32;background:#17171c;transition:.15s}
.hjwsect-h .more:hover{color:#e35d8a;border-color:#e35d8a}

/* --- 海角卡片: 源站是竖版封面 + 两行标题 --- */
.grid.hjwgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
@media(min-width:700px){.grid.hjwgrid{grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:13px}}
.item.hjw{border-radius:10px;background:#17171c;border:1px solid #26262e;overflow:hidden}
.item.hjw .thumb{aspect-ratio:3/4;background:#1d1d24}
.item.hjw .thumb img{transition:transform .3s}
.item.hjw:active .thumb img{transform:scale(1.05)}
.item.hjw .t{font-size:12.5px;line-height:1.42;max-height:54px;padding:8px 8px 2px;color:#dedee4;font-weight:500}
.item.hjw .e{font-size:10.5px;color:#6e6e7a;padding:3px 8px 8px;display:flex;gap:8px;align-items:center;margin-top:auto}
.item.hjw .e .vp{color:#e35d8a}
.item.hjw .badge{background:rgba(227,93,138,.94)}
/* 图文帖角标 */
.item.hjw .badge.art{background:rgba(90,110,209,.92)}
/* 图片张数角标 */
.itag{position:absolute;left:6px;bottom:6px;background:rgba(10,10,14,.76);color:#dcdce4;font-size:10px;padding:2px 6px;border-radius:5px;backdrop-filter:blur(3px)}

/* --- 详情页 --- */
.hjwhead{margin-bottom:4px}
.hjwtitle{font-size:19px;font-weight:800;line-height:1.42;color:#f0f0f5;margin:0 0 9px}
@media(min-width:700px){.hjwtitle{font-size:23px}}
.hjwmeta{display:flex;flex-wrap:wrap;gap:7px 14px;align-items:center;color:#8b8b97;font-size:12.5px;margin-bottom:10px}
.hjwmeta .cat{color:#e35d8a;font-weight:600;cursor:pointer;text-decoration:none}
.hjwmeta .cat:hover{text-decoration:underline}
.hjwauthor{display:flex;align-items:center;gap:9px;padding:11px 0;border-top:1px solid #22222a;border-bottom:1px solid #22222a;margin-bottom:14px}
.hjwauthor img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#22222a;flex:0 0 auto}
.hjwauthor .nm{font-size:13.5px;font-weight:600;color:#dcdce2}
.hjwauthor .tm{font-size:11.5px;color:#6e6e7a}

/* --- 图文帖阅读流 --- */
.hjwart{font-size:15.5px;line-height:1.95;color:#d8d8e0;word-break:break-word}
.hjwart p{margin:0 0 14px}
.hjwart img{width:100%;height:auto;display:block;border-radius:9px;margin:14px 0;background:#1d1d24}
.hjwart br{content:'';display:block;height:6px}
.hjwart .defaultimg{margin:14px 0}
.hjwart .defaultimg img{margin:0}
.hjwart a{color:#e35d8a;word-break:break-all}
.hjwart blockquote{border-left:3px solid #3a3a46;padding-left:12px;color:#9a9aa6;margin:12px 0}
.hjwart video{max-height:none}
.hjwart h1,.hjwart h2,.hjwart h3{font-size:17px;font-weight:700;margin:20px 0 10px;color:#eee}
/* 图片点击放大 */
.hjwart img{cursor:zoom-in}
.hjwlb{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.hjwlb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.hjwlb .n{position:absolute;top:18px;left:50%;transform:translateX(-50%);color:#9a9aa6;font-size:13px;background:rgba(20,20,26,.9);padding:5px 14px;border-radius:14px}
.hjwlb .x{position:absolute;top:14px;right:16px;font-size:26px;color:#8d8d97;line-height:1;cursor:pointer}
.hjwlb .pv,.hjwlb .nx{position:absolute;top:50%;transform:translateY(-50%);font-size:30px;color:#c8c8d2;background:rgba(24,24,30,.8);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.hjwlb .pv{left:14px}
.hjwlb .nx{right:14px}

/* --- 相关推荐 --- */
.hjwrel{margin-top:26px}
.hjwrel-h{font-size:15px;font-weight:700;color:#e8e8ee;padding-left:10px;border-left:3px solid #e35d8a;margin-bottom:12px}

/* --- 顶部信息条 (仿源站) --- */
.hjwbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 16px;padding:10px 13px;background:#17171c;border:1px solid #26262e;border-radius:11px;font-size:12.5px;color:#8b8b97}
.hjwbar .k{color:#6e6e7a}
.hjwbar .v{color:#dedee4;font-weight:600}
.hjwbar .free{margin-left:auto;color:#6ad89a;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo" onclick="goHome()" style="cursor:pointer">湟果<span>视频</span></div>
    <div class="sitebar" id="sitebar"></div>

      <input id="q" placeholder="搜索片名（两个板块一起搜）/ 输入ID" autocomplete="off">

  <div class="tabs" id="tabs"></div>
</header>

  <script src="hg-es.js"></script>
  <script src="hg-stego.js"></script>

<script>
/* ===================== 配置 ===================== */
// 后端地址：部署 Cloudflare Worker 后把它填在这里
const DEFAULT_API = 'https://huangguo-web.cxykk919169.workers.dev';
let API = localStorage.getItem('hg_api') || DEFAULT_API;

// 记录 Worker 是否可用 (第一次失败后就不再重试, 直接用直连模式)
let WORKER_OK = null;      // null=未知, true=可用, false=不可用
let MODE_TOLD = false;     // 是否已经提示过用户

/* ===================== 双站配置 ===================== */
// 两个数据源:
//   hg (黄果短剧) —— GitHub Pages 前端 + 直连上游网页解析
//   hd (黄豆短剧) —— 官方公开 JSON API, 数据规整, 带分类/排行/搜索
const SITES = {
  hg: {
    key: 'hg',
    name: '黄果短剧',
    short: '黄果',
    color: '#ff7a18',
    desc: '主源 · 全站免费直取, 无付费墙',
    hasEps: true,
  },
  hd: {
    key: 'hd',
    name: '黄豆短剧',
    short: '黄豆',
    color: '#5ad1a0',
    desc: '官方接口 · 分类/排行/求剧榜齐全',
    hasEps: false,   // 播放源需登录, 详情页提供 H5 跳转
  },
  es: {
    key: 'es',
    name: 'EROSHORT',
    short: 'ERO',
    color: '#8b5cf6',
    desc: 'AI 漫改短剧 · 免费集可直接播放',
    hasEps: true,
  },
  hjw: {
    key: 'hjw',
    name: '海角网',
    short: '海角',
    color: '#e35d8a',
    desc: 'UGC 社区 · 视频帖正文与播放源全明文, 免登录免金币',
    hasEps: false,   // 单帖单视频, 不做选集
  },
};
let SITE = localStorage.getItem('hg_site') || 'hg';
if (!SITES[SITE]) SITE = 'hg';

function setSite(k) {
  if (!SITES[k]) return;
  SITE = k;
  localStorage.setItem('hg_site', k);
  curCat = ''; curPage = 1;
  curVid = null;
  curSrc = k;            // 详情页来源跟着板块走
  HD_CUR = null; HD_LINES = []; HD_LINE_I = 0;
  HJW_CATS_LOADED = false;   // 海角分类按板块重载
  document.documentElement.setAttribute('data-site', k);
  renderSiteBar();       // ← 之前漏了这句: 按钮高亮不刷新
  renderTabs();
  goHome();
}

/* ===================== 统一取数层 ===================== */
/**
 * 三级降级取数据:
 *   1. Worker API      (数据最全, 但 workers.dev 在国内被墙)
 *   2. 前端直连上游     (hg-direct.js, 浏览器本地解析, 国内可用)
 *   3. 抛错
 *
 * 黄豆短剧 (hd) 走它自己的 API + /api/hd 代理, 不参与上面的降级。
 */
function api(path, params) {
  // ---- 黄豆短剧分支 ----
  if (SITE === 'hd') return hdApi(path, params);

  // ---- 海角网分支 ----
  // 实测 (2026-10 runner): www.hjw01.com / hjw01.com **不发** Access-Control-Allow-Origin,
  // 只有 CDN 边缘 hjw1.com 带 * —— 而那台是 8KB 空壳。
  // 所以浏览器直连详情页会被 CORS 拦死, 必须走 Worker 的 /api/hjw/* 出网抓。
  // 前端本地的 HJWW 模块只在 Worker 不可达时兜底 (那时多半也直连不通, 但值得一试)。
  if (SITE === 'hjw') {
    const p = params || {};
    if (path === '/api/list') return hjwList(p);
    if (path === '/api/search') return hjwSearch(p.q);
    return hjwApi(path, p);
  }

  // ---- EROSHORT 分支 (上游挂 Cloudflare 校验, 取数统一走 Worker /api/es/*) ----
  if (SITE === 'es') {
    const p = params || {};
    if (path === '/api/list') return esList(p);
    if (path === '/api/search') return esSearch(p.q);
    return esApi(path, p);
  }

  const qs = params ? '?' + new URLSearchParams(params).toString() : '';

  // ---- 已经确定 Worker 不可用 → 直接走直连 ----
  if (WORKER_OK === false) return directApi(path, params);

  if (!API) {
    WORKER_OK = false;
    return directApi(path, params);
  }

  // 超时从 8s 降到 2.5s: workers.dev 被墙时是直接挂起, 等 8 秒用户以为卡死了
  const TIMEOUT = (WORKER_OK === null) ? 2500 : 5000;
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, TIMEOUT);
  const opts = { method: 'GET' };
  if (ctl) opts.signal = ctl.signal;

  return fetch(API + path + qs, opts).then(r => {
    clearTimeout(timer);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    WORKER_OK = true;
    return r.json();
  }).catch(err => {
    clearTimeout(timer);
    // Worker 挂了 → 降级到直连
    if (WORKER_OK !== true) {
      WORKER_OK = false;
      if (!MODE_TOLD) {
        MODE_TOLD = true;
        console.info('[湟果] Worker 不可达, 已切换到直连模式 (前端本地解析)');
      }
    }
    // 二级: 前端直连上游
    return directApi(path, params).catch(e2 => {
      // 三级: 静态快照 (Actions 每 30 分钟抓好的 data/hg-list.json)
      if (path === '/api/list') return hgListFallback(params, err || e2);
      if (path === '/api/search') return hgSearchFallback((params && params.q) || '', err || e2);
      throw (err || e2);
    });
  });
}

/* ===================== 海角网取数 ===================== */
/**
 * 海角网 (hjw01.com) —— UGC 社区, 帖子分「视频帖」和「图文帖」两种。
 *
 * 【为什么优先走 Worker】
 *   实测: www.hjw01.com / hjw01.com 都不发 Access-Control-Allow-Origin,
 *   浏览器 fetch 详情页会被 CORS 直接拦死。
 *   所以取数走 Worker 的 /api/hjw/* (服务端出网, 不受 CORS 约束)。
 *
 * 【三级降级】
 *   1. Worker /api/hjw/*  —— 正常路径
 *   2. 前端直连 HJWW       —— 极少数边缘环境 (CDN 节点带 ACAO 时) 能成
 *   3. 静态快照 data/hjw-list.json —— 上游整个挂了也不白屏 (只有索引, 无正文)
 *
 * 【关于「金币解锁」】
 *   站点 GOLD_PAYMENT_ENABLED 恒为 true, 但那只是充值入口的开关。
 *   实测 14 篇帖子的正文里 **不存在** 解锁/付费可见/购买后可见任何容器,
 *   图片和 m3u8 全部明文返回。站点 schema.org 自己也写着
 *   "isAccessibleForFree": true。→ 全部内容免费直取, 不做任何门槛。
 *
 * 【时效性】
 *   m3u8 带 auth_key=<到期时间戳>-..., 每次访问详情页重新签发,
 *   所以不能缓存死链 —— 每次播放都重新取一次详情。
 */
let HJW_CATS_LOADED = false;
const CATS_HJW = [{ id: '', name: '首页' }];

/* ===================== 海角图片解密 =====================
 * 图床字节流是 AES-128-CBC 密文 (key/iv 来自站方 js_app.config.js 的 crypto.media_*),
 * 原站由 z-image-loader 组件 fetch→解密→渲染; 直接 <img src> 拿到的是密文,
 * 浏览器解析失败 → 显示 alt (标题文字) —— 老板看到的「图片内容是标题」就是这个。
 * 图床发 ACAO:* , 浏览器可直接 fetch 密文自解; 明文图(万一站方改明文)直接用不折腾。 */
const HJW_MEDIA_KEY = 'f5d965df75336270';
const HJW_MEDIA_IV  = '97b60394abc2fbe1';
const HJW_DEC = {};          // url -> dataURL (内存缓存)
const HJW_BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

function u8ToWordArray(u8) {
  const w = [];
  for (let i = 0; i < u8.length; i++) {
    w[i >>> 2] = (w[i >>> 2] || 0) | (u8[i] << (24 - (i % 4) * 8));
  }
  return CryptoJS.lib.WordArray.create(w, u8.length);
}

async function hjwDecryptImage(url) {
  if (!url || !/^https?:\/\//i.test(url)) return url;
  if (HJW_DEC[url]) return HJW_DEC[url];
  const r = await fetch(url, { mode: 'cors' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const b = new Uint8Array(await r.arrayBuffer());
  // 明文图 (JPEG/PNG 头) 直接用
  if ((b[0] === 0xff && b[1] === 0xd8) || (b[0] === 0x89 && b[1] === 0x50)) {
    const blob = new Blob([b], { type: b[0] === 0x89 ? 'image/png' : 'image/jpeg' });
    const u = URL.createObjectURL(blob);
    HJW_DEC[url] = u;
    return u;
  }
  const dec = CryptoJS.AES.decrypt(
    { ciphertext: u8ToWordArray(b) },
    CryptoJS.enc.Utf8.parse(HJW_MEDIA_KEY),
    { iv: CryptoJS.enc.Utf8.parse(HJW_MEDIA_IV),
      mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.NoPadding });
  const out = 'data:image/jpeg;base64,' + dec.toString(CryptoJS.enc.Base64);
  HJW_DEC[url] = out;
  return out;
}

/** 单图绑定: 占位 → 解密 → 上图; 失败半透明占位 (alt 已空, 不出标题文字) */
function hjwDecryptBind(im, url) {
  im.setAttribute('data-dec', url);
  im.src = HJW_BLANK;
  im.onerror = function () { this.style.opacity = '0.35'; };
  hjwDecryptImage(url).then(u => { im.src = u; im.style.opacity = ''; })
    .catch(() => { im.style.opacity = '0.35'; });
}

/** 扫描页面上待解密图 (列表封面用 IntersectionObserver 懒解, 进视口才拉密文) */
let HJW_ENC_IO = null;
function hjwDecryptScan(root) {
  const imgs = (root || document).querySelectorAll('img[data-hjwenc]:not([data-done])');
  if (!imgs.length) return;
  if (!('IntersectionObserver' in window)) {
    imgs.forEach(im => { im.setAttribute('data-done', '1'); hjwDecryptBind(im, im.getAttribute('data-hjwenc')); });
    return;
  }
  if (!HJW_ENC_IO) {
    HJW_ENC_IO = new IntersectionObserver(es => {
      es.forEach(e => {
        if (!e.isIntersecting) return;
        const im = e.target;
        HJW_ENC_IO.unobserve(im);
        hjwDecryptBind(im, im.getAttribute('data-hjwenc'));
      });
    }, { rootMargin: '300px' });
  }
  imgs.forEach(im => { im.setAttribute('data-done', '1'); HJW_ENC_IO.observe(im); });
}

/** 保证 hg-hjw.js 已加载 + 注入 Worker 代理地址 (降级路径用) */
function hjwEnsure() {
  if (typeof HJWW === 'undefined') {
    return Promise.reject(new Error('海角模块未加载'));
  }
  if (API) HJWW.setProxy(API);
  return (WORKER_OK === false)
    ? HJWW.pickHost().then(() => HJWW)
    : Promise.resolve(HJWW);
}

/** 海角启动探测: 3s 定型 Worker 可用性。
 *  国内 workers.dev 被墙时不再让 hjwW 每层干等 20s 超时 ——
 *  探完 WORKER_OK=false, 后续 hjwW 直接 0ms 走快照。 */
let HJW_PROBE = null;
function hjwProbe() {
  if (HJW_PROBE) return HJW_PROBE;
  HJW_PROBE = new Promise(resolve => {
    if (!API || typeof fetch === 'undefined') { WORKER_OK = false; return resolve(false); }
    const ctl = ('AbortController' in window) ? new AbortController() : null;
    const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 3000);
    const opts = { method: 'GET' };
    if (ctl) opts.signal = ctl.signal;
    fetch(API + '/api/version', opts).then(r => {
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(j => {
      WORKER_OK = !!(j && j.build);
      console.info('[湟果] 海角: Worker ' + (WORKER_OK ? '可达' : '异常, 走快照'));
      resolve(WORKER_OK);
    }).catch(() => {
      clearTimeout(timer);
      WORKER_OK = false;
      console.info('[湟果] 海角: Worker 不可达, 走静态快照');
      resolve(false);
    });
  });
  return HJW_PROBE;
}

/** 调 Worker 的 /api/hjw/* */
function hjwW(path, params) {
  // 已探明 Worker 不可达 → 0ms 失败, 让降级链直接走快照, 不撞墙
  if (WORKER_OK === false) return Promise.reject(new Error('Worker 不可达'));
  const p = params || {};
  const o = {};
  Object.keys(p).forEach(k => { if (p[k] !== undefined && p[k] !== '') o[k] = p[k]; });
  const qs = new URLSearchParams(o).toString();
  const url = API + '/api/hjw' + path + (qs ? '?' + qs : '');
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  // 未探明时短超时 (3.5s, 配合 hjwProbe); 已探明可达才给长超时 (20s)
  const TIMEOUT = (WORKER_OK === null) ? 3500 : 20000;
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, TIMEOUT);
  const opts = { method: 'GET' };
  if (ctl) opts.signal = ctl.signal;
  return fetch(url, opts).then(r => {
    clearTimeout(timer);
    if (!r.ok && r.status !== 502) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(j => {
    clearTimeout(timer);
    if (!j || j.ok === false) throw new Error((j && j.error) || '海角接口失败');
    return j;
  }).catch(e => {
    clearTimeout(timer);
    // 超时/网络层失败 → 记住不可达, 后续请求不再撞墙 (HTTP 4xx/5xx 不算, Worker 活着)
    if (e && (e.name === 'AbortError' || e.name === 'TypeError')) WORKER_OK = false;
    throw e;
  });
}

/** 归一化单条 (列表/搜索共用) */
function hjwNorm(x) {
  return {
    id: String(x.id),
    title: x.title || '',
    cover: x.cover || '',
    date: x.date || '',
    reply: x.reply || '',
    views: x.views || '',
    author: x.author || '',
    isVideo: !!x.isVideo,
    isArticle: x.isArticle === true,
    imageCount: x.imageCount || 0,
    chars: x.chars || 0,
    epCount: 0,
    _src: 'hjw'
  };
}

function hjwList(params) {
  const p = params || {};
  const page = parseInt(p.page || '1', 10) || 1;

  // 首次进海角: 先把兜底分类摆上 (tab 立刻可见)
  if (!HJW_CATS_LOADED && !CATS_HJW.length) {
    CATS_HJW.push({ id: '', name: '首页' });
  }

  const viaWorker = () => hjwW('/list', { cat: p.cat, page: page }).then(j => {
    if (!HJW_CATS_LOADED && j.categories && j.categories.length) {
      CATS_HJW.length = 0;
      CATS_HJW.push({ id: '', name: '首页' });
      j.categories.forEach(c => CATS_HJW.push({ id: c.slug, name: c.name }));
      HJW_CATS_LOADED = true;
      renderTabs();
    }
    const items = (j.items || []).map(hjwNorm);
    // 首页/首屏空列表视为失败 —— 继续降级, 别拿空数据「假成功」糊住用户
    if (!items.length && page === 1) throw new Error('worker 列表为空');
    return { ok: true, source: 'hjw', page: page, items: items,
             total: items.length, hasMore: items.length > 0 };
  });

  // 首页首屏: 走一次 /sections 拿楼层 (全 11 板块 + 推荐, 服务端分 3 批并发)
  const viaSections = () => hjwW('/sections', { limit: 14 }).then(j => {
    const secs = (j.sections || []).map(s => ({
      slug: s.slug, name: s.name,
      items: (s.items || []).map(hjwNorm)
    }));
    const items = [], seen = new Set();
    secs.forEach(s => s.items.forEach(x => {
      if (seen.has(x.id)) return;
      seen.add(x.id); items.push(x);
    }));
    if (!items.length) throw new Error('sections 为空');
    return { ok: true, source: 'hjw', page: 1, items: items,
             sections: secs, total: items.length, hasMore: false };
  });

  // 降级 2: 静态快照 —— 实测 www/hjw01.com 不发 CORS 头, 浏览器直连必败,
  // 所以列表链不再放「前端直连」层白等 pickHost; 快照 189 条随时有货。
  const viaSnap = () => loadSnap('hjw-list').then(snap => {
    if (!snap) return { ok: false, error: '海角暂不可达', items: [] };
    if (p.cat) {
      // 快照条目带 catId (slug, 逗号分隔多值), 按板块过滤; 没匹配上就回全量
      const f = (snap.items || []).filter(x =>
        String(x.catId || '').split(',').indexOf(p.cat) >= 0);
      const its = (f.length ? f : snap.items).map(hjwNorm);
      return { ok: true, source: 'hjw', page: 1, snapshot: true,
               items: its, total: its.length, hasMore: false };
    }
    const its = (snap.items || []).map(hjwNorm).slice(0, 120);
    return { ok: true, source: 'hjw', page: 1, snapshot: true,
             items: its, total: its.length, hasMore: false };
  });

  // 首页首屏优先 sections; 其它情况先走 /list
  const primary = (!p.cat && page === 1) ? viaSections() : viaWorker();

  return primary
    .catch(() => viaWorker().catch(viaSnap))
    .catch(e => ({ ok: false, error: String((e && e.message) || e), items: [] }));
}

function hjwSearch(kw) {
  kw = String(kw || '').trim();
  if (!kw) return Promise.resolve({ ok: true, items: [] });
  return hjwW('/search', { q: kw })
    .then(j => ({ ok: true, source: 'hjw', keyword: kw,
                  items: (j.items || []).map(hjwNorm) }))
    .catch(() => loadSnap('hjw-list').then(snap => {
      // 直连搜索同样被 CORS 拦死, 直接快照本地过滤
      if (!snap) return { ok: false, error: '搜索不可用', items: [] };
      const low = kw.toLowerCase();
      const items = (snap.items || [])
        .filter(x => (x.title || '').toLowerCase().indexOf(low) >= 0)
        .map(hjwNorm);
      return { ok: true, source: 'hjw', keyword: kw, snapshot: true, items };
    }));
}

/** 海角详情: Worker 优先 → 前端直连 → 静态快照 (离线兜底) */
async function hjwDetail(id) {
  // 1) Worker (国内 workers.dev 常被墙, hjwW 已做探活定型)
  try {
    return await hjwW('/video', { id: id });
  } catch (e1) {
    // 2) 静态快照 —— 图文帖正文/图片都在快照里, 离线也能看完整内容。
    //    放在直连前面: 直连被 CORS 拦死还会卡 pickHost, 不能耽误快照。
    try {
      const snap = await hjwSnapDetail(id);
      if (snap) return snap;
    } catch (e2) { /* 往下走 */ }
    // 3) 浏览器直连 (竞速 3s: pickHost 逐个探镜像可能很慢, 不能等它)
    try {
      const d = await Promise.race([
        hjwEnsure().then(() => HJWW.detail({ id: id })),
        new Promise((_, rej) => setTimeout(() => rej(new Error('直连超时')), 3000))
      ]);
      if (d && d.ok) return d;
    } catch (e3) { /* 全失败 */ }
    throw e1;
  }
}

let _hjwSnapList = null;
async function hjwSnapDetail(id) {
  try {
    if (!_hjwSnapList) {
      const r = await fetch('data/hjw-list.json', { cache: 'force-cache' });
      if (!r.ok) return null;
      _hjwSnapList = await r.json();
    }
    const it = (_hjwSnapList.items || []).find(x => String(x.id) === String(id));
    if (!it) return null;
    // 相关推荐: 快照里挑同板块的其它帖
    const rel = (_hjwSnapList.items || [])
      .filter(x => String(x.id) !== String(id)
                   && it.catName && x.catName === it.catName)
      .slice(0, 6)
      .map(x => ({ id: x.id, title: x.title, cover: x.cover }));
    return {
      ok: true, source: 'hjw-snap', offline: true,
      id: String(it.id), title: it.title || '', cover: it.cover || '',
      author: it.author || '', avatar: '', date: it.date || '',
      views: it.views || '', tags: it.tags || [],
      catName: it.catName || '', catId: it.catId || '',
      artHtml: it.artHtml || '', artText: it.artText || '',
      images: it.images || [], imageCount: it.imageCount || 0,
      isVideo: !!it.isVideo, isArticle: !it.isVideo && (it.imageCount > 0 || !!it.artHtml),
      m3u8: '', m3u8_h265: '',       // 时效签名, 快照里不放
      payGated: false, related: rel,
      pageUrl: 'https://www.hjw01.com/archives/' + it.id + '/'
    };
  } catch (e) {
    return null;
  }
}

/** 通用取数: 目前只用到详情 */
function hjwApi(path, params) {
  const p = params || {};
  if (path === '/api/video' || path === '/api/detail') {
    return hjwDetail(p.id || p.vid);
  }
  if (path === '/api/ep') {
    return hjwDetail(p.id || p.vid).then(d => ({
      ok: !!d.m3u8, id: d.id, ep: String(p.ep || '1'), source: 'hjw',
      raw: d.m3u8, url: hjwProxied(d.m3u8),
      error: d.m3u8 ? '' : (d.isArticle ? '该帖为图文内容, 无视频' : '该帖不含视频')
    }));
  }
  return Promise.reject(new Error('海角未实现的接口: ' + path));
}

/* ===================== EROSHORT 取数 ===================== */
/**
 * EROSHORT (eroshort.net) 取数层。
 *
 * 为什么不能直连:
 *   站点挂 Cloudflare 人机校验 —— 裸 fetch /api/* 会被 403 拦 (返回挑战页)。
 *   实测 Worker 出口在 CF 白名单内, 能正常拿到 JSON。
 *   所以取数统一走 Worker 的 /api/es/* 转发 (见 worker.js 的 ES_API_BASE)。
 *
 * 上游接口 (REST, base = https://eroshort.net/api/v1):
 *   GET  /browse/layouts/short            首页轮播 + 推荐
 *   GET  /tags?schema=short_video...      分类标签
 *   GET  /shorts?page=&page_size=&q=&tag= 列表 / 搜索
 *   GET  /shorts/{id}                     详情
 *   GET  /hierarchy/short_video/{id}/children   集数列表
 *   GET  /playlines/episode/{epId}        播放线路
 *   GET  /wallet/entitlement/{epId}       权限 (FREE_CONTENT 可直接播)
 *   POST /playback/resolve                解析真实流地址
 *
 * 本地前端脚本 hg-es.js 已把上述契约封装好 (window.HGEs),
 * 这里只负责: 走 Worker 前缀 + 快照兜底。
 */
let ES_CATS_LOADED = false;
const CATS_MG = ES_CATS();            // 复用旧变量名, 减少改动面

/** 默认分类表 (来自上游 /tags, 加"全部") */
function ES_CATS() {
  const base = [{ id: '', name: '全部' }];
  const tags = (window.HGEs && window.HGEs.CATS) || [];
  tags.forEach(t => base.push({ id: t.code, name: t.name }));
  return base;
}

/** 动态刷新分类: 上游 /tags → 快照 data/es-cats.json → 内置兜底 */
async function ES_CATS_REFRESH() {
  if (window.HGEs && window.HGEs.refreshCats) {
    try {
      const r = await window.HGEs.refreshCats();
      if (r && r.items && r.items.length) return r;
    } catch (e) { /* 落到快照 */ }
  }
  try {
    const res = await fetch('data/es-cats.json', { cache: 'no-cache' });
    if (res.ok) {
      const j = await res.json();
      const rows = (j && j.categories) || [];
      if (rows.length) {
        return { ok: true, items: [{ id: '', name: '全部' }].concat(
          rows.map(c => ({ id: c.code || c.slug || c.name, name: c.name }))) };
      }
    }
  } catch (e) { /* 落到内置 */ }
  return { ok: true, items: ES_CATS(), source: 'builtin' };
}

/**
 * 走 Worker 取 JSON。
 * Worker 把 CF 挑战页统一转成 {ok:false,error:"CF_CHALLENGE"}(502),
 * 这里直接抛错, 由上层回退快照。
 */
function esApi(path, params) {
  const p = params || {};
  // path 形如 '/api/list' → 去掉前缀, 映射到上游子路径
  let sub = path.replace(/^\/api\/?/, '');
  const map = {
    'list': '/shorts',
    'video': '/shorts/' + encodeURIComponent(p.id || ''),
    'ep': '/playlines/episode/' + encodeURIComponent(p.epId || p.id || ''),
    'ent': '/wallet/entitlement/' + encodeURIComponent(p.id || ''),
    'home': '/browse/layouts/short',
    'tags': '/tags?schema=short_video&only_with_content=true',
    'search': '/shorts',
    'resolve': '/playback/resolve',
  };
  const target = map[sub] || ('/' + sub);

  const q = {};
  if (sub === 'list' || sub === 'search') {
    if (p.page) q.page = p.page;
    if (p.pageSize) q.page_size = p.pageSize;
    if (p.cat) q.tag = p.cat;
    if (p.q) q.q = p.q;
    if (p.sort) q.sort = p.sort;
  }
  const qsStr = new URLSearchParams(q).toString();

  const url = API + '/api/es' + target + (qsStr ? (target.indexOf('?') >= 0 ? '&' : '?') + qsStr : '');
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 18000);
  const opts = { method: 'GET' };
  if (ctl) opts.signal = ctl.signal;

  return fetch(url, opts).then(r => {
    clearTimeout(timer);
    return r.json().catch(() => ({ ok: false, error: 'HTTP ' + r.status }));
  }).catch(e => {
    clearTimeout(timer);
    throw e;
  });
}

/**
 * 静态快照兜底。
 * 上游挂 CF 拦截 / Worker 不可达时, 读 data/es-list.json, 站点不白屏。
 */
const SNAP = {};   // { 'mg-list': {...}, ... }

function loadSnap(name) {
  if (SNAP[name]) return Promise.resolve(SNAP[name]);
  const url = 'data/' + name + '.json';
  return fetch(url, { cache: 'no-cache' })
    .then(r => (r.ok ? r.json() : null))
    .then(j => {
      if (!j) return null;
      // es-detail.json 用的是 details 字段 (数组), 其余快照用 items
      const has = (j.items && j.items.length) ||
                  (j.plays && Object.keys(j.plays).length) ||
                  (j.details && (Array.isArray(j.details) ? j.details.length : Object.keys(j.details).length));
      if (has) { SNAP[name] = j; return j; }
      return null;
    })
    .catch(() => null);
}

/**
 * EROSHORT 取数策略: 快照优先, 实时增强。
 *
 * 为什么反过来:
 *   eroshort.net 对所有数据中心出口 (Worker 边缘 / CI / 本地) 做 CF 硬拦,
 *   唯一可用通道是公共 CORS 中转, 而中转限流是常态 → 实时请求命中率低。
 *   若按"实时优先、失败兜底", 用户每次都要等超时再出内容, 体验差且常白屏。
 *   所以并发发起实时请求 + 读快照:
 *     · 实时先回 → 用实时的 (最新集数)
 *     · 快照先回或实时失败 → 立刻渲染快照 (data/es-*.json 由 CI 定时抓)
 *   两条路都不空手, 用户永远能看到内容。
 */

/** 快照里的标签可能是字符串数组或 {code,name} 数组 → 统一成 code 列表 */
function esTagCodes(x) {
  const t = x && x.tags;
  if (!t) return [];
  // 上游 tags 里混有前导空格 (' 校园'), 不 trim 会永远匹配不上分类 tab
  const clean = v => String(typeof v === 'string' ? v : (v && (v.code || v.name)) || '').trim();
  if (Array.isArray(t)) return t.map(clean).filter(Boolean);
  if (typeof t === 'string') return t.split(/[,，\s]+/).map(clean).filter(Boolean);
  return [];
}

/**
 * 状态分类 (group=display_status) 在分类表里的 code 是 ongoing / completed,
 * 但条目的 tags 里写的是中文名 "更新中" / "已完结" —— code 与 tag 文本不一致,
 * 直接拿 code 去匹配 tags 会永远空。这里做 code → 中文名 的归一。
 * 返回 null 表示不是状态分类。
 */
function esStatusTag(cat) {
  const c = String(cat || '').trim().toLowerCase();
  if (c === 'ongoing' || c === '更新中') return '更新中';
  if (c === 'completed' || c === '已完结') return '已完结';
  return null;
}

/**
 * 从 es-detail 快照里按 id 取一条。
 * CI 端写出的 details 是数组 [{id, detail:{...}} | {id, eps,...}],
 * 历史版本写过对象 {id: {...}} —— 两种都兼容, 否则详情页会空。
 *
 * onlyWithEps: 默认 true。快照里有两种条目 —— 带集数表的 (能直接播) 和只有
 * meta 的。只有 meta 的拿去当"命中", 详情页会没有剧集列表, 反而不如走列表卡片
 * 分支 (至少标题/封面/标签是全的)。
 */
function esFindDetail(snap, id, onlyWithEps) {
  if (!snap || !snap.details || !id) return null;
  const needEps = onlyWithEps !== false;
  const D = snap.details;
  let hit = null;
  if (Array.isArray(D)) {
    const h = D.filter(x => x && x.id === id)[0];
    hit = h ? (h.detail || h) : null;
  } else {
    hit = D[id] || null;
  }
  if (!hit) return null;
  if (needEps && !(Array.isArray(hit.eps) && hit.eps.length)) return null;
  return hit;
}

/**
 * 在快照里按分类过滤。
 * 注意大小写陷阱: 分类 code 是 "绿帽ntr", 但卡片的 tags 里是显示名 "绿帽NTR"。
 * 直接 indexOf 会全空 → 必须大小写无关比较, 并同时比 name/code。
 */
function esFilterSnap(items, cat) {
  if (!cat) return items;
  const c = String(cat).trim().toLowerCase();
  if (!c) return items;
  // 状态分类单独走一条路: 否则 ongoing/completed 这两个 tab 永远是空的
  const st = esStatusTag(c);
  if (st) {
    return items.filter(x => {
      const codes = esTagCodes(x).map(v => String(v).toLowerCase());
      return codes.indexOf(st.toLowerCase()) >= 0;
    });
  }
  return items.filter(x => {
    const codes = esTagCodes(x).map(v => String(v).toLowerCase());
    if (codes.indexOf(c) >= 0) return true;
    if ((x.title || '').toLowerCase().indexOf(c) >= 0) return true;
    return false;
  });
}

/** EROSHORT 搜索: 快照立即出, 实时结果到了再替换 */
async function esSearch(kw) {
  kw = String(kw || '').trim();
  if (!kw) return { ok: true, items: [] };
  const low = kw.toLowerCase();
  const fromSnap = async () => {
    const snap = await loadSnap('es-list');
    if (!snap) return null;
    const items = snap.items.filter(x => (x.title || '').toLowerCase().indexOf(low) >= 0);
    return { ok: true, items, snapshot: true, source: 'es' };
  };
  const snap = await fromSnap();
  if (snap && snap.items.length) return snap;   // 快照命中: 不等网络
  try {
    const j = await esApi('/api/list', { q: kw, pageSize: 12 });
    if (j && j.items && j.items.length) return { ok: true, items: j.items, source: 'es' };
    throw new Error('空结果');
  } catch (e) {
    return snap || { ok: true, items: [], snapshot: true, source: 'es' };
  }
}

/**
 * EROSHORT 列表: 快照优先, 实时后台升级。
 *
 * 为什么不让"实时优先":
 *   Worker 侧每个中继要等 15-20s 超时, 4 个中继串行 = 用户白等 60-80s 才看到
 *   兜底快照。数据中心出口几乎必被 CF 拦, 实时命中率极低。
 *   改成立刻读本地 data/es-list.json (同源静态资源, 毫秒级), 实时请求丢到
 *   后台跑, 回来了再回调升级 UI —— 用户永远秒见内容。
 */
async function esList(params) {
  const cat = (params && params.cat) || '';
  const page = (params && params.page) || 1;
  const pageSize = Math.max(1, Math.min(48, (params && params.pageSize) || 48));
  const snap = await loadSnap('es-list');
  if (snap && snap.items && snap.items.length) {
    let items = esFilterSnap(snap.items, cat);
    const off = (page - 1) * pageSize;
    const slice = items.slice(off, off + pageSize);
    // 后台升级: 实时拿到了就通知调用方 (不阻塞本次返回)
    esListLive(cat, page, pageSize).catch(() => {});
    return {
      ok: true, items: slice, snapshot: true, source: 'es',
      total: items.length, page, hasMore: off + pageSize < items.length,
    };
  }
  // 没快照 (首次部署 / 快照丢失) → 只能等实时
  try {
    const j = await esApi('/api/list', { cat, page, pageSize });
    if (j && j.items && j.items.length) return j;
    throw new Error((j && j.error) || '空结果');
  } catch (e) {
    return { ok: true, items: [], snapshot: true, source: 'es', page, hasMore: false };
  }
}

/** 后台实时请求: 结果只用于刷新缓存, 失败静默 */
let _esLiveAt = 0;
async function esListLive(cat, page, pageSize) {
  const now = Date.now();
  if (now - _esLiveAt < 60000) return null;   // 60s 内不重复打
  _esLiveAt = now;
  try {
    const j = await esApi('/api/list', { cat, page, pageSize });
    if (j && j.items && j.items.length) {
      SNAP['es-list-live'] = j;
      return j;
    }
  } catch (e) { /* 静默 */ }
  return null;
}

/** 预取快照 (进 ERO 板块时调用), 让首屏不用等网络超时 */
function esWarmSnap() {
  loadSnap('es-list').catch(() => {});
  loadSnap('es-detail').catch(() => {});
}

/** EROSHORT 分类懒加载: 拉一次上游 /tags (失败回退 data/es-cats.json), 再重绘 tab */
async function loadMgCats() {
  if (ES_CATS_LOADED || SITE !== 'es') return;
  ES_CATS_LOADED = true;          // 先置位, 防止并发重入
  try {
    const r = await ES_CATS_REFRESH();
    if (r && r.items && r.items.length) {
      CATS_MG.length = 0;
      CATS_MG.push(...r.items);
    } else if (!CATS_MG.length) {
      CATS_MG.push(...ES_CATS());
    }
  } catch (e) {
    if (!CATS_MG.length) CATS_MG.push(...ES_CATS());
  }
  renderTabs();
}


/* ---------- EROSHORT: 详情 / 播放 桥接 ---------- */
/**
 * 详情 + 集数表。
 * 上游需要两次请求 (详情 /shorts/{id} + 集数 /hierarchy/.../children),
 * 这里在 Worker 侧合并成一次返回, 前端只发一跳。
 *
 * Worker 返回结构: { ok, meta:{id,title,cover,tags,description,...}, eps:[{id,ep,label,title,free}] }
 */
async function esVideo(id) {
  // 快照优先: data/es-detail.json 是本项目自身静态资源, 毫秒级返回, 不等上游。
  const snap = await loadSnap('es-detail');
  const d = esFindDetail(snap, id);
  if (d && d.eps && d.eps.length) {
    esVideoLive(id).catch(() => {});   // 后台升级
    return {
      ok: true,
      meta: {
        id: id,
        title: d.title || '',
        cover: d.cover || '',
        epTotal: d.eps.length,
        ...(d.meta || {}),
      },
      eps: d.eps.map((x, i) => ({
        id: x.id,
        ep: x.ep || i + 1,
        label: x.label || ('第' + (x.ep || i + 1) + '集'),
        title: x.title || '',
        free: null,
      })),
      snapshot: true,
      source: 'es',
    };
  }
  // 详情缺失或无集数 → 至少用列表快照的卡片信息, 别让页面空着
  const lst = await loadSnap('es-list');
  const c = lst && (lst.items || []).filter(x => x.id === id)[0];
  // 顺便捞一下只有 meta 的详情条目 (无 eps), 标题/简介可能比列表更全
  const dm = esFindDetail(snap, id, false);
  if (c || dm) {
    esVideoLive(id).catch(() => {});
    return {
      ok: true, snapshot: true, source: 'es', eps: [],
      meta: {
        id: id,
        title: (c && c.title) || (dm && dm.title) || '',
        cover: (c && c.cover) || (dm && dm.cover) || '',
        tags: (c && c.tags) || [],
        description: (dm && dm.desc) || (c && c.desc) || '',
        epTotal: (c && c.epCount) || (dm && dm.epTotal) || 0,
        views: (c && c.views) || (dm && dm.views) || 0,
      },
    };
  }
  // 连快照都没有 → 只能实时 (首次部署 / 快照丢失)
  try {
    const j = await esApi('/api/video', { id });
    if (j && j.ok) return { ok: true, meta: j.meta || {}, eps: j.eps || [], source: 'es' };
    throw new Error((j && j.error) || '详情失败');
  } catch (e) {
    if (d) return { ok: true, meta: d, eps: [], snapshot: true, source: 'es' };
    throw e;
  }
}

/** 后台实时详情: 结果写入 SNAP 供后续复用, 失败静默 */
let _esVidLiveAt = {};
async function esVideoLive(id) {
  const now = Date.now();
  if (_esVidLiveAt[id] && now - _esVidLiveAt[id] < 120000) return null;
  _esVidLiveAt[id] = now;
  try {
    const j = await esApi('/api/video', { id });
    if (j && j.ok && j.eps && j.eps.length) return j;
  } catch (e) { /* 静默 */ }
  return null;
}

/**
 * 取某一集的可播信息。
 * 返回 { ok, locked, url, format, free, reason }
 *  - 免费集: resolve 后拿到真实流地址 (direct 直连 / hls 走 hls.js)
 *  - 付费集: locked, 给原站跳转
 */
/**
 * ERO 静态播放快照 (data/es-play/<剧id>.json, 同源)
 *
 * 为什么必须有这一路:
 *   ERO 播放必须先 POST /api/v1/playback/resolve 拿授权, 而只有本站 Worker 的
 *   出口能过上游的风控。问题是 *.workers.dev 在国内被 DNS 污染 + SNI 封禁 ——
 *   浏览器根本连不上 Worker, 于是国内直连时"实时解析"必然失败,
 *   表现就是点开任意一集都不出画面。
 *
 *   静态快照由 CI 侧 (runner 能到 Worker) 生成, 落在同源的 data/es-play/ 下。
 *   它已经带好 license 与**去掉 grant 的分片地址** —— 上游 R2 公共桶不校验 grant,
 *   而 r2.dev 国内可达, 所以分片能浏览器直连。
 *
 *   全程 0 次实时上游请求 → 国内直连可用, 而且比实时路径更快。
 */
const _ES_STATIC = {};

async function esEpStatic(dramaId, epId) {
  if (!dramaId || !epId) return null;
  let m = _ES_STATIC[dramaId];
  if (m === undefined) {
    try {
      const r = await fetch('data/es-play/' + dramaId + '.json', { cache: 'no-cache' });
      m = r.ok ? await r.json() : null;
    } catch (e) { m = null; }
    _ES_STATIC[dramaId] = m;
  }
  const rec = m && m.eps && m.eps[epId];
  if (!rec || !rec.license) return null;
  return {
    ok: true, locked: false, format: 'stego_hls',
    m3u8: rec.m3u8 || null,
    url: null,
    license: rec.license,
    mediaId: rec.mediaId || null,
    assetVersion: rec.variantId || null,
    free: true, snapshot: true,
  };
}

/**
 * ERO 单集解析: 实时 (Worker) → 静态快照 双路。
 *
 * 顺序说明:
 *   Worker 可用时先用实时 (最新, 秒回); 不可用直接读静态, 不做无意义的超时等待。
 *   实时拿到 netError 时同样落静态 —— 直连国内时这就是常态。
 */
async function esResolveEp(dramaId, ep, epId) {
  if (WORKER_OK !== false) {
    try {
      const r = await esEp(epId);
      if (r && r.locked) return r;
      if (r && r.ok && (r.url || r.m3u8)) return r;
    } catch (e) { /* 落到静态 */ }
  }
  const s = await esEpStatic(dramaId, epId);
  if (s) return s;
  try { return await esEp(epId); }
  catch (e) { return { ok: false, locked: false, netError: true, reason: 'unreachable' }; }
}

async function esEp(epId) {
  let j = null;
  try {
    j = await esApi('/api/ep', { epId });
  } catch (e) {
    // Worker 不可达 / 超时 —— 这是网络故障, 不是"付费锁定", 必须区分开
    return { ok: false, locked: false, netError: true, reason: 'worker_unreachable' };
  }
  if (!j) return { ok: false, locked: false, netError: true, reason: 'empty_response' };

  // Worker/上游判定的真·锁定 (付费、VIP、登录) 才走 locked 分支
  if (j.ok === false && j.locked === true) {
    return { ok: false, locked: true, reason: j.reason || 'no_source' };
  }
  // 502 / CF_CHALLENGE / BAD_UPSTREAM 等 —— 上游被拦或中转限流, 属网络层
  if (j.ok === false && (j.error === 'CF_CHALLENGE' || j.error === 'BAD_UPSTREAM' || j.error)) {
    return { ok: false, locked: false, netError: true, reason: j.error, via: j.via || '' };
  }
  if (!j.ok) return { ok: false, locked: false, netError: true, reason: j.reason || 'unknown' };

  if (j.url) {
    if (j.format === 'stego_hls' && j.stego && j.stego.license) {
      return {
        ok: true, locked: false, format: 'stego_hls', url: j.url,
        license: j.stego.license, mediaId: j.mediaId || (j.stego && j.stego.media_id) || null,
        assetVersion: j.assetVersion || (j.stego && j.stego.variant_id) || null,
        expiresAt: j.expiresAt || null, free: true,
      };
    }
    return { ok: true, locked: false, url: j.url, format: j.format || 'direct', free: true };
  }
  return { ok: true, locked: false, pending: true, playline: j.playline, free: !!j.free };
}

/**
 * 指定来源取数 (全站搜索用):
 *   apiOf('hd', '/api/video', {id})  → 无论当前在哪个板块, 都走黄豆
 *   apiOf('hg', '/api/video', {id})  → 都走黄果
 * 和 api() 的区别只是 api() 跟随当前板块。
 */
function apiOf(src, path, params) {
  if (src === 'hd') return hdApi(path, params);
  if (src === 'es') return esApi(path, params);
  if (SITE === 'hg') return api(path, params);
  // 当前不在黄果板块但要取黄果的数据: 临时切一下再切回来, 避免污染全局状态
  const keep = SITE;
  SITE = 'hg';
  const p = api(path, params);
  SITE = keep;
  return p;
}

/**
 * 优先走 Worker 的 /api/hd/* 代理 (绕过可能的 CORS / 网络问题),
 * Worker 不可用则直接调官方 API (它带 CORS 头)。
 */
function hdApi(path, params) {
  if (typeof HDHd === 'undefined') return Promise.reject(new Error('黄豆短剧模块未加载'));
  const p = params || {};

  // Worker 代理优先 (已验证 WORKER_OK===false 时跳过)
  if (WORKER_OK !== false && API) {
    const map = {
      '/api/list': '/api/hd/list',
      '/api/search': '/api/hd/search',
      '/api/video': '/api/hd/video',
      '/api/categories': '/api/hd/categories',
      '/api/rankings': '/api/hd/rankings',
      '/api/wishes': '/api/hd/wishes',
      '/api/health': '/api/hd/health',
    };
    const hp = map[path];
    if (hp) {
      const qs = params ? '?' + new URLSearchParams(params).toString() : '';
      return fetch(API + hp + qs, { method: 'GET' }).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).catch(() => hdDirect(path, p));
    }
  }
  return hdDirect(path, p);
}

function hdDirect(path, p) {
  try {
    if (path === '/api/list')       return HDHd.list(p);
    if (path === '/api/search')     return HDHd.search(p.q, p.page);
    if (path === '/api/video')      return HDHd.video(p.id);
    if (path === '/api/categories') return HDHd.categories();
    if (path === '/api/rankings')   return HDHd.rankings(p.page);
    if (path === '/api/wishes')     return HDHd.wishes(p.page);
    if (path === '/api/health')     return HDHd.probe();
  } catch (e) {
    return Promise.reject(e);
  }
  return Promise.reject(new Error('未知接口: ' + path));
}

/**
 * 启动探测: 并行试 Worker 和直连, 谁先成功用谁
 * 这样国内用户不用等 workers.dev 超时。
 */
let BOOT_PROBE = null;
function bootProbe() {
  if (BOOT_PROBE) return BOOT_PROBE;

  function tryWorker() {
    if (!API || typeof fetch === 'undefined') return Promise.reject(new Error('无 API'));
    const ctl = ('AbortController' in window) ? new AbortController() : null;
    const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 3000);
    const opts = { method: 'GET' };
    if (ctl) opts.signal = ctl.signal;
    return fetch(API + '/api/health', opts).then(r => {
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(j => {
      if (!j || j.ok !== true) throw new Error('health 异常');
      return { mode: 'worker', ms: 0 };
    }).catch(e => { clearTimeout(timer); throw e; });
  }

  function tryDirect() {
    if (typeof HGDirect === 'undefined') return Promise.reject(new Error('无直连模块'));
    const t0 = Date.now();
    return HGDirect.probe().then(r => {
      if (!r || !r.ok || !r.count) throw new Error(r && r.error || '直连探测失败');
      return { mode: 'direct', ms: Date.now() - t0, count: r.count };
    });
  }

  BOOT_PROBE = new Promise(resolve => {
    let settled = false;
    const done = (m) => { if (!settled) { settled = true; resolve(m); } };

    tryWorker().then(m => {
      WORKER_OK = true;
      if (!MODE_TOLD) { MODE_TOLD = true; console.info('[湟果] 使用 Worker 模式'); }
      done(m);
    }).catch(() => {
      // Worker 失败不立即降级, 等直连结果
    });

    tryDirect().then(m => {
      if (!settled) {
        WORKER_OK = false;
        if (!MODE_TOLD) { MODE_TOLD = true; console.info('[湟果] 使用直连模式 (' + m.ms + 'ms, ' + m.count + ' 条)'); }
      }
      done(m);
    }).catch(() => {
      if (!settled) {
        // 两个都失败, 标记直连并让后续请求自己报错
        WORKER_OK = false;
      }
    });

    // 兜底: 4 秒还没结果就别拦着了
    setTimeout(() => done({ mode: 'timeout' }), 4000);
  });

  return BOOT_PROBE;
}

let LOADING_MORE = false;

const MAX_PAGES = 20;              // 黄果: 上游 114 页, 但滚到 20 页够了

// 黄豆短剧 985 部 / 每页 20 ≈ 50 页; 黄果保持 20 页上限
function maxPages() { return SITE === 'hd' ? 60 : MAX_PAGES; }

/**
 * 视图令牌: 每次导航 (首页/搜索/详情/切站) 自增。
 * 异步请求回来时如果令牌变了, 就丢弃结果 —— 防止"慢的旧请求覆盖新页面"。
 */
let VIEW_TOKEN = 0;
function newView() { return ++VIEW_TOKEN; }
function stale(t) { return t !== VIEW_TOKEN; }

/* ===================== 返回键接管 =====================
 * 进详情页 pushState 一层; 手机物理返回/手势返回触发 popstate → 回列表,
 * 不再直接退出网站。顶部「‹ 返回列表」按钮走 goBack() 同一条路。 */
let VIEW_DETAIL = false;
function pushDetailState() {
  VIEW_DETAIL = true;
  try { history.pushState({ hg: 'detail' }, '', location.href); } catch (e) {}
}
function goBack() {
  if (VIEW_DETAIL) history.back();   // popstate 统一处理
  else goHome();
}
window.addEventListener('popstate', () => {
  if (VIEW_DETAIL) {
    VIEW_DETAIL = false;
    goHome();
  }
});

async function goHome() {
  VIEW_DETAIL = false;   // 任意入口回列表都清掉详情标记, 防 popstate 循环
  const T = newView();
  app().innerHTML = '<div class="load"><span class="spin"></span>加载中…</div>';
  LOADING_MORE = false;
  HAS_MORE = true;
  curPage = 1;
  try {
    // 首屏先等探测结果 (谁快用谁), 避免国内用户白等 workers.dev 超时
    if (SITE === 'hg' && WORKER_OK === null) await bootProbe();
    // 黄豆短剧: 先拉分类
    if (SITE === 'hd' && !HD_CATS_LOADED) await loadHdCats();
    // EROSHORT: 先预热快照 + 拉分类 (上游走公共中转, 命中率不稳, 快照是主源)
    if (SITE === 'es') { esWarmSnap(); if (!ES_CATS_LOADED) await loadMgCats(); }
    // 海角: 先 3s 探测定型 Worker 可用性 (探不到直接快照, 不干等超时)
    if (SITE === 'hjw' && WORKER_OK === null) await hjwProbe();
    const j = await api('/api/list', { cat: curCat, page: 1 });
    if (stale(T)) return;                     // 期间用户已经切走/点进详情
    if (!j.items || !j.items.length) { app().innerHTML = '<div class="err">没有内容，稍后再试</div>'; return; }
    if (SITE === 'hg') applyCoverCache(j.items);

    // ---- 海角首页: 分区楼层 (复刻源站) ----

          '</section>';
      }).join('') +
      '<div class="sentinel" id="sentinel"><span id="sentineltxt">共 ' + secs.length + ' 个板块</span></div>';
      HAS_MORE = false;
      hjwDecryptScan();
      installScrollTop();
      return;
    }

    const gridCls = (SITE === 'hjw') ? 'grid hjwgrid' : 'grid';
    app().innerHTML =
      '<div class="' + gridCls + '" id="grid">' + j.items.map(cardHtml).join('') + '</div>' +

    if (SITE === 'hg') fillMissingCovers(j.items);
    if (SITE === 'hjw') hjwDecryptScan();

let SEEN_IDS = new Set();

// 加载下一页, 追加到列表末尾
async function loadMore() {
  if (LOADING_MORE || !HAS_MORE) return;
  if (curPage >= maxPages()) {
    HAS_MORE = false;
    const s = document.getElementById('sentineltxt');
    if (s) s.textContent = '已经到底了（共 ' + SEEN_IDS.size + ' 部）';
    return;
  }
  LOADING_MORE = true;
  const st = document.getElementById('sentineltxt');
  if (st) st.textContent = '正在加载…';
  try {
    const next = curPage + 1;
    // 黄豆短剧用 slug 筛选; 黄果用 cat
    const j = await api('/api/list', (SITE === 'hd' && curCat !== '')
      ? { cat: curCat, page: next }
      : { cat: curCat, page: next });
    const items = (j.items || []).filter(x => x && !SEEN_IDS.has(String(x.id)));
    if (!items.length) {
      // 这一页全是已见过的 (上游分页有重叠), 直接跳下一页继续试
      curPage = next;
      if (next >= maxPages()) {
        HAS_MORE = false;
        if (st) st.textContent = '已经到底了（共 ' + SEEN_IDS.size + ' 部）';
      }
      return;
    }
    items.forEach(x => SEEN_IDS.add(String(x.id)));
    applyCoverCache(items);
    const grid = document.getElementById('grid');
    if (grid) {
      const tmp = document.createElement('div');
      tmp.innerHTML = items.map(cardHtml).join('');
      while (tmp.firstChild) grid.appendChild(tmp.firstChild);
    }
    fillMissingCovers(items);
    if (SITE === 'hjw') hjwDecryptScan();
    curPage = next;
    if (st) st.textContent = '已加载 ' + SEEN_IDS.size + ' 部，继续下滑';
  } catch (e) {
    HAS_MORE = false;
    if (st) st.textContent = '加载失败，稍后再试';
  } finally {
    LOADING_MORE = false;
  }
}

// 用 IntersectionObserver 监听底部哨兵
let OBS = null;
function setupInfinite() {
  if (OBS) { OBS.disconnect(); OBS = null; }
  if (!('IntersectionObserver' in window)) {
    // 老浏览器降级: 监听滚动
    window.onscroll = () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 600) loadMore();
    };
    return;
  }
  window.onscroll = null;
  const sentinel = document.getElementById('sentinel');
  if (!sentinel) return;
  OBS = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (en.isIntersecting) loadMore();
    }
  }, { rootMargin: '600px 0px' });
  OBS.observe(sentinel);
}

/**
 * 封面 URL 包装
 * 黄果的封面在 pic.wirqed.cn (带 auth_key), 虽然返回 ACAO:* 但有些网络环境
 * 会被运营商拦截 / 混合内容拦。走 Worker /img 代理最稳; Worker 不可达时用原图。
 */
function coverUrl(u, src) {
  if (!u) return '';
  const s = String(u).trim();
  if (!/^https?:\/\//i.test(s)) return s;
  // 占位图直接透传, 没必要代理
  if (/cover-placeholder|placeholder\.(png|webp)/i.test(s)) return s;

  const cur = src || SITE;

  // 黄豆的封面是 CloudFront, 直连就很好, 不折腾
  if (cur === 'hd') return s;

  // EROSHORT: 封面在 Cloudflare R2 公开桶 (pub-*.r2.dev), 无防盗链,
  // <img> 不受 CORS 限制, 直接原图最稳 —— 走代理反而多一跳。
  if (cur === 'es') {
    return s;
  }

  // 海角: 图片床 pic.wlwvch.cn 无防盗链 + 国内直连通 + <img> 不受 CORS 限制,
  // 直接原图 —— 走 /proxy/ 反而在 Worker 被墙时挂起/失败 (实测 proxy 透传有问题)
  if (cur === 'hjw') {
    return s;
  }

  // 黄果: 封面是 AES 加密的, 必须走 /img 解密
  if (typeof API === 'string' && API && WORKER_OK !== false) {
    return API + '/img?u=' + encodeURIComponent(s);
  }
  return s;
}

/**
 * 卡片渲染
 * it.site 可选: 'hg' | 'hd' — 全站搜索结果里每条自带来源, 点进去才知道该走哪个播放器。
 * 不传就用当前板块 SITE。
 */
function cardHtml(it) {
  const src = it.site || SITE;
  const cv = coverUrl(it.cover, src);
  // data-hg="1" 会让 onerror 直接认输 (黄果封面是 AES 加密的, 直连必失败)。
  // ERO 封面是 R2 公链, 无防盗链, 直连通常成功; 万一失败也值得退回原图再试一次,
  // 所以 es 不打这个标记。
  const hgFlag = (src === 'hd' || src === 'hjw' || src === 'es') ? '' : ' data-hg="1"';
  const SITE_LABEL = { hd: '黄豆', es: 'ERO', hg: '黄果', hjw: '海角' };
  const tag = it.showSite
    ? '<div class="badge src" style="left:auto;right:6px;background:rgba(10,10,14,.72)">' +
      (SITE_LABEL[src] || '黄果') + '</div>'
    : '';

  // ---- 海角卡片 (复刻源站观感) ----
  if (src === 'hjw') {
    const isArt = it.isArticle || (it.kind === 'article');
    const kindBadge = isArt
      ? '<div class="badge art">图文</div>'
      : (it.isVideo ? '' : '');
    const imgTag = it.imageCount
      ? '<div class="itag">🖼 ' + it.imageCount + '</div>'
      : '';
    const sub = [
      it.views ? '<span class="vp">' + esc(it.views) + '</span>' : '',
      it.date ? '<span>' + esc(String(it.date).slice(5, 10)) + '</span>' : '',
    ].filter(Boolean).join('');
    return '<div class="item hjw" data-id="' + esc(it.id) + '" data-site="hjw"' +
      ' onclick="openVid(\'' + esc(it.id) + '\',\'hjw\')">' +
      '<div class="thumb">' +
        (cv
          ? '<img loading="lazy" alt="" data-hjwenc="' + esc(it.cover) + '">'
          : '') +
        '<div class="ph" style="' + (cv ? 'display:none' : '') + '">🎬</div>' +
        kindBadge + imgTag + tag +
      '</div>' +
      '<div class="t">' + esc(it.title) + '</div>' +
      '<div class="e">' + (sub || '') + '</div>' +
      '</div>';
  }

  return '<div class="item" data-id="' + esc(it.id) + '" data-site="' + esc(src) + '"' +
    ' onclick="openVid(\'' + esc(it.id) + '\',\'' + esc(src) + '\')">' +
    '<div class="thumb">' +
      (cv
        ? '<img loading="lazy" src="' + esc(cv) + '" data-raw="' + esc(it.cover) + '"' + hgFlag +
          ' onerror="hgImgFallback(this)">'
        : '') +
      '<div class="ph" style="' + (cv ? 'display:none' : '') + '">🎬</div>' +
      (it.ep ? '<div class="badge">' + it.ep + '集</div>' : '') +
      tag +
    '</div>' +
    '<div class="t">' + esc(it.title) + '</div>' +
    '<div class="e">' + (it.ep ? '共 ' + it.ep + ' 集' : '') + '</div>' +
    '</div>';
}

/**
 * 图片加载失败的多级兜底:
 *   黄果: 原图是 AES 加密的, 直连一定失败 → 直接认输显示占位, 别白试一次
 *   其余: 代理失败 → 试原图直连 → 还失败才认输
 */
function hgImgFallback(img) {
  const raw = img.getAttribute('data-raw') || '';
  const step = img.getAttribute('data-fb') || '0';
  const isHg = img.getAttribute('data-hg') === '1';
  if (!isHg && step === '0' && raw && img.src.indexOf('data:') !== 0) {
    // 第一步: 换成原图直连
    img.setAttribute('data-fb', '1');
    img.src = raw;
    return;
  }
  // 第二步: 认输, 显示占位
  img.style.display = 'none';
  const ph = img.nextElementSibling;
  if (ph && ph.classList.contains('ph')) ph.style.display = 'flex';
}

/**
 * 补齐缺失封面
 * 从列表解析出来的条目可能没有 cover (比如热搜榜来源的纯文字条目),
 * 这些条目后台单独去详情页抓 coverSrc, 抓到后原地更新 DOM。
 * 结果存 localStorage 永久缓存, 下次秒出。
 */
const COVER_CACHE_KEY = 'hg_cover_cache_v1';
let COVER_CACHE = (() => {
  try { return JSON.parse(localStorage.getItem(COVER_CACHE_KEY) || '{}'); }
  catch (e) { return {}; }
})();
let COVER_SAVE_T = null;

function saveCoverCache() {
  clearTimeout(COVER_SAVE_T);
  COVER_SAVE_T = setTimeout(() => {
    try {
      const keys = Object.keys(COVER_CACHE);
      // 只留最近 800 条, 防止 localStorage 爆掉
      if (keys.length > 800) {
        const keep = {};
        keys.slice(-800).forEach(k => { keep[k] = COVER_CACHE[k]; });
        COVER_CACHE = keep;
      }
      localStorage.setItem(COVER_CACHE_KEY, JSON.stringify(COVER_CACHE));
    } catch (e) { /* 配额满了就算了 */ }
  }, 300);
}

// 先用缓存里已有的封面, 一步补上
function applyCoverCache(items) {
  let n = 0;
  for (const it of items) {
    if (!it.cover && COVER_CACHE[it.id]) { it.cover = COVER_CACHE[it.id]; n++; }
  }
  return n;
}

async function fillMissingCovers(items) {
  const missing = items.filter(x => !x.cover && !COVER_CACHE[x.id]);
  if (!missing.length) return;

  // 限制并发 3 个, 别把上游打挂
  const QUEUE = missing.slice();
  let done = 0;

  async function worker() {
    while (QUEUE.length) {
      const it = QUEUE.shift();
      try {
        const v = await api('/api/video', { id: it.id });
        const cover = v && v.cover ? String(v.cover).trim() : '';
        if (cover && cover.startsWith('http')) {
          COVER_CACHE[it.id] = cover;
          saveCoverCache();
          patchCard(it.id, cover);
        }
      } catch (e) { /* 补不到就算了, 保持占位图 */ }
      done++;
    }
  }
  await Promise.all([worker(), worker(), worker()]);
}

// 原地把某张卡片的占位图换成真图 (不动整页, 不影响滚动位置)
function patchCard(id, cover) {
  const el = document.querySelector('.item[data-id="' + id + '"] .thumb');
  if (!el) return;
  const ph = el.querySelector('.ph');
  let img = el.querySelector('img');
  if (!img) {
    img = document.createElement('img');
    img.loading = 'lazy';
    el.insertBefore(img, el.firstChild);
  }
  img.setAttribute('data-raw', cover);
  img.setAttribute('data-fb', '0');
  img.setAttribute('data-hg', (SITE === 'hd') ? '0' : '1');
  img.onerror = function () { hgImgFallback(this); };
  img.style.display = '';
  img.src = coverUrl(cover);
  if (ph) ph.style.display = 'none';
}

/* ===================== 全站搜索 ===================== */
/**
 * 一处搜两个板块:
 *   纯数字 → 直接当 ID 打开 (当前板块优先)
 *   其它   → 同时打黄果和黄豆的搜索接口, 合并成一份结果
 *            每条自带 site 标记 + 角标, 点进去自动走对应的播放器
 * 单边失败不影响另一边 (网络抖动 / 上游抽风都可能只挂一边)。
 */

// 豆腐块搜索关键字匹配: 标题优先, 其次简介/标签/年份
// (直连上游时的兜底; Worker 在线时由 Worker 侧做全站过滤, 比这个准)
function hitTitle(it, kw) {
  const low = kw.toLowerCase();
  const fields = [it.title, it.name, it.description, it.remarks, it.year];
  if (Array.isArray(it.tags)) fields.push(it.tags.join(' '));
  return fields.some((f) => f && String(f).toLowerCase().indexOf(low) >= 0);
}

/**
 * 黄豆搜索。
 * 上游 /videos?keyword= 是摆设 (传什么词都返回同一份热度榜, 实测确认),
 * 所以有两条路:
 *   Worker 在线 → /api/hd/search 已经在服务端拉了全站 985 条并过滤好, 直接用
 *   直连模式   → 前端自己拉若干页再本地过滤 (拉不了全站, 覆盖有限)
 */
async function hdSearch(kw, pages) {
  // 先试 Worker 侧的全站搜索 (它会把 985 条全拉下来过滤好, 最准)
  try {
    const j = await hdApi('/api/search', { q: kw });
    if (j && Array.isArray(j.items) && j.items.length) return j.items;
    if (j && j.poolSize) return [];          // Worker 搜过了, 确实没命中
  } catch (e) { /* Worker 不通, 走下面的直连兜底 */ }

  // 兜底: 前端拉多页本地过滤
  pages = pages || 6;
  const shots = [];
  for (let p = 1; p <= pages; p++) shots.push(p);

  const rs = await Promise.all(shots.map((p) =>
    apiOf('hd', '/api/list', { page: p })
      .then((j) => (j && j.items) || [])
      .catch(() => [])
  ));

  const seen = {};
  const out = [];
  for (const arr of rs) {
    for (const it of arr) {
      if (!it || it.id == null) continue;
      const k = String(it.id);
      if (seen[k]) continue;
      seen[k] = 1;
      out.push(it);
    }
  }
  return out.filter((it) => hitTitle(it, kw));
}

async function doSearch() {
  const kw = document.getElementById('q').value.trim();
  if (!kw) { goHome(); return; }
  if (/^\d+$/.test(kw)) { openVid(kw, SITE); return; }

  const T = newView();
  app().innerHTML = '<div class="load"><span class="spin"></span>搜索中…</div>';

  // 三边并行, 各自兜住异常
  const grabHg = () =>
    apiOf('hg', '/api/search', { q: kw })
      .then((j) => ({ src: 'hg', items: (j && j.items) || [] }))
      .catch(() => ({ src: 'hg', items: [], err: true }));

  // 黄豆走本地过滤 (上游 keyword 不可靠)
  const grabHd = () =>
    hdSearch(kw, 6)
      .then((items) => ({ src: 'hd', items }))
      .catch(() => ({ src: 'hd', items: [], err: true }));

  // EROSHORT 走 Worker 代理搜索
  const grabMg = () =>
    esApi('/api/list', { q: kw, pageSize: 12 })
      .then((j) => ({ src: 'es', items: (j && j.items) || [] }))
      .catch(() => ({ src: 'es', items: [], err: true }));

  // 海角走浏览器直连搜索
  const grabHjw = () =>
    hjwSearch(kw)
      .then((j) => ({ src: 'hjw', items: (j && j.items) || [] }))
      .catch(() => ({ src: 'hjw', items: [], err: true }));

  const [hgRes, hdRes, mgRes, hjwRes] = await Promise.all([grabHg(), grabHd(), grabMg(), grabHjw()]);
  if (stale(T)) return;

  const tag = (r) => r.items.map((x) => ({ ...x, site: r.src, showSite: true }));
  const hgItems = tag(hgRes);
  const hdItems = tag(hdRes);
  const mgItems = tag(mgRes);
  const hjwItems = tag(hjwRes);
  const all = hgItems.concat(hdItems, mgItems, hjwItems);

  if (!all.length) {
    const noOne = hgRes.err && hdRes.err && mgRes.err && hjwRes.err;
    app().innerHTML = '<div class="load">' +
      (noOne ? '所有板块都没搜到结果（网络或上游异常）' : '没找到「' + esc(kw) + '」') +
      '</div>';
    return;
  }

  let html = '<div class="sec">搜索：' + esc(kw) +
    '（共 ' + all.length + ' 个结果 · 海角 ' + hjwItems.length + ' / ERO ' + mgItems.length +
    ' / 黄豆 ' + hdItems.length + ' / 黄果 ' + hgItems.length + '）</div>';

  if (hjwItems.length || SITE === 'hjw') {
    html += '<div class="sec" style="margin-top:6px">海角网（' + hjwItems.length + '）</div>';
    html += hjwItems.length
      ? '<div class="grid hjwgrid">' + hjwItems.map(cardHtml).join('') + '</div>'
      : '<div class="load" style="padding:14px">' + (hjwRes.err ? '海角搜索暂时不可用' : '海角没有匹配的结果') + '</div>';
  }

  html += '<div class="sec" style="margin-top:22px">EROSHORT（' + mgItems.length + '）</div>';
  html += mgItems.length
    ? '<div class="grid">' + mgItems.map(cardHtml).join('') + '</div>'
    : '<div class="load" style="padding:14px">' + (mgRes.err ? 'EROSHORT 搜索暂时不可用' : 'EROSHORT 没有匹配的结果') + '</div>';

  html += '<div class="sec" style="margin-top:22px">黄豆短剧（' + hdItems.length + '）</div>';
  html += hdItems.length
    ? '<div class="grid">' + hdItems.map(cardHtml).join('') + '</div>'
    : '<div class="load" style="padding:14px">' + (hdRes.err ? '黄豆搜索暂时不可用' : '黄豆没有匹配的结果') + '</div>';

  html += '<div class="sec" style="margin-top:22px">黄果短剧（' + hgItems.length + '）</div>';
  html += hgItems.length
    ? '<div class="grid">' + hgItems.map(cardHtml).join('') + '</div>'
    : '<div class="load" style="padding:14px">' + (hgRes.err ? '黄果搜索暂时不可用（该站国内已不可达）' : '黄果没有匹配的结果') + '</div>';

  app().innerHTML = html;
  window.scrollTo(0, 0);
}

/* ===================== 收藏 + 观看历史 (本地存储) ===================== */
const FAV_KEY = 'hg_favs_v1';
const HIS_KEY = 'hg_history_v1';

function loadJSON(k, dflt) {
  try { return JSON.parse(localStorage.getItem(k) || 'null') ?? dflt; }
  catch (e) { return dflt; }
}
function saveJSON(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

// —— 收藏 ——
let FAVS = loadJSON(FAV_KEY, {});        // { id: {id,title,cover,ep,site,ts} }
function isFav(id) { return !!FAVS[String(id)]; }
function toggleFav(item) {
  const id = String(item.id);
  if (FAVS[id]) { delete FAVS[id]; }
  else {
    FAVS[id] = {
      id,
      title: item.title || ('剧集 ' + id),
      cover: item.cover || '',
      ep: item.ep || '',
      site: item.site || SITE,
      ts: Date.now(),
    };
  }
  saveJSON(FAV_KEY, FAVS);
  return isFav(id);
}
function favList() {
  return Object.values(FAVS).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}

// —— 观看历史 ——
let HIS = loadJSON(HIS_KEY, {});         // { id: {id,title,cover,ep,epTotal,pos,dur,site,ts} }
function hisPut(item) {
  const id = String(item.id);
  const old = HIS[id] || {};
  HIS[id] = {
    id,
    title: item.title || old.title || ('剧集 ' + id),
    cover: item.cover || old.cover || '',
    ep: item.ep || old.ep || '1',
    epTotal: item.epTotal || old.epTotal || '',
    pos: (item.pos != null ? item.pos : old.pos) || 0,
    dur: (item.dur != null ? item.dur : old.dur) || 0,
    site: item.site || old.site || curSrc || SITE,
    ts: Date.now(),
  };
  saveJSON(HIS_KEY, HIS);
}
function hisList() {
  return Object.values(HIS).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}
function hisClear() {
  if (!confirm('清空全部观看记录？')) return;
  HIS = {}; saveJSON(HIS_KEY, HIS);
  goHome();
}
function favClear() {
  if (!confirm('清空全部收藏？')) return;
  FAVS = {}; saveJSON(FAV_KEY, FAVS);
  goHome();
}

let curVid = null;
let curEp = '1';
// 当前详情页的来源 (全站搜索点进来的条目可能不属于当前板块)
let curSrc = SITE;

// 记录进度用
let HIS_TIMER = null;

async function openVid(id, from) {
  const T = newView();
  const src = from || SITE;
  app().innerHTML = '<div class="load"><span class="spin"></span>加载剧集…</div>';
  try {
    let v;
    if (src === 'es') {
      // EROSHORT: Worker 拉详情 + 集数, 失败则用快照兜住 (只有基本信息, 无集数)
      try {
        v = await esVideo(id);
        if (!v || !v.ok) throw new Error((v && v.error) || '详情失败');
      } catch (e) {
        const snap = await loadSnap('es-list');
        const hit = snap && snap.items.find(x => String(x.id) === String(id));
        if (!hit) throw e;
        v = { ok: true, meta: { id: hit.id, title: hit.title, cover: hit.cover, tags: hit.tags || [], description: hit.desc || '' },
              eps: [], snapshot: true };
      }
    } else if (src === 'hjw') {
      // 海角: Worker 端出网抓详情 (站点不发 ACAO, 浏览器直连会被 CORS 拦)
      // 详情页 data-config 里明文写着 m3u8; 正文与图片也全量带回来
      v = await hjwDetail(id);
      if (!v || v.ok === false) throw new Error((v && v.error) || '详情失败');
      // 归一成前端通用字段
      v = {
        id: v.id,
        title: v.title,
        cover: v.cover,
        author: v.author || '',
        avatar: v.avatar || '',
        views: v.views || '',
        date: v.date || '',
        epTotal: v.isVideo ? 1 : 0,
        tags: v.tags || [],
        catName: v.catName || '',
        catId: v.catId || '',
        desc: v.artText || '',
        // 正文与图片 (图文帖就是靠这两个字段渲染)
        artHtml: v.artHtml || '',
        artText: v.artText || '',
        images: v.images || [],
        imageCount: v.imageCount || (v.images || []).length,
        m3u8: v.m3u8,
        m3u8_h265: v.m3u8_h265,
        isVideo: !!v.isVideo,
        isArticle: v.isArticle === true,
        payGated: false,
        pageUrl: v.pageUrl || '',
        related: v.related || [],
        eps: v.m3u8 ? { '1': v.m3u8 } : {}
      };
    } else {
      v = src === SITE ? await api('/api/video', { id }) : await apiOf(src, '/api/video', { id });
    }
    if (stale(T)) return;
    if (v.error) { app().innerHTML = '<div class="err">' + esc(v.error) + '</div>'; return; }
    curVid = v;
    curSrc = src;

    // 黄豆短剧: 走自己的播放器
    if (src === 'hd') { pushDetailState(); return renderHdVid(v); }
    // EROSHORT: 走自己的播放器 (集数是数组, 带免费/付费标记)
    if (src === 'es') { pushDetailState(); return renderMgVid(v); }
    // 海角网: 单帖单视频, 无选集
    if (src === 'hjw') { pushDetailState(); return renderHjwVid(v); }

    const eps = Object.entries(v.eps || {});
    const epsKeys = Object.keys(v.eps || {}).sort((a, b) => +a - +b);

    // 从历史里恢复上次看到第几集
    const old = HIS[String(v.id)];
    let startEp = epsKeys.length ? epsKeys[0] : '1';
    let startPos = 0;
    if (old && old.ep && v.eps && v.eps[old.ep]) {
      startEp = String(old.ep);
      startPos = old.pos || 0;
    }
    curEp = startEp;
    const first = (v.eps || {})[startEp] || '';

    // 记历史 (进详情页就算看过)
    hisPut({ id: v.id, title: v.title, cover: v.cover, ep: startEp, epTotal: v.epTotal });

    const faved = isFav(v.id);
    app().innerHTML =
      '<button class="back" onclick="goBack()">‹ 返回列表</button>' +
      '<div class="card">' +
        '<div class="dhead">' +
          (v.cover ? '<img class="dcover" src="' + esc(coverUrl(v.cover, curSrc)) + '" data-raw="' + esc(v.cover) + '" data-fb="0" data-hg="' + (curSrc === 'hd' ? '0' : '1') + '" onerror="hgImgFallback(this)">' : '') +
          '<div class="dinfo">' +
            '<div class="dtitle">' + esc(v.title) +
              '<button class="favbtn' + (faved ? ' on' : '') + '" id="favbtn" onclick="onFav()">' +
              (faved ? '♥ 已收藏' : '♡ 收藏') + '</button>' +
            '</div>' +
            '<div class="dmeta">' +
              (v.epTotal ? '共 <em>' + v.epTotal + '</em> 集' : '') +
              (v.author ? ' · ' + esc(v.author) : '') +
              (v.views ? ' · 👁 ' + esc(v.views) : '') +
              (eps.length ? ' · 已解析 <em>' + eps.length + '</em> 个播放源' : '') +
            '</div>' +
            '<div>' + (v.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' +
          '</div>' +
        '</div>' +
        (v.description ? '<div class="ddesc">' + esc(v.description).slice(0,300) + (v.description.length > 300 ? '…' : '') + '</div>' : '') +
        (first ?
          '<div class="vwrap"><video id="pl" controls playsinline preload="metadata" poster="' + esc(coverUrl(v.cover, curSrc)) + '"></video>' +
          '<div class="playbar">' +
            '<span class="curep" id="curep">第 ' + startEp + ' 集</span>' +
            '<button class="gh" onclick="step(-1)">上一集</button>' +
            '<button class="gh" onclick="step(1)">下一集</button>' +
            '<span class="spdwrap" id="spdwrap"></span>' +
          '</div>' +
          '<div class="resume" id="resume" style="display:none"></div>' +
          '</div>' : '') +
        (v.epTotal ? '<div class="sec">剧集列表（共 ' + v.epTotal + ' 集）' +
          (eps.length < v.epTotal ? '<button class="gh" id="fillbtn" style="font-size:12px;padding:5px 11px;margin-left:8px" onclick="fetchAllEps()">补齐全部播放源</button>' : '') +
          '</div><div class="eps">' +
          Array.from({ length: v.epTotal }, (_, i) => String(i + 1)).map(e =>
            '<a class="ep' + (e === startEp ? ' on' : '') + '" data-ep="' + e + '" href="javascript:playEp(\'' + e + '\')">第' + e + '集</a>').join('') +
          '</div>' : '<div class="err">未解析到剧集信息</div>') +
      '</div>';
    window.scrollTo(0,0);
    pushDetailState();

    // 首播: 走统一入口 (m3u8 → hls.js), 再挂播放器增强
    if (first) {
      setVideoSrc(document.getElementById('pl'), first, {
        onFatal: () => {
          const ce = document.getElementById('curep');
          if (ce) ce.textContent = '第 ' + startEp + ' 集（源加载失败，换集或稍后重试）';
        }
      }).then(() => initPlayer(startPos)).catch(() => initPlayer(startPos));
    } else {
      initPlayer(startPos);
    }
  } catch (e) { showErr(e); }
}
