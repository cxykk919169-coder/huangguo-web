/* ===================== 海角网详情渲染 ===================== */
/**
 * 海角是 UGC 社区 —— 一个帖子有两种形态:
 *   A) 视频帖: 正文 + 明文 m3u8 播放源
 *   B) 图文帖: 正文 + 若干张明文图片 (没有视频)
 *
 * 两种都完整渲染, 不做任何门槛:
 *   - 正文全量展示 (parseArticle 已剥掉站方地址卡)
 *   - 图片全量展示, 点击可放大 + 左右翻页
 *   - 视频帖底部挂播放器
 *
 * 源站 UI 复刻要点:
 *   - 标题 → 元信息行 (分类/浏览/日期) → 作者行 → 内容流
 *   - 内容流用自己的排版, 图片通栏圆角
 *   - 底部相关推荐网格
 */
function renderHjwVid(v) {
  const id = String(v.id || '');
  const faved = isFav(id);
  const isVideo = !!v.isVideo;
  const imgs = v.images || [];

  curVid = {
    id: id,
    title: v.title || '',
    cover: v.cover || '',
    epTotal: isVideo ? 1 : 0,
    tags: v.tags || [],
    description: v.artText || '',
    eps: v.eps || {},
    _hjw: true,
  };
  curSrc = 'hjw';
  curEp = '1';
  if (isVideo) hisPut({ id: id, title: curVid.title, cover: curVid.cover, ep: '1', epTotal: 1 });

  // ---- 头部 (标题 + 元信息 + 作者) ----
  const head =
    '<div class="hjwhead">' +
      '<h1 class="hjwtitle">' + esc(curVid.title) + '</h1>' +
      '<div class="hjwmeta">' +
        (v.catName ? '<span class="cat" onclick="hjwJumpCat(\'' + esc(v.catId || '') + '\')">' + esc(v.catName) + '</span>' : '') +
        '<span>' + esc(v.date || '') + '</span>' +
        (v.views ? '<span>👁 ' + esc(v.views) + ' 浏览</span>' : '') +
        '<span>' + (isVideo ? '🎬 视频' : '🖼 图文 · ' + imgs.length + ' 图') + '</span>' +
      '</div>' +
      '<div class="hjwauthor">' +
        (v.avatar ? '<img alt="" id="hjwav">' : '') +
        '<div>' +
          '<div class="nm">' + esc(v.author || '匿名海友') + '</div>' +
          '<div class="tm">' + (v.date ? esc(String(v.date).slice(0, 16)) : '') + '</div>' +
        '</div>' +
        '<button class="favbtn' + (faved ? ' on' : '') + '" id="favbtn" onclick="onFav()" style="margin-left:auto">' +
          (faved ? '♥ 已收藏' : '♡ 收藏') + '</button>' +
      '</div>' +
    '</div>';

  // ---- 内容流 ----
  let body = '';

  // 视频帖: 播放器放最前
  if (isVideo && v.m3u8) {
    // 源是 m3u8 → 不在这里塞 src, 渲染后用 setVideoSrc 交给 hls.js (Chrome 原生播不了 m3u8)
    body +=
      '<div class="vwrap"><video id="pl" controls playsinline preload="metadata" poster="' +
        esc(hjwImg(v.cover)) + '"></video></div>' +
      '<div id="resume" class="resume" style="display:none"></div>' +
      '<div id="spd" class="spd"></div>' +
      '<div class="rows" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="sitebtn" onclick="hjwRefresh()">↻ 重新取源</button>' +
        (v.m3u8_h265 ? '<button class="sitebtn" onclick="hjwTryH265()">切 H.265 源</button>' : '') +
      '</div>';
  }

  // 视频帖离线快照: 无时效内 m3u8, 说明一下而不是静默没有播放器
  if (isVideo && !v.m3u8) {
    body += '<div style="padding:12px 14px;background:#f6f1e8;border:1px solid #e5d9c3;border-radius:8px;color:#7a653d;font-size:13px">' +
      '🎬 该帖为视频帖, 视频源带时效签名 —— 离线模式暂不能播放, 联网后重新打开即恢复; 下方图文部分可正常浏览。</div>';
  }

  // 正文
  if (v.artHtml) {
    body += '<div class="hjwart" id="hjwart">' + hjwSanitizeArt(v.artHtml) + '</div>';
  } else if (v.artText) {
    body += '<div class="hjwart">' + esc(v.artText).replace(/\n/g, '<br>') + '</div>';
  }

  // 标签
  if (curVid.tags.length) {
    body += '<div style="margin-top:18px">' +
      curVid.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>';
  }

  // 相关推荐
  const rel = v.related || [];

  app().innerHTML =
    '<button class="back" onclick="goBack()">‹ 返回列表</button>' +
    head +
    '<div class="card" style="padding:16px 15px">' + body + '</div>' +
    (rel.length
      ? '<section class="hjwrel"><div class="hjwrel-h">相关推荐</div>' +
        '<div class="grid hjwgrid">' +
        rel.map(x => cardHtml(Object.assign({}, x, { site: 'hjw' }))).join('') +
        '</div></section>'
      : '') +
    '<div class="rows" style="margin-top:18px">' +
      (v.pageUrl ? '<a class="sitebtn" href="' + esc(v.pageUrl) + '" target="_blank" rel="noopener">源站原文 ↗</a>' : '') +
    '</div>';

  if (isVideo) {
    hjwBindError();
    if (v.m3u8) {
      // 统一入口: 海角 m3u8 → hls.js
      setVideoSrc(document.getElementById('pl'), hjwProxied(v.m3u8), {
        onFatal: () => toast('视频源加载失败，可点「重新取源」'),
      }).then(() => initPlayer(0));
    } else {
      initPlayer(0);
    }
    if (v.cover) hjwDecryptImage(v.cover).then(u => { const el = document.getElementById('pl'); if (el) el.poster = u; }).catch(() => {});
  }
  hjwBindArt();
  if (v.avatar) { const av = document.getElementById('hjwav'); if (av) hjwDecryptBind(av, v.avatar); }
  hjwDecryptScan();
  window.scrollTo(0, 0);
}

/**
 * 图文帖图片交互: 点击放大 + 左右翻页 + 键盘。
 * 图片 src 统一换成代理地址 (CDN 不保证发 CORS)。
 */
function hjwBindArt() {
  const box = document.getElementById('hjwart');
  if (!box) return;
  const imgs = Array.prototype.slice.call(box.querySelectorAll('img'));
  if (!imgs.length) return;
  imgs.forEach((im, i) => {
    const raw = im.getAttribute('data-raw') || im.getAttribute('src') || '';
    im.setAttribute('data-raw', raw);
    // 图床字节流是密文, 不能直接 <img src> —— 占位 + 解密上图
    hjwDecryptBind(im, raw);
    im.onclick = function (e) { e.preventDefault(); hjwLightbox(imgs, i); };
  });
}

/** 图片预览层 */
let HJW_LB = null;
function hjwLightbox(imgs, i) {
  const list = imgs.map(x => x.getAttribute('data-raw') || x.getAttribute('src') || '');
  function paint() {
    if (!HJW_LB) return;
    const im = HJW_LB.querySelector('img');
    const u = list[i];
    im.src = HJW_BLANK;
    hjwDecryptImage(u).then(du => { im.src = du; })
      .catch(() => { im.style.opacity = '0.35'; });
    HJW_LB.querySelector('.n').textContent = (i + 1) + ' / ' + list.length;
  }
  if (HJW_LB) HJW_LB.remove();
  HJW_LB = document.createElement('div');
  HJW_LB.className = 'hjwlb';
  HJW_LB.innerHTML =
    '<div class="x">✕</div><div class="n"></div>' +
    (list.length > 1 ? '<div class="pv">‹</div><div class="nx">›</div>' : '') +
    '<img alt="">';
  HJW_LB.onclick = function (e) {
    if (e.target === HJW_LB || e.target.className === 'x') { HJW_LB.remove(); HJW_LB = null; }
  };
  const pv = HJW_LB.querySelector('.pv');
  const nx = HJW_LB.querySelector('.nx');
  if (pv) pv.onclick = function (e) { e.stopPropagation(); i = (i - 1 + list.length) % list.length; paint(); };
  if (nx) nx.onclick = function (e) { e.stopPropagation(); i = (i + 1) % list.length; paint(); };
  document.body.appendChild(HJW_LB);
  paint();

  const key = function (e) {
    if (!HJW_LB) { document.removeEventListener('keydown', key); return; }
    if (e.key === 'Escape') { HJW_LB.remove(); HJW_LB = null; document.removeEventListener('keydown', key); }
    if (e.key === 'ArrowLeft' && list.length > 1) { i = (i - 1 + list.length) % list.length; paint(); }
    if (e.key === 'ArrowRight' && list.length > 1) { i = (i + 1) % list.length; paint(); }
  };
  document.addEventListener('keydown', key);
}

/**
 * 正文 HTML 清洗
 * 保留 p / br / img / a / b / i / strong / em / span / blockquote / h1-h4
 * 其余标签一律剥掉。事件属性全清。
 * 图片统一转成 data-raw, 由 hjwBindArt 换成代理地址。
 */
function hjwSanitizeArt(html) {
  // 先清 script / style / iframe 整块
  let s = String(html)
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<style[\s\S]*?<\/style>/gi, '')
    .replace(/<iframe[\s\S]*?<\/iframe>/gi, '')
    .replace(/<!--[\s\S]*?-->/g, '');

  const ALLOW = /^(p|br|img|a|b|i|u|strong|em|span|blockquote|h1|h2|h3|h4|ul|ol|li|div|hr|video|source)$/i;

  s = s.replace(/<\/?([a-zA-Z0-9]+)([^>]*)>/g, function (m, tag, attrs) {
    if (!ALLOW.test(tag)) return '';
    const closing = m.charAt(1) === '/';
    const t = tag.toLowerCase();
    if (closing) return '</' + t + '>';

    if (t === 'br' || t === 'hr') return '<' + t + '>';

    if (t === 'img') {
      const src = (attrs.match(/z-image-loader-url="([^"]*)"/i) ||
                   attrs.match(/data-src="([^"]*)"/i) ||
                   attrs.match(/\ssrc="([^"]*)"/i) || [])[1] || '';
      const u = cleanArtUrl(src);
      // alt 一律置空: 海角帖的 img alt 是帖子标题, 图挂了会显示标题文字冒充图片内容
      if (!u) return '';
      return '<img data-raw="' + esc(u) + '" alt="" loading="lazy">';
    }

    if (t === 'a') {
      const href = (attrs.match(/href="([^"]*)"/i) || [])[1] || '';
      const ok = /^https?:\/\//i.test(href);
      return '<a' + (ok ? ' href="' + esc(href) + '" target="_blank" rel="noopener nofollow"' : '') + '>';
    }

    return '<' + t + '>';
  });

  // 正文里可能有的裸 URL 图片 (有些帖直接贴 z-image-loader-url 在文字里) —— 不管
  return s;
}

function cleanArtUrl(u) {
  u = String(u || '').trim();
  u = u.replace(/^[`'"\s]+/, '').replace(/[`'"\s]+$/, '');
  u = u.replace(/\\u002F/g, '/').replace(/\\\//g, '/');
  return u;
}

/** 海角图片走代理 (CDN 不保证发 CORS) */
function hjwImg(u) {

/** 海角 m3u8 / 图片 → Worker 代理地址 */
function hjwProxied(raw) {
  if (!raw) return '';
  if (typeof HJWW !== 'undefined') {
    if (API) HJWW.setProxy(API);
    return HJWW.proxied(raw);
  }
  return raw;
}

/** EROSHORT: 解析并播放某集 (免费集走 resolve, 付费集提示跳原站) */
async function mgPlay(ep) {
  ep = String(ep);
  if (!curVid || !curVid._es) return;
  const v = document.getElementById('pl');
  if (!v) return;

  curEp = ep;
  document.querySelectorAll('.ep').forEach(x => x.classList.remove('on'));
  const el = document.querySelector('.ep[data-ep="' + ep + '"]');
  if (el) { el.classList.add('on'); if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); }
  const ce = document.getElementById('curep');
  if (ce) ce.textContent = '第 ' + ep + ' 集（解析中…）';

  hisPut({ id: curVid.id, title: curVid.title, cover: curVid.cover, ep, epTotal: curVid.epTotal, pos: 0 });

  // 该集的 episode id (详情页时已从 children 拿到)
  const rec = (curVid._epMap || {})[ep];
  const epId = rec && rec.id;
  if (!epId) { if (ce) ce.textContent = '第 ' + ep + ' 集（缺少集标识）'; return; }

  let u = curVid.eps[ep];
  let stego = null;
  if (!u) {
    try {
      const r = await esResolveEp(curVid.id, ep, epId);
      if (r && r.ok && r.format === 'stego_hls' && (r.m3u8 || r.url)) {
        // stego_hls 不能塞进 <video>.src, 必须挂解封装 loader —— 单独走一条路
        stego = r;
      } else if (r && r.ok && r.url) {
        u = r.url;
        curVid.eps[ep] = u;
      } else if (r && r.locked) {
        mgLocked(ep, 0, r.reason);
        return;
      } else if (r && r.netError) {
        // 网络层故障 (上游 CF 拦截 / 中转限流 / Worker 不可达)
        // 绝不能伪装成"付费内容"骗用户去原站 —— 给重试入口。
        mgNetRetry(ep, r.reason);
        return;
      } else if (r && r.pending) {
        // 免费集但需要额外一次 resolve — Worker 已合并, 正常不会走到这
        if (ce) ce.textContent = '第 ' + ep + ' 集（源不可用）';
        return;
      }
    } catch (e) { /* 下面统一报错 */ }
  }

  if (!u && !stego) {
    if (ce) ce.textContent = '第 ' + ep + ' 集（源获取失败）';
    return;
  }

  if (stego) { await esPlayStego(v, stego, ep); return; }

  // EROSHORT 源可能是 mp4 (direct) 或 m3u8 (hls) → 统一入口交给 setVideoSrc
  await setVideoSrc(v, u, {
    onFatal: () => { if (ce) ce.textContent = '第 ' + ep + ' 集（源加载失败）'; },
  });
  v.playbackRate = CUR_SPEED;
  const rt = document.getElementById('resume');
  if (rt) rt.style.display = 'none';
  v.play().catch(() => {});
  if (ce) ce.textContent = '第 ' + ep + ' 集';
}

/**
 * EROSHORT: 网络层取流失败 —— 给重试, 不要谎称"付费内容"。
 *
 * 国内直连时上游被 CF 拦 / 中转限流是常态, 同一集多试几次通常能成。
 * 这里重试 3 次 (间隔递增), 全失败再给原站兜底入口。
 */
async function mgNetRetry(ep, reason) {
  if (!curVid || !curVid._es) return;
  const v = document.getElementById('pl');
  const ce = document.getElementById('curep');
  const rec = (curVid._epMap || {})[ep];
  const epId = rec && rec.id;
  if (!epId) { if (ce) ce.textContent = '第 ' + ep + ' 集（缺少集标识）'; return; }

  const delays = [0, 2500, 5000];
  for (let i = 0; i < delays.length; i++) {
    if (delays[i]) await new Promise(r => setTimeout(r, delays[i]));
    if (ce) ce.textContent = '第 ' + ep + ' 集（线路' + (i + 1) + '/' + delays.length + ' 尝试中…）';
    let r = null;
    try { r = await esResolveEp(curVid.id, ep, epId); } catch (e) { r = null; }
    if (r && r.ok && r.format === 'stego_hls' && (r.m3u8 || r.url)) {
      await esPlayStego(v, r, ep);
      return;
    }
    if (r && r.ok && r.url) {
      curVid.eps[ep] = r.url;
      await setVideoSrc(v, r.url, {
        onFatal: () => { if (ce) ce.textContent = '第 ' + ep + ' 集（源加载失败）'; },
      });
      v.playbackRate = CUR_SPEED;
      v.play().catch(() => {});
      const rt = document.getElementById('resume');
      if (rt) rt.style.display = 'none';
      if (ce) ce.textContent = '第 ' + ep + ' 集';
      return;
    }
    if (r && r.locked) { mgLocked(ep, 0, r.reason); return; }
  }

  // 三次都没拿到 —— 如实说明是网络/线路问题
  if (ce) ce.textContent = '第 ' + ep + ' 集（线路暂不可用）';
  const msg = '第 ' + ep + ' 集 暂时取不到视频流。\n\n' +
              '原因: 上游站点对非浏览器出口做了限制, 取流通道在抖动。\n' +
              '（这不是付费内容提示, 稍后再试通常可恢复）\n\n' +
              '要打开上游原站看吗？';
  if (confirm(msg)) {
    window.open('https://eroshort.net/drama/' + curVid.id, '_blank', 'noopener');
  }
}

/**
 * EROSHORT stego_hls 起播。
 *
 * 上游部分剧把 MPEG-TS 藏进 PNG 的 "teXt"/Comment chunk 里, manifest 仍是标准
 * m3u8、分片却是 .png。原生 <video> 与裸 hls.js 都吃不下, 必须:
 *   1) 用 license 里的 X25519 包裹密钥解出 AES 内容密钥 (hg-stego.js)
 *   2) 给 hls.js 挂自定义 fLoader: 拉 PNG → 解封装成 TS → 交回 MSE
 *
 * manifest 本身走本站 Worker /api/es/raw/* —— 上游 eroshort.net 对数据中心 IP
 * 硬拦 (403), 只有 Worker 边缘出口被放行; 失败再退回上游直连 (住宅网有时能过)。
 */
async function esPlayStego(v, r, ep) {
  const ce = document.getElementById('curep');
  const say = (t) => { if (ce) ce.textContent = t; };

  if (!r || !r.license || !r.mediaId) {
    say('第 ' + ep + ' 集（授权信息缺失）');
    mgNetRetry(ep, 'stego_meta');
    return;
  }
  if (typeof esOpenDecoder !== 'function') { say('第 ' + ep + ' 集（解封装器未加载）'); return; }
  if (!HLS_READY()) { say('第 ' + ep + ' 集（此浏览器不支持）'); return; }

  say('第 ' + ep + ' 集（准备中…）');
  let dec = null;
  try {
    dec = await esOpenDecoder(
      { mediaId: r.mediaId, assetVersion: r.assetVersion, license: r.license },
      ES_BUILD_PROFILE);
  } catch (e) {
    say('第 ' + ep + ' 集（授权解析失败）');
    console.warn('[ERO stego] openDecoder', e);
    return;
  }

  const Loader = esMakeStegoLoader(dec);
  if (!Loader) { say('第 ' + ep + ' 集（播放器未就绪）'); return; }

  // manifest 候选地址:
  //   0) 静态快照自带的 m3u8 文本 → 直接做成 blob URL (国内直连走这条)
  //   1) Worker 原始透传 /api/es/raw/* (Worker 可达时)
  //   2) 上游直连 / Worker /proxy/
  const rel = String(r.url || '');
  const srcs = [];
  let blobUrl = '';
  if (r.m3u8 && /^#EXTM3U/.test(r.m3u8)) {
    try {
      blobUrl = URL.createObjectURL(new Blob([r.m3u8], { type: 'application/vnd.apple.mpegurl' }));
      srcs.push(blobUrl);
    } catch (e) { /* 不支持 blob → 走网络 */ }
  }
  if (rel.indexOf('/api/v1/') === 0) {
    if (typeof API === 'string' && API) srcs.push(API + '/api/es/raw/' + rel.slice('/api/v1/'.length));
    srcs.push('https://eroshort.net' + rel);
  } else if (/^https?:/i.test(rel)) {
    srcs.push(rel);
    if (typeof API === 'string' && API) srcs.push(API + '/proxy/' + encodeURIComponent(rel));
  } else if (rel) {
    if (typeof API === 'string' && API) srcs.push(API + '/proxy/' + encodeURIComponent(rel));
  }

  destroyHls();
  const ok = await stegoHlsLoad(v, srcs, Loader);
  // blob URL 生命周期: hls.js 读完 playlist 后就没用了, 但保守起见留 2 分钟
  if (blobUrl) setTimeout(() => { try { URL.revokeObjectURL(blobUrl); } catch (e) {} }, 120000);
  if (!ok) {
    say('第 ' + ep + ' 集（线路暂不可用）');
    try { dec.destroy(); } catch (e) {}
    return;
  }
  const rt = document.getElementById('resume');
  if (rt) rt.style.display = 'none';
  v.playbackRate = CUR_SPEED;
  v.play().catch(() => {});
  say('第 ' + ep + ' 集');
}

/**
 * 逐个 manifest 候选地址试挂 hls.js (带 stego fLoader)。
 * @returns {Promise<boolean>} 是否有一次 MANIFEST_PARSED 成功
 */
function stegoHlsLoad(video, srcs, Loader) {
  return new Promise((resolve) => {
    let settled = false;
    const finish = (v) => { if (!settled) { settled = true; resolve(v); } };
    let i = 0;

    const tryNext = () => {
      if (i >= srcs.length) { finish(false); return; }
      const src = srcs[i++];
      const h = new Hls({
        progressive: false,          // 与上游一致: 分片是普通 TS, 不需要 progressive
        fLoader: Loader,
        manifestLoadingMaxRetry: 3,
        levelLoadingMaxRetry: 3,
        fragLoadingMaxRetry: 6,
        manifestLoadingRetryDelay: 400,
        fragLoadingRetryDelay: 400,
        fragLoadingMaxRetryTimeout: 20000,
      });
      let advanced = false;
      h.on(Hls.Events.MANIFEST_PARSED, () => finish(true));
      h.on(Hls.Events.ERROR, (evt, d) => {
        if (!d || !d.fatal) return;
        if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { try { h.recoverMediaError(); return; } catch (e) {} }
        if (advanced) return;
        advanced = true;
        try { h.destroy(); } catch (e) {}
        if (HLS_OBJ === h) HLS_OBJ = null;
        tryNext();
      });
      HLS_OBJ = h;
      try {
        h.loadSource(src);
        h.attachMedia(video);
      } catch (e) {
        if (!advanced) { advanced = true; tryNext(); }
      }
    };

    setTimeout(() => { if (!settled) { try { destroyHls(); } catch (e) {} finish(false); } }, 20000);
    tryNext();
  });
}

// 视频源: 黄豆优先直连 mp4, Worker 流代理仅作备选 —— 修挂代理后的 http 400。
//
// 根因 (2026-10): 黄豆 playUrl 是带 ticket 的 mp4 直链, 上游 CDN 不发 ACAO。
//   <video> 播放媒体本身不做 CORS 检查, 所以【直连一定能播】。
//   旧代码在 WORKER_OK!==false 时无条件包 Worker 流代理; 挂代理后 Worker 可达
//   → 强制走 workers.dev → Worker 出口 IP + 短时效 ticket → 上游回 400, 卡死。
//
// 新策略:
//   1) 先探测 Worker 流代理是否真的 200 (HEAD/Range 探测, 800ms 超时);
//   2) 200 → 用代理 (兼容极少数直连被 CORS/网络挡的场景);
//      否则 → 直连 (默认路径, 最稳);
//   3) 播放中若仍出错, onerror 再兜一次。
let HD_PROXY_OK = null;              // null=未探, true/false=已定

function hdProbeProxy(raw) {
  if (HD_PROXY_OK !== null) return Promise.resolve(HD_PROXY_OK);
  if (!API || WORKER_OK === false || typeof fetch !== 'function') {
    HD_PROXY_OK = false;
    return Promise.resolve(false);
  }
  const u = API + '/api/hd/stream?u=' + encodeURIComponent(raw);
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 800);
  const opts = { method: 'GET', headers: { Range: 'bytes=0-1' } };
  if (ctl) opts.signal = ctl.signal;
  return fetch(u, opts).then(r => {
    clearTimeout(timer);
    // 206/200 才算代理可用; 400/403/5xx 一律判死
    HD_PROXY_OK = (r.status === 200 || r.status === 206);
    return HD_PROXY_OK;
  }).catch(() => { clearTimeout(timer); HD_PROXY_OK = false; return false; });
}

function hdSetSrc(url) {
  const video = document.getElementById('pl');
  if (!video || !url) return;
  const raw = String(url);

  // 切集时重置探测缓存 (ticket 每集都换, 不能用上一集的结论)
  HD_PROXY_OK = null;

  video.dataset.hdRaw = raw;
  video.dataset.hdFallback = '';
  video.onerror = function () {
    if (video.dataset.hdFallback === '1') return;   // 已回退过, 防死循环
    video.dataset.hdFallback = '1';
    // 若当前是代理地址 → 回退直连
    if (video.src && API && video.src.indexOf(API) === 0) {
      video.src = raw;
      video.load();
      try { video.play().catch(() => {}); } catch (e) {}
      toast('代理受限，已切直连');
    }
  };

  // 先用直连立即起播 (最快路径), 同时后台探测代理是否更优
  video.src = raw;
  video.load();
  try { video.play().catch(() => {}); } catch (e) {}

  // 探测代理: 若直连因网络原因起不来而代理可用, 才切代理
  hdProbeProxy(raw).then(ok => {
    if (!ok) return;
    // 直连已能播就不动; 8 秒后仍 readyState<1 说明直连失败 → 切代理
    setTimeout(() => {
      const v2 = document.getElementById('pl');
      if (v2 && v2 !== video) return;                 // 用户已切走
      if (v2.readyState < 1 && v2.src === raw) {
        v2.src = API + '/api/hd/stream?u=' + encodeURIComponent(raw);
        v2.load();
        try { v2.play().catch(() => {}); } catch (e) {}
        toast('已切换代理线路');
      }
    }, 8000);
  });
}

/* ===================== 统一 HLS 播放引擎 =====================
 * 背景 (2026-10 根因, 直连不播 / 挂代理 400):
 *
 *   【黄果直连不播】黄果源是 m3u8 (HLS)。Chrome/Edge/Firefox/Android 的原生
 *   <video> 只认 mp4, 不认 m3u8。旧代码把 m3u8 裸塞给 <video src>, 在非 Safari
 *   内核上必然黑屏/转圈 —— 这就是"直连黄果播不了"。
 *
 *   【黄豆挂代理 400】黄豆源是带 ticket 的 mp4, 上游 CDN 不发 ACAO。
 *   <video> 不检查 CORS 所以直连可播; 但旧 hdSetSrc 在 WORKER_OK!==false 时
 *   无条件包 Worker 流代理, 挂代理后 Worker 可达 → 强制走 workers.dev →
 *   Worker 出口 + 过期 ticket 触发上游 400, 且无回退 → 卡死。
 *
 * 方案:
 *   1) 统一入口 setVideoSrc(): m3u8 → hls.js 接管; mp4/直链 → 直接 video.src。
 *   2) 黄果 m3u8 默认【直连】(上游 refererCheck=false 且发 ACAO:*, 直连最稳,
 *      不受 workers.dev 被墙影响); 仅当直连加载失败才回退 Worker /proxy/。
 *   3) 黄豆走 mp4 直链优先, Worker 流代理仅作备选, 400 自动回落。
 */
let HLS_OBJ = null;                 // 当前 hls.js 实例
const HLS_READY = () => (typeof Hls !== 'undefined' && Hls.isSupported());

/**
 * m3u8 播放地址归一 —— 默认直连, 不无脑包 Worker。
 *
 * 为什么默认直连:
 *   黄果 m3u8 及 ts 分片: site.json 标 refererCheck=false, 且上游发 ACAO:*,
 *   hls.js 从浏览器直接拉完全可行, 且比经 Cloudflare Worker 少一跳、更稳。
 *   旧逻辑无条件走 /proxy/, 在 Worker 被墙时反而把能播的链路拖死。
 *
 * @param {string} url
 * @param {boolean} viaWorker  true 时强制走 Worker /proxy/ (失败回退用)
 */
/**
 * 决定播放用的 URL。
 *
 * viaWorker=false → 直连原地址
 * viaWorker=true  → 走本站 Worker 代理
 *
 * 为什么 mp4 也要能代理 (2026-10):
 *   ERO 的流地址是 r2.dev / 上游 CDN, 国内直连 .r2.dev 普遍超时。
 *   原来只有 m3u8 会走代理, mp4 直链原样丢给 <video>, 国内就是一直转圈。
 *   现在 mp4 也能走 /proxy/*, 由 Worker 边缘代拉。
 */
function playSrc(url, viaWorker) {
  if (!url) return '';
  const s = String(url).trim();
  // Worker 代理路径只有 /proxy/ 能透传任意地址 (m3u8 与 mp4 都支持)
  if (viaWorker && typeof API === 'string' && API && WORKER_OK !== false) {
    return API + '/proxy/' + encodeURIComponent(s);
  }
  return s;
}

/**
 * 用 hls.js 加载一个 m3u8 地址 (单次尝试)。
 * @returns {Promise<'ok'|'fail'>}
 */
function hlsLoad(video, src, attemptOpts) {
  return new Promise(resolve => {
    const h = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      // 分片/清单错误重试, 提高弱网抖动下的成功率
      manifestLoadingMaxRetry: 3,
      levelLoadingMaxRetry: 3,
      fragLoadingMaxRetry: 4,
      manifestLoadingRetryDelay: 400,
      fragLoadingRetryDelay: 400,
      fragLoadingMaxRetryTimeout: 12000,
    });

    let settled = false;
    const done = (v) => { if (!settled) { settled = true; resolve(v); } };

    h.on(Hls.Events.MANIFEST_PARSED, () => done('ok'));
    h.on(Hls.Events.ERROR, (evt, data) => {
      if (!data || !data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        try { h.recoverMediaError(); return; } catch (e) {}
      }
      // 网络类致命错误 → 本次尝试判失败, 交给外层决定是否换 Worker 代理重试
      done('fail');
    });

    HLS_OBJ = h;
    try {
      h.loadSource(src);
      h.attachMedia(video);
    } catch (e) {
      done('fail');
    }
    // 超时兜底: 8 秒还没 parsed 视为失败, 不阻塞 UI
    setTimeout(() => done('fail'), 8000);
  });
}

/**
 * 统一设置视频源。返回 Promise<void>。
 *
 * 黄果 m3u8 策略: 先直连 (refererCheck=false, 直连最快) → 失败再走 Worker /proxy/。
 * 黄豆/芒果 mp4 或代理地址: 直接设置, 由 video.onerror 兜底。
 *
 * @param {HTMLVideoElement} video
 * @param {string} url   原始播放地址 (m3u8 或 mp4 或 Worker 代理地址)
 * @param {{onFatal?:Function, isHd?:boolean}} opts
 */
async function setVideoSrc(video, url, opts) {
  opts = opts || {};
  if (!video || !url) return;
  destroyHls();

  const raw = String(url).trim();
  // 已经是 Worker 代理地址 → 原样使用, 不再包
  const alreadyProxied = (typeof API === 'string' && API && raw.indexOf(API) === 0);
  const isHls = /\.m3u8(\?|$)/i.test(raw) || (!alreadyProxied && raw.indexOf('m3u8') >= 0) || opts.forceHls === true;

  // ---- 非 HLS (mp4 直链) ----
  //   国内直连 r2.dev / 上游 CDN 常年超时, 所以 mp4 也要能回退到 Worker 代理。
  //   先直连 (快、省流量), 超时或 error 再换代理。
  if (!isHls) {
    const directMp4 = alreadyProxied ? raw : playSrc(raw, false);
    const proxMp4 = alreadyProxied ? '' : playSrc(raw, true);

    if (!proxMp4 || proxMp4 === directMp4 || typeof WORKER_OK === 'undefined' || WORKER_OK === false) {
      video.src = directMp4;
      video.load();
      return;
    }

    // 直连 → 失败自动切代理 (只切一次, 避免死循环)
    let switched = false;
    const onErr = () => {
      if (switched) return;
      switched = true;
      video.removeEventListener('error', onErr);
      video.removeEventListener('stalled', onErr);
      video.src = proxMp4;
      video.load();
      try { video.play().catch(() => {}); } catch (e) {}
      toast('已切换代理线路');
    };
    video.addEventListener('error', onErr);
    video.addEventListener('stalled', onErr);
    video.src = directMp4;
    video.load();
    return;
  }

  const direct = playSrc(raw, false);   // 直连地址

  // ---- Safari / iOS: 原生 HLS, 直接 src 最稳 (这些内核 Hls.isSupported() 为 false) ----
  if (!HLS_READY()) {
    video.src = alreadyProxied ? raw : direct;
    video.load();
    return;
  }

  // ---- 有 hls.js: 先直连, 失败再走 Worker 代理 ----
  let r = await hlsLoad(video, alreadyProxied ? raw : direct);
  if (r === 'ok') return;

  const viaW = playSrc(raw, true);       // Worker 代理地址
  if (viaW && viaW !== direct) {
    destroyHls();
    r = await hlsLoad(video, viaW);
    if (r === 'ok') { toast('已切换代理线路'); return; }
  }

  if (typeof opts.onFatal === 'function') opts.onFatal();
}

function destroyHls() {
  if (HLS_OBJ) {
    try { HLS_OBJ.destroy(); } catch (e) {}
    HLS_OBJ = null;
  }
}

/* ===================== 播放器增强: 倍速 + 记忆进度 ===================== */
const SPD_KEY = 'hg_speed_v1';
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3];
let CUR_SPEED = parseFloat(localStorage.getItem(SPD_KEY) || '1') || 1;

function initPlayer(resumePos) {
  const v = document.getElementById('pl');
  if (!v) return;

  // 应用记住的倍速
  v.playbackRate = CUR_SPEED;
  renderSpeedBar();

  // 恢复进度
  if (resumePos > 5) {
    const go = () => {
      try { v.currentTime = resumePos; } catch (e) {}
      showResumeTip(resumePos);
    };
    if (v.readyState >= 1) go();
    else v.addEventListener('loadedmetadata', go, { once: true });
  }

  // 每 5 秒保存一次进度
  clearInterval(HIS_TIMER);
  HIS_TIMER = setInterval(() => {
    if (!v.duration || v.paused) return;
    saveProgress(v.currentTime, v.duration);
  }, 5000);

  // 切走时保存
  v.addEventListener('pause', () => saveProgress(v.currentTime, v.duration));
  window.addEventListener('beforeunload', () => {
    if (v.duration) saveProgress(v.currentTime, v.duration);
  }, { once: true });

  // 播完自动下一集
  v.addEventListener('ended', () => {
    saveProgress(0, v.duration);
    step(1);
  });
}

function saveProgress(pos, dur) {
  if (!curVid) return;
  hisPut({
    id: curVid.id,
    title: curVid.title,
    cover: curVid.cover,
    ep: curEp,
    epTotal: curVid.epTotal,
    pos: Math.floor(pos || 0),
    dur: Math.floor(dur || 0),
  });
}

function showResumeTip(pos) {
  const box = document.getElementById('resume');
  if (!box) return;
  const m = Math.floor(pos / 60), s = Math.floor(pos % 60);
  box.style.display = '';
  box.innerHTML = '已从上次位置继续播放（' + m + ':' + String(s).padStart(2, '0') + '）';
  setTimeout(() => { if (box) box.style.display = 'none'; }, 4000);
}

function renderSpeedBar() {
  const w = document.getElementById('spdwrap');
  if (!w) return;
  w.innerHTML = '倍速 ' + SPEEDS.map(s =>
    '<button class="spd' + (s === CUR_SPEED ? ' on' : '') + '" onclick="setSpeed(' + s + ')">' + s + 'x</button>'
  ).join('');
}

function setSpeed(s) {
  CUR_SPEED = s;
  localStorage.setItem(SPD_KEY, String(s));
  const v = document.getElementById('pl');
  if (v) v.playbackRate = s;
  renderSpeedBar();
}

async function playEp(ep) {
  if (!curVid) return;
  const v = document.getElementById('pl');
  if (!v) return;
  // 切集前先保存当前进度
  if (v.duration && !v.paused) saveProgress(v.currentTime, v.duration);

  ep = String(ep);
  let u = curVid.eps[ep];
  curEp = ep;
  document.querySelectorAll('.ep').forEach(x => x.classList.remove('on'));
  const el = document.querySelector('.ep[data-ep="' + ep + '"]');
  if (el) { el.classList.add('on'); if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); }
  document.getElementById('curep').textContent = '第 ' + ep + ' 集' + (u ? '' : '（解析中…）');

  // 先记"看到第几集" — 不管源能不能拿到, 用户点了这集就该记住
  hisPut({ id: curVid.id, title: curVid.title, cover: curVid.cover, ep, epTotal: curVid.epTotal, pos: 0 });

  if (!u) {
    try {
      const j = await api('/api/ep', { id: curVid.id, ep: ep });
      u = j.url;
      if (u) curVid.eps[ep] = u;
    } catch (e) {}
  }
  if (!u) { document.getElementById('curep').textContent = '第 ' + ep + ' 集（源获取失败）'; return; }
  // 统一入口: m3u8 交给 hls.js, mp4 直接播 (修: 之前裸塞 m3u8, Chrome 播不了)
  await setVideoSrc(v, u, {
    onFatal: () => {
      const ce = document.getElementById('curep');
      if (ce) ce.textContent = '第 ' + ep + ' 集（源加载失败，换集或稍后重试）';
    }
  });
  v.playbackRate = CUR_SPEED;

  const rt = document.getElementById('resume');
  if (rt) rt.style.display = 'none';
  v.play().catch(() => {});
  document.getElementById('curep').textContent = '第 ' + ep + ' 集';
}

// 一键补齐所有集（后台慢慢拉）
async function fetchAllEps() {
  if (!curVid) return;
  const btn = document.getElementById('fillbtn');
  if (btn) { btn.disabled = true; btn.textContent = '补齐中…'; }
  const total = curVid.epTotal || 0;
  let done = 0;
  for (let n = 1; n <= total; n++) {
    if (curVid.eps[String(n)]) { done++; continue; }
    try {
      const j = await api('/api/ep', { id: curVid.id, ep: n });
      if (j.url) { curVid.eps[String(n)] = j.url; done++; }
    } catch (e) {}
    if (btn) btn.textContent = '补齐中 ' + done + '/' + total;
    await new Promise(r => setTimeout(r, 120));
  }
  if (btn) { btn.disabled = false; btn.textContent = '✅ 已补齐 ' + done + ' 集'; }
}
function step(d) {
  if (!curVid) return;
  const keys = Object.keys(curVid.eps).sort((a, b) => +a - +b);
  // 用记录到的当前集 (比读 DOM 更可靠, 尤其切集后)
  let i = keys.indexOf(String(curEp));
  if (i < 0) {
    const cur = document.querySelector('.ep.on');
    i = cur ? keys.indexOf(cur.dataset.ep) : 0;
  }
  const n = i + d;
  if (n >= 0 && n < keys.length) playEp(keys[n]);
  else if (n >= keys.length && curVid.epTotal && i + 1 < curVid.epTotal) {
    // 下一集还没解析出源, 也试着去拿
    playEp(String(i + 2));
  }
}

/* ===================== 我的 (收藏 / 历史 / 继续观看) ===================== */
function goMine() {
  const favs = favList();
  const his = hisList();
  const cont = his.filter(x => x.pos > 10 || (x.ep && x.ep !== '1')).slice(0, 12);

  function card(x, sub, act) {
    // 收藏/历史里存了来源就用存的, 老数据没有就按当前板块猜
    const src = x.site || SITE;
    const cv = coverUrl(x.cover, src);
    // 只有黄果封面是加密的 (必须走 /img, 直连必败); es/hjw/hd 都直接放行
    const hgFlag = (src === 'hd' || src === 'hjw' || src === 'es') ? '' : ' data-hg="1"';
    return '<div class="item" data-id="' + esc(x.id) + '" data-site="' + esc(src) + '"' +
      ' onclick="openVid(\'' + esc(x.id) + '\',\'' + esc(src) + '\')">' +
      '<div class="thumb">' +
        (cv ? '<img loading="lazy" src="' + esc(cv) + '" data-raw="' + esc(x.cover) + '" data-fb="0"' + hgFlag + ' onerror="hgImgFallback(this)">' : '') +
        '<div class="ph" style="' + (cv ? 'display:none' : '') + '">🎬</div>' +
        (x.ep ? '<div class="badge">' + x.ep + '集</div>' : '') +
        '<div class="badge src" style="left:auto;right:6px;background:rgba(10,10,14,.72)">' +
        (src === 'hd' ? '黄豆' : '黄果') + '</div>' +
      '</div>' +
      '<div class="t">' + esc(x.title) + '</div>' +
      '<div class="e">' + esc(sub || '') + '</div>' +
      '</div>';
  }

  let html = '<div class="minehead"><b>我的</b>' +
    '<span class="mineacts">' +
    (favs.length ? '<button class="gh" onclick="favClear()">清空收藏</button>' : '') +
    (his.length ? '<button class="gh" onclick="hisClear()">清空历史</button>' : '') +
    '</span></div>';

  if (cont.length) {
    html += '<div class="sec">继续观看</div><div class="grid">' +
      cont.map(x => card(x, x.ep ? ('看到第 ' + x.ep + ' 集' + (x.pos > 10 ? ' · ' + fmtTime(x.pos) : '')) : '')).join('') +
      '</div>';
  }
  if (favs.length) {
    html += '<div class="sec">我的收藏（' + favs.length + '）</div><div class="grid">' +
      favs.map(x => card(x, x.ep ? ('共 ' + x.ep + ' 集') : '')).join('') + '</div>';
  } else if (!cont.length) {
    html += '<div class="hint">还没有收藏或观看记录。<br><br>' +
      '在剧集详情页点 <b>♡ 收藏</b> 就会出现在这里。</div>';
  }
  if (his.length && !favs.length) {
    html += '<div class="sec">最近观看（' + his.length + '）</div><div class="grid">' +
      his.slice(0, 30).map(x => card(x, '第 ' + (x.ep || 1) + ' 集')).join('') + '</div>';
  } else if (his.length && favs.length) {
    html += '<div class="sec">最近观看（' + his.length + '）</div><div class="grid">' +
      his.slice(0, 30).map(x => card(x, '第 ' + (x.ep || 1) + ' 集')).join('') + '</div>';
  }

  app().innerHTML = html;
  window.scrollTo(0, 0);
}

function fmtTime(sec) {
  sec = Math.floor(sec || 0);
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m >= 60) return Math.floor(m / 60) + '时' + (m % 60) + '分';
  return m + ':' + String(s).padStart(2, '0');
}

let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (localStorage.getItem('hg_install_dismissed') === '1') return;
  showInstallBar();
});

function showInstallBar() {
  if (document.getElementById('pwa-bar')) return;
  const bar = document.createElement('div');
  bar.id = 'pwa-bar';
  bar.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;z-index:999;' +
    'background:#1b1b21;border:1px solid #ff7a18;border-radius:14px;padding:12px 14px;' +
    'display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.6)';
  bar.innerHTML =
    '<div style="flex:1;font-size:13px;line-height:1.5">' +
      '<b style="color:#ff7a18">安装到桌面</b><br>' +
      '<span style="color:#999">像 App 一样打开，更快更清爽</span>' +
    '</div>' +
    '<button id="pwa-install" style="padding:9px 16px;font-size:14px">安装</button>' +
    '<button id="pwa-close" class="gh" style="padding:9px 12px;font-size:14px">×</button>';
  document.body.appendChild(bar);

  document.getElementById('pwa-install').onclick = async () => {
    bar.remove();
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    try {
      const res = await deferredPrompt.userChoice;
      if (res && res.outcome === 'accepted') localStorage.setItem('hg_installed', '1');
    } catch (err) {}
    deferredPrompt = null;
  };
  document.getElementById('pwa-close').onclick = () => {
    bar.remove();
    localStorage.setItem('hg_install_dismissed', '1');
  };
}

function maybeShowIosHint() {
  const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone = window.navigator.standalone === true;
  if (isIos && !standalone && !localStorage.getItem('hg_install_dismissed')) {
    setTimeout(showInstallBar, 2500);
  }
}

// Service Worker 注册 (带自动更新: 发现新版就刷新页面)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(reg => {
        // 每 30 分钟检查一次更新
        setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);

        // 发现新 SW 已经接管 → 自动刷新一次 (只刷一次, 防止循环)
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'activated' && navigator.serviceWorker.controller) {
              if (!sessionStorage.getItem('hg_sw_reloaded')) {
                sessionStorage.setItem('hg_sw_reloaded', '1');
                location.reload();
              }
            }
          });
        });

        // 页面重新可见时也检查一次
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      })
      .catch(() => {});
  });
}

// 版本自检: 发现线上有新版就清缓存重载一次
// 机制: 把「线上 index.html」下载下来, 抠出它的 PAGE_BUILD 和当前跑着的比。
// 为什么不用 sw.js 的 VERSION: SW 自己会被缓存, 断网/弱网时拿到的是旧的,
// 版本号永远相等 → 自愈逻辑等于没写。
const PAGE_BUILD = 'hg-v8-20261007';
(function checkBuild() {
  if (sessionStorage.getItem('hg_ver_reload')) return;   // 每次会话只自愈一次
  const url = location.pathname.replace(/[^/]*$/, '') + 'index.html?t=' + Date.now();
  fetch(url, { cache: 'no-store' })
    .then(r => (r.ok ? r.text() : ''))
    .then(t => {
      if (!t) return;
      const m = t.match(/PAGE_BUILD\s*=\s*['"]([^'"]+)/);
      if (!m) return;
      if (m[1] === PAGE_BUILD) return;                    // 版本一致, 没事
      console.info('[湟果] 检测到新版 (' + m[1] + ' != ' + PAGE_BUILD + '), 正在更新…');
      sessionStorage.setItem('hg_ver_reload', '1');
      const reload = () => location.reload();
      const killSW = () => {
        if (!navigator.serviceWorker) return Promise.resolve();
        return navigator.serviceWorker.getRegistrations()
          .then(rs => Promise.all(rs.map(r => r.unregister())))
          .catch(() => {});
      };
      const done = () => killSW().then(reload, reload);
      if (window.caches && caches.keys) {
        caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(done, done);
      } else { done(); }
    })
    .catch(() => {});
})();
</script>
</body>
</html>
