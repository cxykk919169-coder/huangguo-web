  app().innerHTML = '<div class="load"><span class="spin"></span>加载剧集…</div>';
  try {
    const j = await apiRaw('/api/mj/detail?id=' + encodeURIComponent(id));
    if (stale(T)) return;
    if (!j || !j.ok) { showErr(new Error((j && j.error) || '详情取不到')); return; }
    const eps = j.episodes || [];
    const tags = (j.tags || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');
    const coverHtml = j.cover
      ? '<img src="' + esc(coverUrl(j.cover, 'mj')) + '" alt="" onerror="this.style.display=none">'
      : '';
    /* ★ 2026-10-20: 锁集标记。
     *   上游 wallType="vip" 的剧第 2 集起 video 为空 + locked=true。
     *   以前后端拿第 1 集冒充 (已修), 前端也没有任何标记 —— 点哪集都播第 1 集,
     *   看起来像"选集功能坏了"。现在把 locked 如实画出来: 灰底 + 🔒 + title 提示。 */
    const mjTip = j.payable ? '该集为付费内容，购买后可观看' : '该集为会员专享，开通会员后可观看';
    const epHtml = eps.map(function (x) {
      const lk = x.locked || !x.video;
      return '<button class="epbtn' + (lk ? ' lk' : '') + '" data-ep="' + x.ep + '"' +
        (lk ? ' data-lk="1" title="' + mjTip + '"' : '') +
        '>第 ' + x.ep + ' 集' + (lk ? ' 🔒' : '') + '</button>';
    }).join('');
    app().innerHTML =
      '<div class="mjd">' +
        '<div class="top">' +
          '<div class="cv">' + coverHtml + '</div>' +
          '<div class="mt">' +
            '<h1>' + esc(j.title || '') + '</h1>' +
            '<div class="tgs">' + tags + '</div>' +
            '<div class="sub">' +
              (j.serial ? esc(j.serial) + ' · ' : '') +
              '共 ' + (j.eps || eps.length) + ' 集' +
              (j.score ? ' · 评分 ' + j.score : '') +
              (j.free ? ' · <b>免费</b>' : '') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="pl"><div id="mjplayer"></div></div>' +
        '<div class="eps" id="mjepbar">' + epHtml + '</div>' +
        (j.summary ? '<div class="sum">' + esc(j.summary) + '</div>' : '') +
      '</div>';
    const bar = document.getElementById('mjepbar');
    if (bar) {
      bar.addEventListener('click', function (ev) {
        const b = ev.target.closest('.epbtn');
        if (!b) return;
        mjPlay(id, Number(b.getAttribute('data-ep')));
      });
    }
    installScrollTop();
    /* 首播: 优先挑第一个没锁的集 (锁集点进去也只是弹提示, 不如直接落可播的那集) */
    if (eps.length) {
      const firstOk = eps.filter(function (x) { return !(x.locked || !x.video); })[0];
      mjPlay(id, (firstOk || eps[0]).ep);
    }
  } catch (e) { if (!stale(T)) showErr(e); }
}

async function mjPlay(id, ep) {
  const box = document.getElementById('mjplayer');
  if (!box) return;
  /* ★ 2026-10-20: 锁集点了不再发请求假装播第 1 集, 直接给明确提示。 */
  const bar0 = document.getElementById('mjepbar');
  const btn0 = bar0 && bar0.querySelector('.epbtn[data-ep="' + ep + '"]');
  if (btn0 && btn0.getAttribute('data-lk') === '1') {
    const tip = btn0.getAttribute('title') || '该集为会员专享，开通会员后可观看';
    box.innerHTML = '<div class="err" style="line-height:1.9">🔒 ' + esc(tip) +
      '<br><span style="opacity:.72;font-size:13px">上游对这一集不返回播放地址，本站拿不到真源；' +
      '换一部单集作品或选未标锁的集数可以正常看。</span></div>';
    if (toast) toast(tip);
    return;
  }
  box.innerHTML = '<div class="load"><span class="spin"></span>取播放源…</div>';
  const bar = document.getElementById('mjepbar');
  if (bar) {
    Array.prototype.forEach.call(bar.querySelectorAll('.epbtn'), function (b) {
      b.classList.toggle('on', Number(b.getAttribute('data-ep')) === ep);
    });
  }
  try {
    const j = await apiRaw('/api/mj/play?id=' + encodeURIComponent(id) + '&ep=' + ep);
    if (!j || !j.ok) {
      /* 后端锁集回 403 + locked:true —— 用同一套提示, 不要笼统说"取不到播放源" */
      const msg = (j && j.locked)
        ? '🔒 ' + ((j && j.error) || '该集为会员专享，开通会员后可观看')
        : '⚠️ ' + ((j && j.error) || '这一集取不到播放源');
      box.innerHTML = '<div class="err">' + esc(msg) + '</div>';
      return;
    }
    box.innerHTML = '<video id="mjv" controls playsinline webkit-playsinline preload="metadata" style="width:100%;border-radius:12px;background:#000"></video>';
    const v = document.getElementById('mjv');
    const src = j.url;
    if (window.Hls && Hls.isSupported()) {
      if (window.__mjhls) { try { window.__mjhls.destroy(); } catch (e) {} }
      const hls = new Hls({ maxBufferLength: 30, manifestLoadingTimeOut: 20000 });
      hls.loadSource(src);
      hls.attachMedia(v);
      hls.on(Hls.Events.ERROR, function (evt, data) {
        if (!data || !data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else { hls.destroy(); v.src = src; }
      });
      window.__mjhls = hls;
    } else {
      v.src = src;
    }
    v.play().catch(function () {});
  } catch (e) {
    box.innerHTML = '<div class="err">' + esc(String((e && e.message) || e)) + '</div>';
  }
}

/* ===================== 列表 (无限滚动) ===================== */
let LOADING_MORE = false;
let HAS_MORE = true;
const MAX_PAGES = 20;              // 黄果: 上游 114 页, 但滚到 20 页够了

// 黄豆短剧 985 部 / 每页 20 ≈ 50 页; 黄果保持 20 页上限
function maxPages() { return SITE === 'hd' ? 60 : MAX_PAGES; }

/**
 * 视图令牌: 每次导航 (首页/搜索/详情/切站) 自增。
 * 异步请求回来时如果令牌变了, 就丢弃结果 —— 防止"慢的旧请求覆盖新页面"。
 */
let VIEW_TOKEN = 0;
function newView() { return ++VIEW_TOKEN; }
function stale(t) { return t !== VIEW_TOKEN; }

/* ===================== 返回键接管 =====================
 * 进详情页 pushState 一层; 手机物理返回/手势返回触发 popstate → 回列表,
 * 不再直接退出网站。顶部「‹ 返回列表」按钮走 goBack() 同一条路。 */
let VIEW_DETAIL = false;
function pushDetailState() {
  VIEW_DETAIL = true;
  try { history.pushState({ hg: 'detail' }, '', location.href); } catch (e) {}
}
function goBack() {
  if (VIEW_DETAIL) history.back();   // popstate 统一处理
  else goHome();
}
window.addEventListener('popstate', () => {
  if (VIEW_DETAIL) {
    VIEW_DETAIL = false;
    goHome();
  }
});

async function goHome() {
  VIEW_DETAIL = false;   // 任意入口回列表都清掉详情标记, 防 popstate 循环
  const T = newView();
  app().innerHTML = '<div class="load"><span class="spin"></span>加载中…</div>';
  LOADING_MORE = false;
  HAS_MORE = true;
  curPage = 1;
  try {
    // 首屏先等探测结果 (谁快用谁), 避免国内用户白等 workers.dev 超时
    if (SITE === 'hg' && WORKER_OK === null) await bootProbe();
    // 黄豆短剧: 先拉分类
    if (SITE === 'hd' && !HD_CATS_LOADED) await loadHdCats();
    // EROSHORT: 先预热快照 + 拉分类 (上游走公共中转, 命中率不稳, 快照是主源)
    if (SITE === 'es') { esWarmSnap(); if (!ES_CATS_LOADED) await loadMgCats(); }
    // 海角: 先 3s 探测定型 Worker 可用性 (探不到直接快照, 不干等超时)
    if (SITE === 'hjw' && WORKER_OK === null) await hjwProbe();
    const j = await api('/api/list', { cat: curCat, page: 1 });
    if (stale(T)) return;                     // 期间用户已经切走/点进详情
    if (!j.items || !j.items.length) {
      // 品牌板块没内容时 j.notice 里写清了原因和官方入口 —— 别用一句"稍后再试"糊弄
      const msg = j.notice ? esc(j.notice).replace(/\n/g, '<br>') : '没有内容，稍后再试';
      app().innerHTML = '<div class="err">' + msg + '</div>';
      return;
    }
    if (SITE === 'hg') applyCoverCache(j.items);
    SEEN_IDS = new Set(j.items.map(x => String(x.id)));
    /* 黄豆详情接口不回封面, 从列表里捞 —— 存一份给 hdCoverOf 用 */
    if (SITE === 'hd') window.__HD_LIST = j.items;

    // ---- 海角首页: 分区楼层 (复刻源站) ----
    if (SITE === 'hjw' && j.sections && j.sections.length) {
      const secs = j.sections.filter(s => s.items && s.items.length);
      app().innerHTML = secs.map(s => {
        const cards = s.items.map(x => cardHtml(Object.assign({}, x, { site: 'hjw' }))).join('');
        return '<section class="hjwsect">' +
          '<div class="hjwsect-h"><b>' + esc(s.name) + '</b>' +
            '<span class="more" onclick="pickCat(\'' + esc(s.slug) + '\')">更多 ›</span>' +
          '</div>' +

          '</section>';
      }).join('') +
      '<div class="sentinel" id="sentinel"><span id="sentineltxt">共 ' + secs.length + ' 个板块</span></div>';
      HAS_MORE = false;
      hjwDecryptScan();
      installScrollTop();
      return;
    }

    const gridCls = (SITE === 'hjw') ? 'grid hjwgrid' : 'grid';

    /* ★ 2026-10-19 新增: 数据状态条
     *   黄豆以前首页读静态快照 (2026-10-17 的 117 部), 上游天天更新页面却一直
     *   不动 —— 用户以为"网站不更新"。换到实时接口后加这条, 一眼能看出数据是活的:
     *   共多少部 / 全部免费 / 更新时间 / 数据来源。
     *   只对黄豆显示, 其它模块布局不变。 */

      /* 上游列表里的最新 updatedAt, 用来显示"更新到哪天" */

      const live = (j.from === 'hddj-live');
      statBar =
        '<div class="hdstat">' +
          '<span class="hdstat-n">共 <b>' + tot + '</b> 部</span>' +

    app().innerHTML =
      statBar +
      '<div class="' + gridCls + '" id="grid">' + j.items.map(cardHtml).join('') + '</div>' +

    if (SITE === 'hjw') hjwDecryptScan();
    // EROSHORT: 单页全量返回, 无分页, 直接标记到底
    if (SITE === 'es') {
      HAS_MORE = false;
      const s = document.getElementById('sentineltxt');
      if (s) s.textContent = '共 ' + SEEN_IDS.size + ' 部（' + (curCat || '全部') + '）';
    }
    setupInfinite();
    installScrollTop();
  } catch (e) { if (!stale(T)) showErr(e); }
}

let SEEN_IDS = new Set();

// 加载下一页, 追加到列表末尾
async function loadMore() {
  if (LOADING_MORE || !HAS_MORE) return;
  if (curPage >= maxPages()) {
    HAS_MORE = false;
    const s = document.getElementById('sentineltxt');
    if (s) s.textContent = '已经到底了（共 ' + SEEN_IDS.size + ' 部）';
    return;
  }
  LOADING_MORE = true;
  const st = document.getElementById('sentineltxt');
  if (st) st.textContent = '正在加载…';
  try {
    const next = curPage + 1;
    // 黄豆短剧用 slug 筛选; 黄果用 cat
    const j = await api('/api/list', (SITE === 'hd' && curCat !== '')
      ? { cat: curCat, page: next }
      : { cat: curCat, page: next });
    const items = (j.items || []).filter(x => x && !SEEN_IDS.has(String(x.id)));
    if (!items.length) {
      // 这一页全是已见过的 (上游分页有重叠), 直接跳下一页继续试
      curPage = next;
      if (next >= maxPages()) {
        HAS_MORE = false;
        if (st) st.textContent = '已经到底了（共 ' + SEEN_IDS.size + ' 部）';
      }
      return;
    }
    items.forEach(x => SEEN_IDS.add(String(x.id)));
    applyCoverCache(items);
    const grid = document.getElementById('grid');
    if (grid) {
      const tmp = document.createElement('div');
      tmp.innerHTML = items.map(cardHtml).join('');
      while (tmp.firstChild) grid.appendChild(tmp.firstChild);
    }
    fillMissingCovers(items);
    if (SITE === 'hjw') hjwDecryptScan();
    curPage = next;
    if (st) st.textContent = '已加载 ' + SEEN_IDS.size + ' 部，继续下滑';
  } catch (e) {
    HAS_MORE = false;
    if (st) st.textContent = '加载失败，稍后再试';
  } finally {
    LOADING_MORE = false;
  }
}

// 用 IntersectionObserver 监听底部哨兵
let OBS = null;
function setupInfinite() {
  if (OBS) { OBS.disconnect(); OBS = null; }
  if (!('IntersectionObserver' in window)) {
    // 老浏览器降级: 监听滚动
    window.onscroll = () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 600) loadMore();
    };
    return;
  }
  window.onscroll = null;
  const sentinel = document.getElementById('sentinel');
  if (!sentinel) return;
  OBS = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (en.isIntersecting) loadMore();
    }
  }, { rootMargin: '600px 0px' });
  OBS.observe(sentinel);
}

// 回到顶部按钮
function installScrollTop() {
  let btn = document.getElementById('totop');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'totop';
    btn.innerHTML = '↑';
    btn.title = '回到顶部';
    btn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
    document.body.appendChild(btn);
  }
  const show = () => {
    const b = document.getElementById('totop');
    if (!b) return;
    const inList = document.getElementById('grid');
    b.style.display = (inList && window.scrollY > 600) ? 'block' : 'none';
  };
  window.removeEventListener('scroll', show);
  window.addEventListener('scroll', show, { passive: true });
  show();
}

/**
 * 封面 URL 包装
 * 黄果的封面在 pic.wirqed.cn (带 auth_key), 虽然返回 ACAO:* 但有些网络环境
 * 会被运营商拦截 / 混合内容拦。走 Worker /img 代理最稳; Worker 不可达时用原图。
 */
function coverUrl(u, src) {
  if (!u) return '';
  const s = String(u).trim();
  const cur0 = src || SITE;
  /* ★ 2048 的封面是本站的相对路径 (/api/dt/img?u=…),
   *   必须在下面那条「非 http 就直接返回」之前处理, 否则会被原样返回,
   *   浏览器再按页面域名去拼 → 404。 */
  if (cur0 === 'dt') {
    /* 后端 dtCard2 已经给了绝对封面地址; 只有相对路径才需要套代理。
     * 原来无脑套 /api/dt/img?u= 会把绝对地址再编码一层 (能显示但白绕一跳)。 */
    if (/^https?:\/\//i.test(s)) return s;
    const p = s.indexOf('/api/dt/img') === 0 ? s : ('/api/dt/img?u=' + encodeURIComponent(s));
    const base = (typeof API === 'string' && API) ? API
               : (typeof DEFAULT_API === 'string' ? DEFAULT_API : '');
    return base ? (base + p) : p;
  }
  /* ★ 黄果漫剧: 后端已经把 .bnc 封面改写成 /api/mj/img?u=… (Worker 上的解密接口)。
   *   必须在「非 http 直接返回」之前处理, 否则会被原样丢给浏览器,
   *   在 Pages 域名下变成 https://xxx.github.io/api/mj/img → 404。
   *   站内相对路径 /api/uploads/… 后端已补成绝对地址, 这里兜底也拼 origin。 */
  if (cur0 === 'mj') {
    const base = (typeof API === 'string' && API) ? API
               : (typeof DEFAULT_API === 'string' ? DEFAULT_API : '');
    if (/^\/api\//.test(s)) return base ? (base + s) : s;
    if (!/^https?:\/\//i.test(s)) return s;
    return s;
  }
  if (!/^https?:\/\//i.test(s)) return s;
  // 占位图直接透传, 没必要代理
  if (/cover-placeholder|placeholder\.(png|webp)/i.test(s)) return s;

  const cur = src || SITE;

  // 黄豆的封面是 CloudFront, 直连就很好, 不折腾
  if (cur === 'hd') return s;

  // EROSHORT: 封面在 Cloudflare R2 公开桶 (pub-*.r2.dev), 无防盗链,
  // <img> 不受 CORS 限制, 直接原图最稳 —— 走代理反而多一跳。
  if (cur === 'es') {
    return s;
  }

  // 海角: 图片床 pic.wlwvch.cn 无防盗链 + 国内直连通 + <img> 不受 CORS 限制,
  // 直接原图 —— 走 /proxy/ 反而在 Worker 被墙时挂起/失败 (实测 proxy 透传有问题)
  if (cur === 'hjw') {
    return s;
  }

  // 黄果: 封面是 AES 加密的, 必须走 /img 解密
  if (typeof API === 'string' && API && WORKER_OK !== false) {
    return API + '/img?u=' + encodeURIComponent(s);
  }
  return s;
}

/**
 * 卡片渲染
 * it.site 可选: 'hg' | 'hd' — 全站搜索结果里每条自带来源, 点进去才知道该走哪个播放器。
 * 不传就用当前板块 SITE。
 */
function cardHtml(it) {
  const src = it.site || SITE;
  const cv = coverUrl(it.cover, src);
  // data-hg="1" 会让 onerror 直接认输 (黄果封面是 AES 加密的, 直连必失败)。
  // ERO 封面是 R2 公链, 无防盗链, 直连通常成功; 万一失败也值得退回原图再试一次,
  // 所以 es 不打这个标记。
  const hgFlag = (src === 'hd' || src === 'hjw' || src === 'es' || src === 'dt' || src === 'mj') ? '' : ' data-hg="1"';
  const SITE_LABEL = { hd: '黄豆', es: 'ERO', hg: '黄果', hjw: '海角' };
  const tag = it.showSite
    ? '<div class="badge src" style="left:auto;right:6px;background:rgba(10,10,14,.72)">' +
      (SITE_LABEL[src] || '黄果') + '</div>'
    : '';

  // ---- 海角卡片 (复刻源站观感) ----
  if (src === 'hjw') {
    const isArt = it.isArticle || (it.kind === 'article');
    const kindBadge = isArt
      ? '<div class="badge art">图文</div>'
      : (it.isVideo ? '' : '');
    const imgTag = it.imageCount
      ? '<div class="itag">🖼 ' + it.imageCount + '</div>'
      : '';
    const sub = [
      it.views ? '<span class="vp">' + esc(it.views) + '</span>' : '',
      it.date ? '<span>' + esc(String(it.date).slice(5, 10)) + '</span>' : '',
    ].filter(Boolean).join('');
    return '<div class="item hjw" data-id="' + esc(it.id) + '" data-site="hjw"' +
      ' onclick="openVid(\'' + esc(it.id) + '\',\'hjw\')">' +
      '<div class="thumb">' +
        (cv
          ? '<img loading="lazy" alt="" data-hjwenc="' + esc(it.cover) + '">'
          : '') +
        '<div class="ph" style="' + (cv ? 'display:none' : '') + '">🎬</div>' +
        kindBadge + imgTag + tag +
      '</div>' +
      '<div class="t">' + esc(it.title) + '</div>' +
      '<div class="e">' + (sub || '') + '</div>' +
      '</div>';
  }

  /* ★ 2026-10-19 第一项: 卡片显示「已完结 / 更新中」。
   *   上游 isEnded 全是 false（实测 0/1026 为 true，不可用），
   *   真实状态只写在 remarks 里，格式恒为两种：
   *     "全N集"     → 已完结
   *     "更新至N集" → 更新中，当前 N 集
   *   注意 remarks 的 N 和 episodeCount 经常对不上（时停手表 remarks 全5集
   *   但实际 3 集；我的岳母苏沛真 remarks 更新至8集 但实际 30 集），
   *   所以**集数以实际 episodes 为准**，remarks 只取"是否完结"这一个信息。 */
  const rmk = String(it.remarks || '').trim();
  /* 魔改那批的集数是我们按"可播"裁剪过的，不是上游标称值，
   * remarks 里写的"更新至N集"会和实际对不上，所以整批不显示完结/更新状态。 */
  const skipState = !!it._mg;
  const isFull = !skipState && /^全\d+集$/.test(rmk);
  const isUpdating = !skipState && /^更新至\d+集$/.test(rmk);
  const realEp = Number(it.ep) || Number(it.episodeCount) || Number(it.epTotal) || 0;

  /* 角标: 已完结 / 更新中（魔改那批用「魔改」标记，不参与完结判断） */
  let stateBadge = '';
  if (src === 'hd' && !skipState) {
    if (isFull) stateBadge = '<div class="badge done">已完结</div>';
    else if (isUpdating) stateBadge = '<div class="badge ongo">更新中</div>';
  }

  return '<div class="item" data-id="' + esc(it.id) + '" data-site="' + esc(src) + '"' +
    ' onclick="openVid(\'' + esc(it.id) + '\',\'' + esc(src) + '\')">' +
    '<div class="thumb">' +
      (cv
        ? /* ★ 黄豆封面单张要 2s (CloudFront 绕路)。lazy 时用户一滚就换屏,
 *   没等到的图永久空着 —— 表现就是「封面不显示」。黄豆改 eager,其余站保持 lazy。 */
        '<img ' + (src === 'hd' ? 'loading="eager" decoding="async"' : 'loading="lazy"') +
          ' src="' + esc(cv) + '" data-raw="' + esc(it.cover) + '"' + hgFlag +
          ' onload="this.classList.add(\'ok\')" onerror="hgImgFallback(this)">'
        : '') +
      '<div class="ph" style="' + (cv ? 'display:none' : '') + '">🎬</div>' +
      (realEp ? '<div class="badge">' + realEp + '集</div>' : '') +
      stateBadge +
      tag +
    '</div>' +
    '<div class="t">' + esc(it.title) + '</div>' +
    '<div class="e">' + (realEp ? realEp + ' 集' : '') +
      (isFull ? ' · 完结' : (isUpdating ? ' · 更新中' : '')) + '</div>' +
    '</div>';
}

/**
 * 图片加载失败的多级兜底:
 *   黄果: 原图是 AES 加密的, 直连一定失败 → 直接认输显示占位, 别白试一次
 *   其余: 代理失败 → 试原图直连 → 还失败才认输
 */
function hgImgFallback(img) {
  const raw = img.getAttribute('data-raw') || '';
  const step = img.getAttribute('data-fb') || '0';
  const isHg = img.getAttribute('data-hg') === '1';
  if (!isHg && step === '0' && raw && img.src.indexOf('data:') !== 0) {
    // 第一步: 换成原图直连
    img.setAttribute('data-fb', '1');
    img.src = raw;
    return;
  }
  // 第二步: 认输, 显示占位
  img.style.display = 'none';
  const ph = img.nextElementSibling;
  if (ph && ph.classList.contains('ph')) ph.style.display = 'flex';
}

/**
 * 补齐缺失封面
 * 从列表解析出来的条目可能没有 cover (比如热搜榜来源的纯文字条目),
 * 这些条目后台单独去详情页抓 coverSrc, 抓到后原地更新 DOM。
 * 结果存 localStorage 永久缓存, 下次秒出。
 */
const COVER_CACHE_KEY = 'hg_cover_cache_v1';
let COVER_CACHE = (() => {
  try { return JSON.parse(localStorage.getItem(COVER_CACHE_KEY) || '{}'); }
  catch (e) { return {}; }
})();
let COVER_SAVE_T = null;

function saveCoverCache() {
  clearTimeout(COVER_SAVE_T);
  COVER_SAVE_T = setTimeout(() => {
    try {
      const keys = Object.keys(COVER_CACHE);
      // 只留最近 800 条, 防止 localStorage 爆掉
      if (keys.length > 800) {
        const keep = {};
        keys.slice(-800).forEach(k => { keep[k] = COVER_CACHE[k]; });
        COVER_CACHE = keep;
      }
      localStorage.setItem(COVER_CACHE_KEY, JSON.stringify(COVER_CACHE));
    } catch (e) { /* 配额满了就算了 */ }
  }, 300);
}

// 先用缓存里已有的封面, 一步补上
function applyCoverCache(items) {
  let n = 0;
  for (const it of items) {
    if (!it.cover && COVER_CACHE[it.id]) { it.cover = COVER_CACHE[it.id]; n++; }
  }
  return n;
}

async function fillMissingCovers(items) {
  const missing = items.filter(x => !x.cover && !COVER_CACHE[x.id]);
  if (!missing.length) return;

  // 限制并发 3 个, 别把上游打挂
  const QUEUE = missing.slice();
  let done = 0;

  async function worker() {
    while (QUEUE.length) {
      const it = QUEUE.shift();
      try {
        const v = await api('/api/video', { id: it.id });
        const cover = v && v.cover ? String(v.cover).trim() : '';
        if (cover && cover.startsWith('http')) {
          COVER_CACHE[it.id] = cover;
          saveCoverCache();
          patchCard(it.id, cover);
        }
      } catch (e) { /* 补不到就算了, 保持占位图 */ }
      done++;
    }
  }
  await Promise.all([worker(), worker(), worker()]);
}

// 原地把某张卡片的占位图换成真图 (不动整页, 不影响滚动位置)
function patchCard(id, cover) {
  const el = document.querySelector('.item[data-id="' + id + '"] .thumb');
  if (!el) return;
  const ph = el.querySelector('.ph');
  let img = el.querySelector('img');
  if (!img) {
    img = document.createElement('img');
    img.loading = 'lazy';
    el.insertBefore(img, el.firstChild);
  }
  img.setAttribute('data-raw', cover);
  img.setAttribute('data-fb', '0');
  img.setAttribute('data-hg', (SITE === 'hd') ? '0' : '1');
  img.onerror = function () { hgImgFallback(this); };
  img.style.display = '';
  img.src = coverUrl(cover);
  if (ph) ph.style.display = 'none';
}

/* ===================== 全站搜索 ===================== */
/**
 * 一处搜两个板块:
 *   纯数字 → 直接当 ID 打开 (当前板块优先)
 *   其它   → 同时打黄果和黄豆的搜索接口, 合并成一份结果
 *            每条自带 site 标记 + 角标, 点进去自动走对应的播放器
 * 单边失败不影响另一边 (网络抖动 / 上游抽风都可能只挂一边)。
 */

// 豆腐块搜索关键字匹配: 标题优先, 其次简介/标签/年份
// (直连上游时的兜底; Worker 在线时由 Worker 侧做全站过滤, 比这个准)
function hitTitle(it, kw) {
  const low = kw.toLowerCase();
  const fields = [it.title, it.name, it.description, it.remarks, it.year];
  if (Array.isArray(it.tags)) fields.push(it.tags.join(' '));
  return fields.some((f) => f && String(f).toLowerCase().indexOf(low) >= 0);
}

/**
 * 黄豆搜索。
 * 上游 /videos?keyword= 是摆设 (传什么词都返回同一份热度榜, 实测确认),
 * 所以有两条路:
 *   Worker 在线 → /api/hd/search 已经在服务端拉了全站 985 条并过滤好, 直接用
 *   直连模式   → 前端自己拉若干页再本地过滤 (拉不了全站, 覆盖有限)
 */
async function hdSearch(kw, pages) {
  /* ★ 2026-10-19: 搜索要同时覆盖两个库。
   *   官方站 1026 部 (hddj.zen-vip.com) + 魔改独有 54 部 (/api/hd/exclusive)。
   *   以前只搜官方站, 那 54 部搜不出来 —— 比如搜「高三爱情故事」只能看到
   *   前传/番外, 看不到魔改侧的 41 集合并版。
   *   两边并行, 各自兜错, 结果按前缀区分 (mg: 前缀交给详情/播放分流)。 */
  const grabOfficial = (async function () {
    try {
      const j = await hdApi('/api/search', { q: kw });
      if (j && Array.isArray(j.items) && j.items.length) return j.items;
      if (j && j.poolSize) return [];          // Worker 搜过了, 确实没命中
    } catch (e) { /* Worker 不通, 走下面的直连兜底 */ }

    // 兜底: 前端拉多页本地过滤
    pages = pages || 6;
    const shots = [];
    for (let p = 1; p <= pages; p++) shots.push(p);

    const rs = await Promise.all(shots.map((p) =>
      apiOf('hd', '/api/list', { page: p })
        .then((j) => (j && j.items) || [])
        .catch(() => [])
    ));

    const seen = {};
    const out = [];
    for (const arr of rs) {
      for (const it of arr) {
        if (!it || it.id == null) continue;
        const k = String(it.id);
        if (seen[k]) continue;
        seen[k] = 1;
        out.push(it);
      }
    }
    return out.filter((it) => hitTitle(it, kw));
  })().catch(function () { return []; });

  const grabMg = (async function () {
    if (WORKER_OK === false || !API) return [];
    try {
      const r = await fetch(API + '/api/hd/exclusive?q=' + encodeURIComponent(kw), { method: 'GET' });
      const j = await r.json();
      if (!j || !j.ok) return [];
      return (j.items || []).map(function (x) {
        return Object.assign({}, x, {
          id: 'mg:' + x.id,
          ep: x.ep, epTotal: x.ep,
          badge: '魔改', site: 'hd', _mg: 1,
        });
      });
    } catch (e) { return []; }
  })();

  const both = await Promise.all([grabOfficial, grabMg]);
  return both[0].concat(both[1]);
}

async function doSearch() {
  const kw = document.getElementById('q').value.trim();
  if (!kw) { goHome(); return; }
  if (/^\d+$/.test(kw)) { openVid(kw, SITE); return; }

  const T = newView();
  app().innerHTML = '<div class="load"><span class="spin"></span>搜索中…</div>';

  // 三边并行, 各自兜住异常
  const grabHg = () =>
    apiOf('hg', '/api/search', { q: kw })
      .then((j) => ({ src: 'hg', items: (j && j.items) || [] }))
      .catch(() => ({ src: 'hg', items: [], err: true }));

  // 黄豆走本地过滤 (上游 keyword 不可靠)
  const grabHd = () =>
    hdSearch(kw, 6)
      .then((items) => ({ src: 'hd', items }))
      .catch(() => ({ src: 'hd', items: [], err: true }));

  // EROSHORT 走 Worker 代理搜索
  const grabMg = () =>
    esApi('/api/list', { q: kw, pageSize: 12 })
      .then((j) => ({ src: 'es', items: (j && j.items) || [] }))
      .catch(() => ({ src: 'es', items: [], err: true }));

  // 海角走浏览器直连搜索
  const grabHjw = () =>
    hjwSearch(kw)
      .then((j) => ({ src: 'hjw', items: (j && j.items) || [] }))
      .catch(() => ({ src: 'hjw', items: [], err: true }));

  const [hgRes, hdRes, mgRes, hjwRes] = await Promise.all([grabHg(), grabHd(), grabMg(), grabHjw()]);
  if (stale(T)) return;

  const tag = (r) => r.items.map((x) => ({ ...x, site: r.src, showSite: true }));
  const hgItems = tag(hgRes);
  const hdItems = tag(hdRes);
  const mgItems = tag(mgRes);
  const hjwItems = tag(hjwRes);
  const all = hgItems.concat(hdItems, mgItems, hjwItems);

  if (!all.length) {
    const noOne = hgRes.err && hdRes.err && mgRes.err && hjwRes.err;
    app().innerHTML = '<div class="load">' +
      (noOne ? '所有板块都没搜到结果（网络或上游异常）' : '没找到「' + esc(kw) + '」') +
      '</div>';
    return;
  }

  let html = '<div class="sec">搜索：' + esc(kw) +
    '（共 ' + all.length + ' 个结果 · 海角 ' + hjwItems.length + ' / ERO ' + mgItems.length +
    ' / 黄豆 ' + hdItems.length + ' / 黄果 ' + hgItems.length + '）</div>';

  if (hjwItems.length || SITE === 'hjw') {
    html += '<div class="sec" style="margin-top:6px">海角网（' + hjwItems.length + '）</div>';
    html += hjwItems.length
      ? '<div class="grid hjwgrid">' + hjwItems.map(cardHtml).join('') + '</div>'
      : '<div class="load" style="padding:14px">' + (hjwRes.err ? '海角搜索暂时不可用' : '海角没有匹配的结果') + '</div>';
  }

  html += '<div class="sec" style="margin-top:22px">EROSHORT（' + mgItems.length + '）</div>';
  html += mgItems.length
    ? '<div class="grid">' + mgItems.map(cardHtml).join('') + '</div>'
    : '<div class="load" style="padding:14px">' + (mgRes.err ? 'EROSHORT 搜索暂时不可用' : 'EROSHORT 没有匹配的结果') + '</div>';

  html += '<div class="sec" style="margin-top:22px">黄豆短剧（' + hdItems.length + '）</div>';
  html += hdItems.length
    ? '<div class="grid">' + hdItems.map(cardHtml).join('') + '</div>'
    : '<div class="load" style="padding:14px">' + (hdRes.err ? '黄豆搜索暂时不可用' : '黄豆没有匹配的结果') + '</div>';

  html += '<div class="sec" style="margin-top:22px">黄果短剧（' + hgItems.length + '）</div>';
  html += hgItems.length
    ? '<div class="grid">' + hgItems.map(cardHtml).join('') + '</div>'
    : '<div class="load" style="padding:14px">' + (hgRes.err ? '黄果搜索暂时不可用（该站国内已不可达）' : '黄果没有匹配的结果') + '</div>';

  app().innerHTML = html;
  window.scrollTo(0, 0);
}

/* ===================== 收藏 + 观看历史 (本地存储) ===================== */
const FAV_KEY = 'hg_favs_v1';
const HIS_KEY = 'hg_history_v1';

/* ---- 搜索防抖 ----
 * 回车/点按钮才触发搜索本身是对的 (全站搜索要打很多请求), 但用户常常
 * 打了字又改主意 —— 这里只在输入框里做轻量的「清空回首页」联动,
 * 并保证连续按回车不会叠着发请求。 */
let __SEARCH_AT = 0;
const _doSearchRaw = doSearch;
async function doSearch() {
  const kw = (document.getElementById('q') || {}).value || '';
  if (!String(kw).trim()) { goHome(); return; }
  const now = Date.now();
  if (now - __SEARCH_AT < 800) return;      // 800ms 内的重复触发直接吞掉
  __SEARCH_AT = now;
  return _doSearchRaw.apply(null, arguments);
}

function loadJSON(k, dflt) {
  try { return JSON.parse(localStorage.getItem(k) || 'null') ?? dflt; }
  catch (e) { return dflt; }
}
function saveJSON(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

// —— 收藏 ——
let FAVS = loadJSON(FAV_KEY, {});        // { id: {id,title,cover,ep,site,ts} }
function isFav(id) { return !!FAVS[String(id)]; }
function toggleFav(item) {
  const id = String(item.id);
  if (FAVS[id]) { delete FAVS[id]; }
  else {
    FAVS[id] = {
      id,
      title: item.title || ('剧集 ' + id),
      cover: item.cover || '',
      ep: item.ep || '',
      site: item.site || SITE,
      ts: Date.now(),
    };
  }
  saveJSON(FAV_KEY, FAVS);
  return isFav(id);
}
function favList() {
  return Object.values(FAVS).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}

// —— 观看历史 ——
let HIS = loadJSON(HIS_KEY, {});         // { id: {id,title,cover,ep,epTotal,pos,dur,site,ts} }
function hisPut(item) {
  const id = String(item.id);
  const old = HIS[id] || {};
  HIS[id] = {
    id,
    title: item.title || old.title || ('剧集 ' + id),
    cover: item.cover || old.cover || '',
    ep: item.ep || old.ep || '1',
    epTotal: item.epTotal || old.epTotal || '',
    pos: (item.pos != null ? item.pos : old.pos) || 0,
    dur: (item.dur != null ? item.dur : old.dur) || 0,
    site: item.site || old.site || curSrc || SITE,
    ts: Date.now(),
  };
  saveJSON(HIS_KEY, HIS);
}
function hisList() {
  return Object.values(HIS).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}
function hisClear() {
  if (!confirm('清空全部观看记录？')) return;
  HIS = {}; saveJSON(HIS_KEY, HIS);
  goHome();
}
function favClear() {
  if (!confirm('清空全部收藏？')) return;
  FAVS = {}; saveJSON(FAV_KEY, FAVS);
  goHome();
}

let curVid = null;
let curEp = '1';
// 当前详情页的来源 (全站搜索点进来的条目可能不属于当前板块)
let curSrc = SITE;

// 记录进度用
let HIS_TIMER = null;

async function openVid(id, from) {
  const T = newView();
  const src = from || SITE;
  // 2048 板块走自己的详情/播放 (单剧单视频, 无选集)
  if (src === 'dt') { openDt(id); return; }
  if (src === 'mj') { openMj(id); return; }
  app().innerHTML = '<div class="load"><span class="spin"></span>加载剧集…</div>';
  try {
    let v;
    if (src === 'es') {
      // EROSHORT: Worker 拉详情 + 集数, 失败则用快照兜住 (只有基本信息, 无集数)
      try {
        v = await esVideo(id);
        if (!v || !v.ok) throw new Error((v && v.error) || '详情失败');
      } catch (e) {
        const snap = await loadSnap('es-list');
        const hit = snap && snap.items.find(x => String(x.id) === String(id));
        if (!hit) throw e;
        v = { ok: true, meta: { id: hit.id, title: hit.title, cover: hit.cover, tags: hit.tags || [], description: hit.desc || '' },
              eps: [], snapshot: true };
      }
    } else if (src === 'hjw') {
      // 海角: Worker 端出网抓详情 (站点不发 ACAO, 浏览器直连会被 CORS 拦)
      // 详情页 data-config 里明文写着 m3u8; 正文与图片也全量带回来
      v = await hjwDetail(id);
      if (!v || v.ok === false) throw new Error((v && v.error) || '详情失败');
      // 归一成前端通用字段
      v = {
        id: v.id,
        title: v.title,
        cover: v.cover,
        author: v.author || '',
        avatar: v.avatar || '',
        views: v.views || '',
        date: v.date || '',
        epTotal: v.isVideo ? 1 : 0,
        tags: v.tags || [],
        catName: v.catName || '',
        catId: v.catId || '',
        desc: v.artText || '',
        // 正文与图片 (图文帖就是靠这两个字段渲染)
        artHtml: v.artHtml || '',
        artText: v.artText || '',
        images: v.images || [],
        imageCount: v.imageCount || (v.images || []).length,
        m3u8: v.m3u8,
        m3u8_h265: v.m3u8_h265,
        isVideo: !!v.isVideo,
        isArticle: v.isArticle === true,
        payGated: false,
        pageUrl: v.pageUrl || '',
        related: v.related || [],
        eps: v.m3u8 ? { '1': v.m3u8 } : {}
      };
    } else if (src === 'hd') {
      /* ★ 黄豆详情 (2026-10-19 换线): 走 /api/hd/video → hddj.zen-vip.com。
       *
       *   历史: 先走 /api/video (老 hddj, 已死) → 改成 /api/hd2/play (hdmgdj)
       *   → 现在 hdmgdj 也死了 (code 2001 请求数据错误)。
       *
       *   现行: /api/hd/video 回 {ok,item:{episodes:[{id,seq,lockKind,
       *   fullPlayable}]}}。episodes[].id 就是 episodeId, 播放时拿它去
       *   /api/hd/play?episodeId= 换直链。抽样 10 部 62 集 lockKind 全 none。 */
      v = await hdDetail(id);
    } else {
      v = src === SITE ? await api('/api/video', { id }) : await apiOf(src, '/api/video', { id });
    }
    if (stale(T)) return;
    if (v.error) { app().innerHTML = '<div class="err">' + esc(v.error) + '</div>'; return; }
    curVid = v;
    curSrc = src;

    // 黄豆短剧: 走自己的播放器
    if (src === 'hd') { pushDetailState(); return renderHdVid(v); }
    // EROSHORT: 走自己的播放器 (集数是数组, 带免费/付费标记)
    if (src === 'es') { pushDetailState(); return renderMgVid(v); }
    // 海角网: 单帖单视频, 无选集
    if (src === 'hjw') { pushDetailState(); return renderHjwVid(v); }

    const eps = Object.entries(v.eps || {});
    const epsKeys = Object.keys(v.eps || {}).sort((a, b) => +a - +b);

    // 从历史里恢复上次看到第几集
    const old = HIS[String(v.id)];
    let startEp = epsKeys.length ? epsKeys[0] : '1';
    let startPos = 0;
    if (old && old.ep && v.eps && v.eps[old.ep]) {
      startEp = String(old.ep);
      startPos = old.pos || 0;
    }
    curEp = startEp;
    const first = (v.eps || {})[startEp] || '';

    // 记历史 (进详情页就算看过)
    hisPut({ id: v.id, title: v.title, cover: v.cover, ep: startEp, epTotal: v.epTotal });

    const faved = isFav(v.id);
    // ★ 2026-10-18 (v19) 关键修复: 「显示集数、却没有播放器」
    //
    //   详情接口**故意不预取播放地址** —— /api/hg/detail 与 /api/xd|my/detail
    //   都只回"有几集", 地址留给 /api/hg/ep、/api/xd/ep 按需取。这样做是对的:
    //   上游 m3u8 带时效签名 (auth_key), 提前取回来放着, 等用户点开时可能已经作废。
    //
    //   但上一版把**播放器容器**的渲染条件错绑在 first (= v.eps[startEp]) 上:
    //     没有预取源 → first 是空串 → 整个 <video> 连同 playbar 都不渲染
    //     → 页面上只剩一排集数按钮, 看起来"只有集数没有播放器";
    //     用户去点集数 → playEp() 第二行 getElementById('pl') 拿到 null 直接 return
    //     → 点击毫无反应, 用户自然认为"一直无法获取上游播放源"。
    //   (实测: /api/hg/ep 与 /api/xd/ep 本身都是 200 + 正常 m3u8, 上游没问题。)
    //
    //   正解: 只要有集数就把播放器摆出来, 首播交给 playEp 现取现播 (见下面首播分支)。
    const playable = !!(v.epTotal || epsKeys.length);
    app().innerHTML =
      '<button class="back" onclick="goBack()">‹ 返回列表</button>' +
      '<div class="card">' +
        '<div class="dhead">' +
          (v.cover ? '<img class="dcover" src="' + esc(coverUrl(v.cover, curSrc)) + '" data-raw="' + esc(v.cover) + '" data-fb="0" data-hg="' + (curSrc === 'hd' ? '0' : '1') + '" onerror="hgImgFallback(this)">' : '') +
          '<div class="dinfo">' +
            '<div class="dtitle">' + esc(v.title) +
              '<button class="favbtn' + (faved ? ' on' : '') + '" id="favbtn" onclick="onFav()">' +
              (faved ? '♥ 已收藏' : '♡ 收藏') +
            '</button>' +
            '</div>' +
            '<div class="dmeta">' +
              (v.epTotal ? '共 <em>' + v.epTotal + '</em> 集' : '') +
              (v.author ? ' · ' + esc(v.author) : '') +
              (v.views ? ' · 👁 ' + esc(v.views) : '') +
              (eps.length ? ' · 已解析 <em>' + eps.length + '</em> 个播放源' : '') +
            '</div>' +
            '<div>' + (v.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' +
          '</div>' +
        '</div>' +
        (v.description ? '<div class="ddesc">' + esc(v.description).slice(0,300) + (v.description.length > 300 ? '…' : '') + '</div>' : '') +
        (playable ?
          '<div class="vwrap"><video id="pl" controls playsinline preload="metadata" poster="' + esc(coverUrl(v.cover, curSrc)) + '"></video>' +
          '<div class="playbar">' +
            '<span class="curep" id="curep">第 ' + startEp + ' 集</span>' +
            '<button class="gh" onclick="step(-1)">上一集</button>' +
            '<button class="gh" onclick="step(1)">下一集</button>' +
            '<span class="spdwrap" id="spdwrap"></span>' +
          '</div>' +
          '<div class="hdpv" id="hdpv" style="display:none"></div>' +
          '<div class="resume" id="resume" style="display:none"></div>' +
          '</div>' : '') +
        (v.epTotal ? '<div class="sec">剧集列表（共 ' + v.epTotal + ' 集）' +
          (eps.length < v.epTotal ? '<button class="gh" id="fillbtn" style="font-size:12px;padding:5px 11px;margin-left:8px" onclick="fetchAllEps()">补齐全部播放源</button>' : '') +
          '</div><div class="eps">' +
          Array.from({ length: v.epTotal }, (_, i) => String(i + 1)).map(e =>
            '<a class="ep' + (e === startEp ? ' on' : '') + '" data-ep="' + e + '" href="javascript:playEp(\'' + e + '\')">第' + e + '集</a>').join('') +
          '</div>' : '<div class="err">未解析到剧集信息</div>') +
      '</div>';
    window.scrollTo(0,0);
    pushDetailState();

    // 首播: 走统一入口 (m3u8 → hls.js), 再挂播放器增强
    //
    //   ★ v19: 详情接口不预取源时 (first 为空), 以前这里只调 initPlayer() 就完事,
    //     播放器永远是空的。现在改成主动去取第一集的源 —— playEp() 内部就是
    //     api('/api/ep') → 板块对应的 /api/<板块>/ep, 与手动点集数走同一条路。
    //   ★ 先 initPlayer 再 playEp: initPlayer 负责倍速/续播/进度保存/自动下一集,
    //     playEp 负责取源并 setVideoSrc, 两者顺序反了会丢掉进度条增强。
    if (first) {
      setVideoSrc(document.getElementById('pl'), first, {
        onFatal: () => {
          const ce = document.getElementById('curep');
          if (ce) ce.textContent = '第 ' + startEp + ' 集（源加载失败，换集或稍后重试）';
        }
      }).then(() => initPlayer(startPos)).catch(() => initPlayer(startPos));
    } else if (playable) {
      initPlayer(startPos);
      playEp(startEp);
    } else {
      initPlayer(startPos);
    }
  } catch (e) { showErr(e); }
}

// 收藏按钮
function onFav() {
  if (!curVid) return;
  const on = toggleFav({ id: curVid.id, title: curVid.title, cover: curVid.cover, ep: curEp });
  const b = document.getElementById('favbtn');
  if (b) {
    b.className = 'favbtn' + (on ? ' on' : '');
    b.textContent = on ? '♥ 已收藏' : '♡ 收藏';
  }
}

/* ===================== 芒果短剧 · 详情页 ===================== */
/**
 * 芒果短剧详情页。
 * 与黄果/黄豆的关键差别:
 *   - v.eps 是数组 [{ep, free, locked, payMethod, payPrice}], 不是 {ep: url} 字典
 *   - 只有 free=true 的集能直接播; 其余返回 402, 点了解析一定失败
 *     所以付费集直接标注"金币", 点击时弹提示并给原站跳转, 不做无用的网络请求
 *   - 播放地址要实时向后端要 (链接带时效 token), 不预取
 */
/* ===================== 海角网详情渲染 ===================== */
/**
 * 海角是 UGC 社区 —— 一个帖子有两种形态:
 *   A) 视频帖: 正文 + 明文 m3u8 播放源
 *   B) 图文帖: 正文 + 若干张明文图片 (没有视频)
 *
 * 两种都完整渲染, 不做任何门槛:
 *   - 正文全量展示 (parseArticle 已剥掉站方地址卡)
 *   - 图片全量展示, 点击可放大 + 左右翻页
 *   - 视频帖底部挂播放器
 *
 * 源站 UI 复刻要点:
 *   - 标题 → 元信息行 (分类/浏览/日期) → 作者行 → 内容流
 *   - 内容流用自己的排版, 图片通栏圆角
 *   - 底部相关推荐网格
 */
function renderHjwVid(v) {
  const id = String(v.id || '');
  const faved = isFav(id);
  const isVideo = !!v.isVideo;
  const imgs = v.images || [];

  curVid = {
    id: id,
    title: v.title || '',
    cover: v.cover || '',
    epTotal: isVideo ? 1 : 0,
    tags: v.tags || [],
    description: v.artText || '',
    eps: v.eps || {},
    _hjw: true,
  };
  curSrc = 'hjw';
  curEp = '1';
  if (isVideo) hisPut({ id: id, title: curVid.title, cover: curVid.cover, ep: '1', epTotal: 1 });

  // ---- 头部 (标题 + 元信息 + 作者) ----
  const head =
    '<div class="hjwhead">' +
      '<h1 class="hjwtitle">' + esc(curVid.title) + '</h1>' +
      '<div class="hjwmeta">' +
        (v.catName ? '<span class="cat" onclick="hjwJumpCat(\'' + esc(v.catId || '') + '\')">' + esc(v.catName) + '</span>' : '') +
        '<span>' + esc(v.date || '') + '</span>' +
        (v.views ? '<span>👁 ' + esc(v.views) + ' 浏览</span>' : '') +
        '<span>' + (isVideo ? '🎬 视频' : '🖼 图文 · ' + imgs.length + ' 图') + '</span>' +
      '</div>' +
      '<div class="hjwauthor">' +
        (v.avatar ? '<img alt="" id="hjwav">' : '') +
        '<div>' +
          '<div class="nm">' + esc(v.author || '匿名海友') + '</div>' +
          '<div class="tm">' + (v.date ? esc(String(v.date).slice(0, 16)) : '') + '</div>' +
        '</div>' +
        '<button class="favbtn' + (faved ? ' on' : '') + '" id="favbtn" onclick="onFav()" style="margin-left:auto">' +
          (faved ? '♥ 已收藏' : '♡ 收藏') + '</button>' +
      '</div>' +
    '</div>';

  // ---- 内容流 ----
  let body = '';

  // 视频帖: 播放器放最前
  if (isVideo && v.m3u8) {
    // 源是 m3u8 → 不在这里塞 src, 渲染后用 setVideoSrc 交给 hls.js (Chrome 原生播不了 m3u8)
    body +=
      '<div class="vwrap"><video id="pl" controls playsinline preload="metadata" poster="' +
        esc(hjwImg(v.cover)) + '"></video></div>' +
      '<div id="resume" class="resume" style="display:none"></div>' +
      '<div id="spd" class="spd"></div>' +
      '<div class="rows" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="sitebtn" onclick="hjwRefresh()">↻ 重新取源</button>' +
        (v.m3u8_h265 ? '<button class="sitebtn" onclick="hjwTryH265()">切 H.265 源</button>' : '') +
      '</div>';
  }

  // 视频帖离线快照: 快照里**刻意不放 m3u8** (那是带 auth_key 的时效签名,
  //   存下来几小时后就失效了), 所以快照态确实取不到播放地址。
  //   上一版只写了一句"离线模式暂不能播放"就结束了 —— 用户看到的是"看不到视频"
  //   却没有任何可操作的东西, 只能自己想到去刷新页面。这正是"海角偶尔离线"的来源:
  //   Worker 可达时一切正常, 偶发不可达就落到快照, 然后**卡在没有出路的一页**。
  //   现在补两件事: ① 明确说清为什么会这样; ② 给一个「重新取源」按钮 ——
  //   它走 hjwRefresh(), 拿到源后会把整页重渲染成带播放器的版本。
  if (isVideo && !v.m3u8) {
    body += '<div style="padding:12px 14px;background:#f6f1e8;border:1px solid #e5d9c3;border-radius:8px;color:#7a653d;font-size:13px">' +
      '🎬 该帖是视频帖, 但当前是<b>离线快照</b> —— 视频源带时效签名, 离线包里不放播放地址, 所以这里暂时没有播放器。<br>' +
      '点下面的「重新取源」联网再取一次即可播放 (网络恢复后也可直接刷新页面)。</div>' +
      '<div class="rows" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="sitebtn" onclick="hjwRefresh()">↻ 重新取源</button>' +
      '</div>';
  }

  // 正文
  if (v.artHtml) {
    body += '<div class="hjwart" id="hjwart">' + hjwSanitizeArt(v.artHtml) + '</div>';
  } else if (v.artText) {
    body += '<div class="hjwart">' + esc(v.artText).replace(/\n/g, '<br>') + '</div>';
  }

  // 标签
  if (curVid.tags.length) {
    body += '<div style="margin-top:18px">' +
      curVid.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>';
  }

  // 相关推荐
  const rel = v.related || [];

  app().innerHTML =
    '<button class="back" onclick="goBack()">‹ 返回列表</button>' +
    head +
    '<div class="card" style="padding:16px 15px">' + body + '</div>' +
    (rel.length
      ? '<section class="hjwrel"><div class="hjwrel-h">相关推荐</div>' +
        '<div class="grid hjwgrid">' +
        rel.map(x => cardHtml(Object.assign({}, x, { site: 'hjw' }))).join('') +
        '</div></section>'
      : '') +
    '<div class="rows" style="margin-top:18px">' +
      (v.pageUrl ? '<a class="sitebtn" href="' + esc(v.pageUrl) + '" target="_blank" rel="noopener">源站原文 ↗</a>' : '') +
    '</div>';

  if (isVideo) {
    hjwBindError();
    if (v.m3u8) {
      // 统一入口: 海角 m3u8 → hls.js
      setVideoSrc(document.getElementById('pl'), hjwProxied(v.m3u8), {
        onFatal: () => toast('视频源加载失败，可点「重新取源」'),
      }).then(() => initPlayer(0));
    } else {
      initPlayer(0);
    }
    if (v.cover) hjwDecryptImage(v.cover).then(u => { const el = document.getElementById('pl'); if (el) el.poster = u; }).catch(() => {});
  }
  hjwBindArt();
  if (v.avatar) { const av = document.getElementById('hjwav'); if (av) hjwDecryptBind(av, v.avatar); }
  hjwDecryptScan();
  window.scrollTo(0, 0);
}

/**
 * 图文帖图片交互: 点击放大 + 左右翻页 + 键盘。
 * 图片 src 统一换成代理地址 (CDN 不保证发 CORS)。
 */
function hjwBindArt() {
  const box = document.getElementById('hjwart');
  if (!box) return;
  const imgs = Array.prototype.slice.call(box.querySelectorAll('img'));
  if (!imgs.length) return;
  imgs.forEach((im, i) => {
    const raw = im.getAttribute('data-raw') || im.getAttribute('src') || '';
    im.setAttribute('data-raw', raw);
    // 图床字节流是密文, 不能直接 <img src> —— 占位 + 解密上图
    hjwDecryptBind(im, raw);
    im.onclick = function (e) { e.preventDefault(); hjwLightbox(imgs, i); };
  });
}

/** 图片预览层 */
let HJW_LB = null;
function hjwLightbox(imgs, i) {
  const list = imgs.map(x => x.getAttribute('data-raw') || x.getAttribute('src') || '');
  function paint() {
    if (!HJW_LB) return;
    const im = HJW_LB.querySelector('img');
    const u = list[i];
    im.src = HJW_BLANK;
    hjwDecryptImage(u).then(du => { im.src = du; })
      .catch(() => { im.style.opacity = '0.35'; });
    HJW_LB.querySelector('.n').textContent = (i + 1) + ' / ' + list.length;
  }
  if (HJW_LB) HJW_LB.remove();
  HJW_LB = document.createElement('div');
  HJW_LB.className = 'hjwlb';
  HJW_LB.innerHTML =
    '<div class="x">✕</div><div class="n"></div>' +
    (list.length > 1 ? '<div class="pv">‹</div><div class="nx">›</div>' : '') +
    '<img alt="">';
  HJW_LB.onclick = function (e) {
    if (e.target === HJW_LB || e.target.className === 'x') { HJW_LB.remove(); HJW_LB = null; }
  };
  const pv = HJW_LB.querySelector('.pv');
  const nx = HJW_LB.querySelector('.nx');
  if (pv) pv.onclick = function (e) { e.stopPropagation(); i = (i - 1 + list.length) % list.length; paint(); };
  if (nx) nx.onclick = function (e) { e.stopPropagation(); i = (i + 1) % list.length; paint(); };
  document.body.appendChild(HJW_LB);
  paint();

  const key = function (e) {
    if (!HJW_LB) { document.removeEventListener('keydown', key); return; }
    if (e.key === 'Escape') { HJW_LB.remove(); HJW_LB = null; document.removeEventListener('keydown', key); }
    if (e.key === 'ArrowLeft' && list.length > 1) { i = (i - 1 + list.length) % list.length; paint(); }
    if (e.key === 'ArrowRight' && list.length > 1) { i = (i + 1) % list.length; paint(); }
  };
  document.addEventListener('keydown', key);
}

/**
 * 正文 HTML 清洗
 * 保留 p / br / img / a / b / i / strong / em / span / blockquote / h1-h4
 * 其余标签一律剥掉。事件属性全清。
 * 图片统一转成 data-raw, 由 hjwBindArt 换成代理地址。
 */
function hjwSanitizeArt(html) {
  // 先清 script / style / iframe 整块
  let s = String(html)
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<style[\s\S]*?<\/style>/gi, '')
    .replace(/<iframe[\s\S]*?<\/iframe>/gi, '')
    .replace(/<!--[\s\S]*?-->/g, '');

  const ALLOW = /^(p|br|img|a|b|i|u|strong|em|span|blockquote|h1|h2|h3|h4|ul|ol|li|div|hr|video|source)$/i;

  s = s.replace(/<\/?([a-zA-Z0-9]+)([^>]*)>/g, function (m, tag, attrs) {
    if (!ALLOW.test(tag)) return '';
    const closing = m.charAt(1) === '/';
    const t = tag.toLowerCase();
    if (closing) return '</' + t + '>';

    if (t === 'br' || t === 'hr') return '<' + t + '>';

    if (t === 'img') {
      const src = (attrs.match(/z-image-loader-url="([^"]*)"/i) ||
                   attrs.match(/data-src="([^"]*)"/i) ||
                   attrs.match(/\ssrc="([^"]*)"/i) || [])[1] || '';
      const u = cleanArtUrl(src);
      // alt 一律置空: 海角帖的 img alt 是帖子标题, 图挂了会显示标题文字冒充图片内容
      if (!u) return '';
      return '<img data-raw="' + esc(u) + '" alt="" loading="lazy">';
    }

    if (t === 'a') {
      const href = (attrs.match(/href="([^"]*)"/i) || [])[1] || '';
      const ok = /^https?:\/\//i.test(href);
      return '<a' + (ok ? ' href="' + esc(href) + '" target="_blank" rel="noopener nofollow"' : '') + '>';
    }

    return '<' + t + '>';
  });

  // 正文里可能有的裸 URL 图片 (有些帖直接贴 z-image-loader-url 在文字里) —— 不管
  return s;
}

function cleanArtUrl(u) {
  u = String(u || '').trim();
  u = u.replace(/^[`'"\s]+/, '').replace(/[`'"\s]+$/, '');
  u = u.replace(/\\u002F/g, '/').replace(/\\\//g, '/');
  return u;
}

/** EROSHORT: 解析并播放某集 (免费集走 resolve, 付费集提示跳原站) */
async function mgPlay(ep) {
  ep = String(ep);
  if (!curVid || !curVid._es) return;
  const v = document.getElementById('pl');
  if (!v) return;

  curEp = ep;
  document.querySelectorAll('.ep').forEach(x => x.classList.remove('on'));
  const el = document.querySelector('.ep[data-ep="' + ep + '"]');
  if (el) { el.classList.add('on'); if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); }
  const ce = document.getElementById('curep');
  if (ce) ce.textContent = '第 ' + ep + ' 集（解析中…）';

  hisPut({ id: curVid.id, title: curVid.title, cover: curVid.cover, ep, epTotal: curVid.epTotal, pos: 0 });

  // 该集的 episode id (详情页时已从 children 拿到)
  const rec = (curVid._epMap || {})[ep];
  const epId = rec && rec.id;
  if (!epId) { if (ce) ce.textContent = '第 ' + ep + ' 集（缺少集标识）'; return; }

  let u = curVid.eps[ep];
  let stego = null;
  if (!u) {
    try {
      const r = await esResolveEp(curVid.id, ep, epId);
      if (r && r.ok && r.format === 'stego_hls' && (r.m3u8 || r.url)) {
        // stego_hls 不能塞进 <video>.src, 必须挂解封装 loader —— 单独走一条路
        stego = r;
      } else if (r && r.ok && r.url) {
        u = r.url;
        curVid.eps[ep] = u;
      } else if (r && r.locked) {
        mgLocked(ep, 0, r.reason);
        return;
      } else if (r && r.netError) {
        // 网络层故障 (上游 CF 拦截 / 中转限流 / Worker 不可达)
        // 绝不能伪装成"付费内容"骗用户去原站 —— 给重试入口。
        mgNetRetry(ep, r.reason);
        return;
      } else if (r && r.pending) {
        // 免费集但需要额外一次 resolve — Worker 已合并, 正常不会走到这
        if (ce) ce.textContent = '第 ' + ep + ' 集（源不可用）';
        return;
      }
    } catch (e) { /* 下面统一报错 */ }
  }

  if (!u && !stego) {
    if (ce) ce.textContent = '第 ' + ep + ' 集（源获取失败）';
    return;
  }

  if (stego) { await esPlayStego(v, stego, ep); return; }

  // EROSHORT 源可能是 mp4 (direct) 或 m3u8 (hls) → 统一入口交给 setVideoSrc
  await setVideoSrc(v, u, {
    onFatal: () => { if (ce) ce.textContent = '第 ' + ep + ' 集（源加载失败）'; },
  });
  v.playbackRate = CUR_SPEED;
  const rt = document.getElementById('resume');
  if (rt) rt.style.display = 'none';
  v.play().catch(() => {});
  if (ce) ce.textContent = '第 ' + ep + ' 集';
}

/**
 * EROSHORT: 网络层取流失败 —— 给重试, 不要谎称"付费内容"。
 *
 * 国内直连时上游被 CF 拦 / 中转限流是常态, 同一集多试几次通常能成。
 * 这里重试 3 次 (间隔递增), 全失败再给原站兜底入口。
 */
async function mgNetRetry(ep, reason) {
  if (!curVid || !curVid._es) return;
  const v = document.getElementById('pl');
  const ce = document.getElementById('curep');
  const rec = (curVid._epMap || {})[ep];
  const epId = rec && rec.id;
  if (!epId) { if (ce) ce.textContent = '第 ' + ep + ' 集（缺少集标识）'; return; }

  const delays = [0, 2500, 5000];
  for (let i = 0; i < delays.length; i++) {
    if (delays[i]) await new Promise(r => setTimeout(r, delays[i]));
    if (ce) ce.textContent = '第 ' + ep + ' 集（线路' + (i + 1) + '/' + delays.length + ' 尝试中…）';
    let r = null;
    try { r = await esResolveEp(curVid.id, ep, epId); } catch (e) { r = null; }
    if (r && r.ok && r.format === 'stego_hls' && (r.m3u8 || r.url)) {
      await esPlayStego(v, r, ep);
      return;
    }
    if (r && r.ok && r.url) {
      curVid.eps[ep] = r.url;
      await setVideoSrc(v, r.url, {
        onFatal: () => { if (ce) ce.textContent = '第 ' + ep + ' 集（源加载失败）'; },
      });
      v.playbackRate = CUR_SPEED;
      v.play().catch(() => {});
      const rt = document.getElementById('resume');
      if (rt) rt.style.display = 'none';
      if (ce) ce.textContent = '第 ' + ep + ' 集';
      return;
    }
    if (r && r.locked) { mgLocked(ep, 0, r.reason); return; }
  }

  // 三次都没拿到 —— 如实说明是网络/线路问题
  if (ce) ce.textContent = '第 ' + ep + ' 集（线路暂不可用）';
  const msg = '第 ' + ep + ' 集 暂时取不到视频流。\n\n' +
              '原因: 上游站点对非浏览器出口做了限制, 取流通道在抖动。\n' +
              '（这不是付费内容提示, 稍后再试通常可恢复）\n\n' +
              '要打开上游原站看吗？';
  if (confirm(msg)) {
    window.open('https://eroshort.net/drama/' + curVid.id, '_blank', 'noopener');
  }
}

/**
 * EROSHORT stego_hls 起播。
 *
 * 上游部分剧把 MPEG-TS 藏进 PNG 的 "teXt"/Comment chunk 里, manifest 仍是标准
 * m3u8、分片却是 .png。原生 <video> 与裸 hls.js 都吃不下, 必须:
 *   1) 用 license 里的 X25519 包裹密钥解出 AES 内容密钥 (hg-stego.js)
 *   2) 给 hls.js 挂自定义 fLoader: 拉 PNG → 解封装成 TS → 交回 MSE
 *
 * manifest 本身走本站 Worker /api/es/raw/* —— 上游 eroshort.net 对数据中心 IP
 * 硬拦 (403), 只有 Worker 边缘出口被放行; 失败再退回上游直连 (住宅网有时能过)。
 */
async function esPlayStego(v, r, ep) {
  const ce = document.getElementById('curep');
  const say = (t) => { if (ce) ce.textContent = t; };

  if (!r || !r.license || !r.mediaId) {
    say('第 ' + ep + ' 集（授权信息缺失）');
    mgNetRetry(ep, 'stego_meta');
    return;
  }
  if (typeof esOpenDecoder !== 'function') { say('第 ' + ep + ' 集（解封装器未加载）'); return; }
  if (!HLS_READY()) { say('第 ' + ep + ' 集（此浏览器不支持）'); return; }

  say('第 ' + ep + ' 集（准备中…）');
  let dec = null;
  try {
    dec = await esOpenDecoder(
      { mediaId: r.mediaId, assetVersion: r.assetVersion, license: r.license },
      ES_BUILD_PROFILE);
  } catch (e) {
    say('第 ' + ep + ' 集（授权解析失败）');
    console.warn('[ERO stego] openDecoder', e);
    return;
  }

  const Loader = esMakeStegoLoader(dec);
  if (!Loader) { say('第 ' + ep + ' 集（播放器未就绪）'); return; }

  // manifest 候选地址:
  //   0) 静态快照自带的 m3u8 文本 → 直接做成 blob URL (国内直连走这条)
  //   1) Worker 原始透传 /api/es/raw/* (Worker 可达时)
  //   2) 上游直连 / Worker /proxy/
  const rel = String(r.url || '');
  const srcs = [];
  let blobUrl = '';
  if (r.m3u8 && /^#EXTM3U/.test(r.m3u8)) {
    try {
      blobUrl = URL.createObjectURL(new Blob([r.m3u8], { type: 'application/vnd.apple.mpegurl' }));
      srcs.push(blobUrl);
    } catch (e) { /* 不支持 blob → 走网络 */ }
  }
  if (rel.indexOf('/api/v1/') === 0) {
    if (typeof API === 'string' && API) srcs.push(API + '/api/es/raw/' + rel.slice('/api/v1/'.length));
    srcs.push('https://eroshort.net' + rel);
  } else if (/^https?:/i.test(rel)) {
    srcs.push(rel);
    if (typeof API === 'string' && API) srcs.push(API + '/proxy/' + encodeURIComponent(rel));
  } else if (rel) {
    if (typeof API === 'string' && API) srcs.push(API + '/proxy/' + encodeURIComponent(rel));
  }

  destroyHls();
  const ok = await stegoHlsLoad(v, srcs, Loader);
  // blob URL 生命周期: hls.js 读完 playlist 后就没用了, 但保守起见留 2 分钟
  if (blobUrl) setTimeout(() => { try { URL.revokeObjectURL(blobUrl); } catch (e) {} }, 120000);
  if (!ok) {
    say('第 ' + ep + ' 集（线路暂不可用）');
    try { dec.destroy(); } catch (e) {}
    return;
  }
  const rt = document.getElementById('resume');
  if (rt) rt.style.display = 'none';
  v.playbackRate = CUR_SPEED;
  v.play().catch(() => {});
  say('第 ' + ep + ' 集');
}

/**
 * 逐个 manifest 候选地址试挂 hls.js (带 stego fLoader)。
 * @returns {Promise<boolean>} 是否有一次 MANIFEST_PARSED 成功
 */
function stegoHlsLoad(video, srcs, Loader) {
  return new Promise((resolve) => {
    let settled = false;
    const finish = (v) => { if (!settled) { settled = true; resolve(v); } };
    let i = 0;

    const tryNext = () => {
      if (i >= srcs.length) { finish(false); return; }
      const src = srcs[i++];
      const h = new Hls({
        progressive: false,          // 与上游一致: 分片是普通 TS, 不需要 progressive
        fLoader: Loader,
        manifestLoadingMaxRetry: 3,
        levelLoadingMaxRetry: 3,
        fragLoadingMaxRetry: 6,
        manifestLoadingRetryDelay: 400,
        fragLoadingRetryDelay: 400,
        fragLoadingMaxRetryTimeout: 20000,
      });
      let advanced = false;
      h.on(Hls.Events.MANIFEST_PARSED, () => finish(true));
      h.on(Hls.Events.ERROR, (evt, d) => {
        if (!d || !d.fatal) return;
        if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { try { h.recoverMediaError(); return; } catch (e) {} }
        if (advanced) return;
        advanced = true;
        try { h.destroy(); } catch (e) {}
        if (HLS_OBJ === h) HLS_OBJ = null;
        tryNext();
      });
      HLS_OBJ = h;
      try {
        h.loadSource(src);
        h.attachMedia(video);
      } catch (e) {
        if (!advanced) { advanced = true; tryNext(); }
      }
    };

    setTimeout(() => { if (!settled) { try { destroyHls(); } catch (e) {} finish(false); } }, 20000);
    tryNext();
  });
}

/** EROSHORT: 上下集 */
function mgStep(d) {
  if (!curVid || !curVid._es) return;
  const v = document.getElementById('pl');
  if (v && v.duration && !v.paused) saveProgress(v.currentTime, v.duration);
  const playable = document.querySelectorAll('.ep:not(.locked)');
  if (!playable.length) return;
  const arr = Array.from(playable).map(x => String(x.dataset.ep));
  let i = arr.indexOf(String(curEp));
  if (i < 0) i = 0;
  const n = i + d;
  if (n < 0) { showToast('已经是第一集'); return; }
  if (n >= arr.length) { showToast('后面是付费集，需上游解锁'); return; }
  mgPlay(arr[n]);
}

function hdEpList(v) {
  const n = Math.min(v.epTotal || 0, 500);

  for (let i = 1; i <= n; i++) {
    s += '<a class="ep' + (i === 1 ? ' on' : '') + '" data-ep="' + i + '" href="javascript:hdPickEp(' + i + ')">第' + i + '集</a>';

// 当前黄豆剧
let HD_CUR = null;         // {id, epTotal, title, cover}
/* 续播: 进入详情页时从历史取回的上次播放位置, 交给 initPlayer 恢复 */
let HD_RESUME_POS = 0;
/* 播放器事件只绑一次 (ended → 自动下一集), 防止切集重复绑定 */
let HD_PLAYER_WIRED = false;
let HD_LINES = [];         // 当前集的多线路
let HD_LINE_I = 0;
let HD_IS_PREVIEW = false; // 当前播的是不是付费集的试看片段

function hdPickEp(ep) {
  if (!HD_CUR) return;
  hdLoadEp(HD_CUR.id, ep, false);
}

function hdStep(d) {
  if (!HD_CUR) return;
  const cur = parseInt(curEp, 10) || 1;
  const next = cur + d;
  if (next < 1) { toast('已经是第一集'); return; }
  if (HD_CUR.epTotal && next > HD_CUR.epTotal) { toast('已经是最后一集'); return; }
  hdLoadEp(HD_CUR.id, next, false);
}

// 加载某一集: /playback → /play → 视频
// T: 可选的视图令牌 (首屏由 renderHdVid 传入); 切集时不传, 用当前令牌
async function hdLoadEp(vid, ep, first, T) {
  const tok = (T === undefined) ? VIEW_TOKEN : T;
  if (first) {
    HD_CUR = { id: vid, epTotal: curVid ? curVid.epTotal : 0, title: curVid ? curVid.title : '', cover: curVid ? curVid.cover : '' };
  }
  const box = document.getElementById('hdlock');
  const video = document.getElementById('pl');
  if (!video) return;
  curEp = String(ep);

  // 集号高亮
  const grid = document.getElementById('hdepgrid');
  if (grid) {
    [...grid.querySelectorAll('.ep')].forEach(a =>
      a.classList.toggle('on', a.getAttribute('data-ep') === String(ep)));
  }
  const ce = document.getElementById('curep');
  if (ce) ce.textContent = '第 ' + ep + ' 集';

  if (box) { box.style.display = 'block'; box.innerHTML = '<span class="spin"></span>正在解析第 ' + ep + ' 集播放地址…'; }

  try {
    /* ★ v20: 播放链取数带重试。
     *   实测 (2026-10-17): /api/hd/ep 约每 10 次有 1 次 502,
     *   同一刻再请求就 200 —— 是上游边缘抖动, 不是剧集不存在。
     *   旧代码一次失败就把 "⚠ 上游返回 502" 摆到用户脸上,
     *   于是表现成"黄豆一直显示上游链接错误, 无法获取播放源"。
     *   现在: 最多 3 次 (间隔 0/400/900ms), 只有全失败才报错,
     *   而且报的是**真实原因**, 不再统一含糊成"解析失败"。 */
    let r = null, lastErr = null;
    const waits = [0, 400, 900];
    for (let i = 0; i < waits.length; i++) {
      if (waits[i]) {
        if (box) box.innerHTML = '<span class="spin"></span>第 ' + ep + ' 集线路抖动，重试中（' + (i + 1) + '/' + waits.length + '）…';
        await new Promise(res => setTimeout(res, waits[i]));
        if (stale(tok)) return;
      }
      try {
        // ★ 走 Worker 的真实协议取源; 只有 Worker 整条不可达才退回本地旧模块
        //   (旧模块打的是已死的 /api/app, 退它只是"别白屏", 不是等价方案)
        try { r = await hdPlay2(vid, ep); }
        catch (e2) { if (!e2 || !e2.fallback) throw e2; r = await HDHd.playEp(vid, ep); }
        lastErr = null; break;
      }
      catch (e) {
        lastErr = e;
        // 付费墙/缺集这类业务结果重试无意义, 立刻退出并把原因交给界面
        if (e && (e.locked || /未找到|需要解锁|金币|VIP|专享|单独解锁/.test(String(e.message || '')))) break;
      }
    }
    if (!r) throw lastErr || new Error('播放地址获取失败');
    if (stale(tok)) return;                    // 期间已切走
    HD_LINES = r.lines || [];
    HD_LINE_I = 0;
    if (box) box.style.display = 'none';

    /* ★ 试看集提示: 付费集的试看片段是真能播的, 但它不是正片。
     *   不提示会让用户以为"这就是全集, 只有 2MB 这么短?" —— 明确标出来。 */
    HD_IS_PREVIEW = !!r.preview;
    {
      const tip = document.getElementById('hdpv');
      if (tip) {
        if (HD_IS_PREVIEW) {
          tip.style.display = 'block';
          tip.innerHTML = '👁 第 ' + esc(String(ep)) + ' 集为付费集，当前播放的是官方试看片段' +
            '<a class="hdplaybtn" style="margin-left:8px;padding:4px 10px" href="' +
            esc(HDHd.h5Url(vid)) + '" target="_blank" rel="noopener noreferrer">去官方看正片</a>';
        } else {
          tip.style.display = 'none';
          tip.innerHTML = '';
        }
      }
    }

    // 记历史
    hisPut({ id: vid, title: HD_CUR.title, cover: HD_CUR.cover, ep: String(ep), epTotal: HD_CUR.epTotal });

    hdSetSrc(HD_LINES[0] ? HD_LINES[0].url : r.playUrl);
    renderHdLines();

    /* ★ 2026-10-19 接入续播（原来黄豆播放器完全没接）：
     *   旧状态: renderHdVid 每次都把历史集数写成 '1'，且播放器从不调 initPlayer —
     *   所以黄豆既不会"从上次位置继续"，也不保存播放进度，切集后进度归零。
     *   现在: initPlayer 负责倍速 + 恢复进度 + 每5秒存进度 + pause/beforeunload 存进度，
     *   自动下一集换成黄豆自己的 hdStep。 */
    if (!HD_PLAYER_WIRED) {
      HD_PLAYER_WIRED = true;
      const pv = document.getElementById('pl');
      if (pv) {
        pv.addEventListener('ended', function () {
          saveProgress(0, pv.duration);
          hdStep(1);
        });
      }
    }
    const resumeAt = (first && HD_RESUME_POS > 5) ? HD_RESUME_POS : 0;
    initPlayer(resumeAt);
  } catch (e) {
    if (stale(tok)) return;
    if (e && e.locked) {
      if (box) {
        box.style.display = 'block';
        box.innerHTML = '🔒 ' + esc(e.message) +
          '<br><a class="hdplaybtn" style="margin-top:10px" href="' + esc(HDHd.h5Url(vid)) +
          '" target="_blank" rel="noopener noreferrer">去官方解锁</a>';
      }
    } else {
      if (box) {
        box.style.display = 'block';
        box.innerHTML = '⚠ ' + esc(e.message || '解析失败') +
          '<br><span style="opacity:.7">已自动重试 3 次；可换个线路，或稍后点本集再试</span>' +
          '<br><a class="hdplaybtn" style="margin-top:10px" href="' + esc(HDHd.h5Url(vid)) +
          '" target="_blank" rel="noopener noreferrer">打开官方线路</a>';
      }
      // 兜底: 给官方入口
      renderHdLines();
    }
  }
}

// 视频源: 黄豆优先直连 mp4, Worker 流代理仅作备选 —— 修挂代理后的 http 400。
//
// 根因 (2026-10): 黄豆 playUrl 是带 ticket 的 mp4 直链, 上游 CDN 不发 ACAO。
//   <video> 播放媒体本身不做 CORS 检查, 所以【直连一定能播】。
//   旧代码在 WORKER_OK!==false 时无条件包 Worker 流代理; 挂代理后 Worker 可达
//   → 强制走 workers.dev → Worker 出口 IP + 短时效 ticket → 上游回 400, 卡死。
//
// 新策略:
//   1) 先探测 Worker 流代理是否真的 200 (HEAD/Range 探测, 800ms 超时);
//   2) 200 → 用代理 (兼容极少数直连被 CORS/网络挡的场景);
//      否则 → 直连 (默认路径, 最稳);
//   3) 播放中若仍出错, onerror 再兜一次。
let HD_PROXY_OK = null;              // null=未探, true/false=已定

function hdProbeProxy(raw) {
  if (HD_PROXY_OK !== null) return Promise.resolve(HD_PROXY_OK);
  if (!API || WORKER_OK === false || typeof fetch !== 'function') {
    HD_PROXY_OK = false;
    return Promise.resolve(false);
  }
  const u = API + '/api/hd/stream?u=' + encodeURIComponent(raw);
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  // ★ 2026-10-18 实测: 800ms 太短。Worker 要回源、上游还可能慢, 冷启动经常 1.5~4s。
  //   800ms 会把「能用的代理」判死, 然后退回直连 —— 而直连恰恰是 400 的来源。
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 6000);
  const opts = { method: 'GET', headers: { Range: 'bytes=0-1' } };
  if (ctl) opts.signal = ctl.signal;
  return fetch(u, opts).then(r => {
    clearTimeout(timer);
    // 206/200 才算代理可用; 400/403/5xx 一律判死
    HD_PROXY_OK = (r.status === 200 || r.status === 206);
    // 用完立刻丢弃 body, 否则会白占一条连接
    try { if (r.body && r.body.cancel) r.body.cancel(); } catch (e) {}
    return HD_PROXY_OK;
  }).catch(() => { clearTimeout(timer); HD_PROXY_OK = false; return false; });
}

/* ===================== 黄豆魔改 真实播放源 =====================
 * Worker /api/hd2/play 走上游真实协议 (匿名设备登录 → 签名 → AES-CBC),
 * 返回上游签好名的 HLS 清单地址 (约 15 分钟有效, 每次现取)。
 *
 * 媒体侧实测 (2026-10-18): 清单放行跨域 (acao 回显来源), 分片 acao:* 且支持 Range,
 * AES-128 密钥在 CDN 上可直取 —— 所以播放器直连即可, 不必再经 Worker 转发。
 *
 * 上游付费墙 (金币 / VIP / 创作者独立解锁) 以业务码返回, 属于对方的商业模式:
 * 这里如实透出到界面, 不当成"故障"。
 */
async function hdPlay2(vid, ep) {
  if (WORKER_OK === false || !API) {
    const e = new Error('Worker 不可用');
    e.fallback = true;
    throw e;
  }
  /* ★ 2026-10-19 换线路: 原来打 /api/hd2/play (hdmgdj), 那套现在返回
   *   {"ok":false,"code":2001,"error":"请求数据错误"} —— 整块黄豆播不了。
   *
   *   改走 /api/hd 这条 (hddj.zen-vip.com), 实测全通:
   *     /api/hd/ep?videoId=&seq=   → episodeId + fullPlayable + lockKind
   *     /api/hd/play?episodeId=    → playUrl (上游 307 跳到 CDN, 是 video/mp4)
   *
   *   ★ 关键: 上游 /play **只认 episodeId 一个参数**。多传 videoId/seq
   *     立刻 400「包含无效或重复的播放参数」—— 这是之前"取不到播放源"的真凶之一。
   */
  const s = await hdSrc(vid, ep);
  if (!s || !s.url) throw new Error('播放地址获取失败');

  /* 魔改独有那批上游回 3 条线路 (free / line2 / line3), 全带出来给用户切;
   * 官方站只有一条 MP4, 就单线路。 */
  const lines = (s.lines && s.lines.length)
    ? s.lines
    : [{ name: '线路1', label: '线路1', url: s.url }];

  return {
    lines: lines,
    playUrl: s.url,
    duration: s.duration || 0,
    hlsKey: s.hlsKey || '',
    preview: false,
    kind: s.kind,          // 'mp4' | 'hls'
  };
}

function hdSetSrc(url) {
  const video = document.getElementById('pl');
  if (!video || !url) return;
  const raw = String(url);

  // 切集时重置探测缓存 (签名每集都换, 不能用上一集的结论)
  HD_PROXY_OK = null;
  video.dataset.hdRaw = raw;
  video.dataset.hdFallback = '';
  video.onerror = null;

  /* ★ 黄豆的播放源是上游签名的 HLS 清单, 但 iwgsqufx.cc 在不少网络下
   *   浏览器直连会被重置 —— curl 拿 200, 页面里 fetch 直接 'Failed to fetch',
   *   hls.js 于是抛 manifestLoadError, 表现就是「一直转圈, 只有集数没有画面」。
   *   所以清单和分片一律走 Worker 的 /api/hd2/px 代取 (清单里的 URI 已在
   *   服务端改写回代理), 不再依赖浏览器能否连上那个域名。
   *   只有 Worker 整体不可用时才退回直连。 */
  if (/\.m3u8(\?|$)/i.test(raw)) {
    const px = (API && WORKER_OK !== false)
      ? (API + '/api/hd2/px?u=' + encodeURIComponent(raw)) : raw;
    if (!HLS_READY()) {              // Safari / iOS 原生 HLS
      video.src = px;
      video.load();
      try { video.play().catch(() => {}); } catch (e) {}
      return;
    }
    destroyHls();
    hlsLoad(video, px, {}).then(res => {
      const v2 = document.getElementById('pl');
      if (v2 !== video) return;                    // 用户已切走
      if (res === 'ok') {
        try { video.play().catch(() => {}); } catch (e) {}
      } else if (px !== raw) {
        // 代理也没起来 → 最后退回直连, 至少不是死等
        hlsLoad(video, raw, {}).then(r2 => {
          const v3 = document.getElementById('pl');
          if (v3 !== video) return;
          if (r2 === 'ok') { try { video.play().catch(() => {}); } catch (e) {} }
          else { try { video.src = raw; video.load(); video.play().catch(() => {}); } catch (e) {} }
        });
      } else {
        try { video.src = raw; video.load(); video.play().catch(() => {}); } catch (e) {}
      }
    });
    return;
  }

  // ---- 非 HLS (mp4 直链) 通路 ----
  const viaW = (API && WORKER_OK !== false)
    ? (API + '/api/hd/stream?u=' + encodeURIComponent(raw)) : '';

  video.onerror = function () {
    if (video.dataset.hdFallback === '1') return;
    video.dataset.hdFallback = '1';
    const cur = String(video.src || '');
    const onProxy = !!(API && cur.indexOf(API) === 0);
    if (onProxy && raw) {
      video.src = raw;
      video.load();
      try { video.play().catch(() => {}); } catch (e) {}
      toast('代理受限，已切直连');
    } else if (!onProxy && viaW) {
      video.src = viaW;
      video.load();
      try { video.play().catch(() => {}); } catch (e) {}
      toast('直连受限，已切代理');
    }
  };

  if (!viaW) {
    video.src = raw;
    video.load();
    try { video.play().catch(() => {}); } catch (e) {}
  } else {
    video.src = viaW;
    video.load();
    try { video.play().catch(() => {}); } catch (e) {}
    hdProbeProxy(raw).then(ok => {
      const v2 = document.getElementById('pl');
      if (v2 !== video) return;
      if (ok) return;
      if (video.dataset.hdFallback === '1') return;
      video.dataset.hdFallback = '1';
      video.src = raw;
      video.load();
      try { video.play().catch(() => {}); } catch (e) {}
      toast('代理受限，已切直连');
    });
  }
}

// 渲染线路按钮
function renderHdLines() {
  const box = document.getElementById('hdlines');
  if (!box) return;

    h += '<span class="hdlinetip">播放线路：</span>' +

      ).join('');

function hdUseLine(i) {

  HD_LINE_I = i;
